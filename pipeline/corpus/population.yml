# Corpus: population (UN World Population Prospects), in the guide's register.
# Exemplars carry the voice, never the numbers: figures belong to the facts sheet.

current-reading:
  - slot: what-the-print-says
    text: >
      India added more people in the UN's latest estimate year than live in many
      countries, but it is adding them more slowly each year. A woman now has fewer
      than two children on average, below the rate that replaces a generation, yet
      births still far outnumber deaths because the parents of today were born when
      families were large. The median Indian is in their late twenties. On the UN's
      central projection the population keeps growing for decades before it turns.
  - slot: what-it-does-not-say
    text: >
      It is not a count. India last counted its people in 2011, and every figure since
      is the UN's model, which the next census will correct. The projection is a set
      of assumptions about children, deaths and migration, not a forecast. A national
      average hides states that are already ageing beside states that are still young.
      We do not know the population to the nearest crore.

misread:
  - quote: "Fertility is below replacement, so the population is shrinking."
    correction: >
      Not yet. The large generations born earlier are having children now; growth
      continues for decades after fertility falls below 2.1.
  - quote: "The census says there are 1.4 billion Indians."
    correction: >
      There has been no census since 2011. The figure is a UN estimate.
