# Corpus: the climate guide, in the dossier register. Exemplars of cadence and moves,
# never of numbers (those belong to a past month).

current-reading:
  - slot: what-the-print-says
    text: >
      India ran warmer than its 1991-2020 average for the month, though not by a
      record margin: the month sat in the upper half of all such months since 1940,
      some way short of the warmest. In plain degrees, the country averaged a little
      under 27°C. Most months of the year so far have run above normal. One warm
      month settles nothing; a run of them, against a baseline that is itself warmer
      than the century before it, is the pattern the long record shows.
  - slot: what-it-does-not-say
    text: >
      It does not say how hot any one place was, or whether the heat came by day or
      by night, dry or humid. It is an average over the whole land of India, and the
      north-west and the north-east can move in opposite directions in the same month.
      The comparison is with 1991-2020, which already includes decades of warming,
      so a month at the average is still warmer than the early twentieth century.
      Recent months are revised as more observations enter the reanalysis. We do not
      know from one month whether the year will end warm or cool.
