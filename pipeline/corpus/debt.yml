# Corpus: debt guide (BIS total credit), in the guide's register. Hand-written exemplars of
# cadence and moves; their numbers are illustrative and belong to no real print.

current-reading:
  - slot: what-the-figures-say
    text: >
      In the September quarter Indian borrowers owed a little under twice a year's
      GDP. Government carried the largest single share. Households were the ones
      moving: their debt rose two points on a year ago, mostly home and personal
      loans, while companies owed slightly less than a year earlier, still working
      down what they borrowed before 2013. The credit gap, the distance between
      private credit and its long-run trend, edged up but stayed below the two
      points at which bank regulators start to worry. China's borrowers, for
      comparison, owe far more.
  - slot: what-they-do-not-say
    text: >
      These are totals for a country of 1.4 billion people. They do not say whether
      the extra household debt sits with salaried families buying flats or with
      small traders rolling over gold loans, and that difference matters more than
      the ratio. A ratio to GDP also falls when prices rise, even if nobody repays
      anything. And BIS revises several years of history every quarter. We do not
      know yet whether this quarter's rise will survive the next revision.

misread:
  - quote: "Debt at twice GDP means the country owes twice what it earns."
    correction: >
      The ratio compares a stock built over many years with one year's income.
      Most of it is owed by Indians to Indians, through their bank deposits.
