# Corpus: the farms guide. Voice exemplars only; their numbers belong to no real print.

current-reading:
  - slot: what-the-print-says
    text: >
      India harvested 312.4 million tonnes of foodgrains in 2021-22, on the agriculture
      ministry's final estimates, 2.8% more than the year before and the largest harvest yet.
      Rice was 128.1 million tonnes, wheat 106.2 and pulses 26.9. The ministry's second advance
      estimate for 2022-23 puts the next harvest at 316.1 million tonnes, a figure it will revise
      twice more. The government held 51.2 million tonnes of rice and wheat on 1 April 2022,
      about two and a half times the buffer norm, and set the support price for common paddy at
      Rs 2,040 a quintal for 2022-23.
  - slot: what-it-does-not-say
    text: >
      The harvest is estimated, not weighed: states measure the area from land records and the
      yield from small sample plots. A record harvest is not a record income. RBI's tables carry
      the support price and the output, not what it cost to grow a quintal, so whether farming
      paid better this year, we do not know. The support price matters only where the government
      buys, and it buys mostly rice and wheat, mostly in a handful of states. Grain in the
      granaries is not grain on the plate.

how-to-read:
  - slot: crop-year
    text: >
      The crop year runs from July to June, so one year holds the kharif crop sown with the
      monsoon and the rabi crop sown in winter. The ministry publishes advance estimates during
      the year and a final estimate about a year after it ends.

misread:
  - quote: "A record harvest this year."
    correction: >
      The first figures for a year are advance estimates, revised over the next year. A record
      on an advance estimate is a forecast; wait for the final estimate.
  - quote: "Farmers get the MSP."
    correction: >
      The minimum support price is what the government pays when it buys. It buys mostly rice and
      wheat in a few states; elsewhere farmers sell at whatever traders pay.
  - quote: "Full granaries mean nobody goes hungry."
    correction: >
      Stocks are grain the government holds, not grain people eat. Hunger depends on whether a
      family can get and afford food.
