# Corpus — Dossier 03 (WPI), in the dossier register.

current-reading:
  - slot: what-the-print-says
    text: >
      Wholesale prices were higher than a year ago, capping a climb that has run
      uninterrupted since the autumn. The engine is not broadly distributed. Fuel
      and power — barely an eighth of the basket — did most of the lifting in a
      single bound. Primary articles, the farm-and-mine end of the index, added
      their own. The quiet two-thirds, manufactured products, rose warm but
      unremarkable by the standards of the decade.
  - slot: what-it-does-not-say
    text: >
      It does not say your cost of living jumped in step. This index stops at the
      factory gate: no rents, no school fees, no services of any kind, and retail
      margins sit between this number and your receipt. What changed arrived
      through the energy pipe, and energy takes months, not weeks, to reach
      consumer prices. And it is provisional — revised to a final figure roughly
      eight weeks from now; the revision is usually small, and occasionally not.

as-of:
  - slot: plate1
    text: >
      Watch the grey line that barely ripples: that is two-thirds of the economy's
      goods. Then watch the dark one, primary articles, which swings through
      double digits in both directions. The headline is their weighted truce — it
      ends up nearer the calm line than the wild one. The 2023 deflation, while
      consumer inflation ran above five, was not a contradiction: the two indices
      measure different terrain.

misread:
  - quote: "Wholesale inflation is 8%, so consumer inflation will be 8%."
    correction: >
      No. The wholesale basket contains no services and no retail margins. In 2023
      the WPI spent months in deflation while the CPI ran above five. Both were
      correct.
