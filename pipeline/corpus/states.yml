# Corpus: state economies (MoSPI regional accounts, fixed panel of states), in the guide's register.

current-reading:
  - slot: what-the-print-says
    text: >
      The richest state still produces many times as much per person as the poorest, but
      the multiple is smaller than it was in 2011-12. The spread across all states has
      narrowed too, slowly. The middle state's economy grew faster than its prices, year
      after year, except in the lockdown year. In rupees, though, the distance between the
      top and the bottom kept growing.
  - slot: what-it-does-not-say
    text: >
      It does not say what a family in Bihar earns. Income per person here is what is
      produced in a state divided by the people who live there, so workers who cross a
      border to work, or send money home from another state, are counted where they work.
      Each state counts once, however many people live in it. And the latest year is an
      estimate the state will revise. Whether the gap in living standards has narrowed as
      much as the gap in production, we do not know from these figures.

misread:
  - quote: "People in the richest state earn ten times what people in Bihar earn."
    correction: >
      No. Per-capita product measures production per resident, not income received.
      Commuters, company profits and remittances all shift it.
