# Corpus — Dossier 08 (Factories / ASI + ASUSE), in the dossier register.

current-reading:
  - slot: what-the-print-says
    text: >
      The factory sector added more value than the year before, on more factories
      and more people on the shop floor. Output and emoluments both grew. The
      informal counterpart — the unincorporated enterprise — employs many times
      the factory headcount at a fraction of the productivity, and most of it runs
      without a registration or a hired hand.
  - slot: what-it-does-not-say
    text: >
      It does not say the economy is formalising. The factory survey covers
      registered units; the informal survey is a separate instrument, and the two
      are never summed. Gross value added is nominal — a rising line is prices as
      much as product. And the factory data arrives with a lag of roughly two
      years. We do not know what the factory floor looks like this month.

as-of:
  - slot: plate1
    text: >
      Read the long century as four rulers, never joined: the register of
      factories climbs through four classification rebases, each a break in the
      series, not a continuity. The jump in 2010-11 is a frame revision, not
      growth. The money plates carry the real story in the rupees of their day.

misread:
  - quote: "More factories means more growth."
    correction: >
      Not necessarily. The count rises with the register's coverage and
      classification, not only with the economy. Read the value added, and the
      unit of account.
