# Corpus — Dossier 04 (IIP), in the dossier register.

current-reading:
  - slot: what-the-print-says
    text: >
      Industrial production grew faster than a year ago, with manufacturing and
      electricity doing the work and mining flat. The capital-goods line —
      machines being made for factories — ran in double digits, the investment
      cycle's clearest signal. Consumer non-durables, the everyday basket, barely
      moved.
  - slot: what-it-does-not-say
    text: >
      It does not say industry is booming. The index is a month, and a month is
      noise: vegetables, holidays and one-off plant shutdowns move it more than
      any underlying trend. These are quick estimates, revised in later releases.
      And it counts goods only — services, more than half the economy, live in a
      different index. We do not know the true monthly pulse until the revisions
      settle.

as-of:
  - slot: plate1
    text: >
      Read the sector lines for their level, not their wiggle. Manufacturing
      carries most of the weight; mining is the noisiest and the least informative;
      electricity tracks the grid, not the factory floor. The use-based split tells
      you who is buying — capital goods mean companies, consumer durables mean
      confident households.

misread:
  - quote: "One month tells a story."
    correction: >
      Industrial production can swing several points in a month and reverse the
      next. Three consecutive months is the minimum unit of meaning.
