# Corpus: money, credit and banks, in the guide's register. Exemplars of cadence and moves,
# not of numbers: the numbers belong to a past print.

current-reading:
  - slot: what-the-print-says
    text: >
      Bank credit grew faster than a year ago, and the lift was broad: loans to industry
      picked up after two slow years, services kept pace, and personal loans held steady.
      The standout was gold loans, which more than doubled; a small line, but one that
      tells you how many families are pawning jewellery to bank counters rather than to
      moneylenders. Credit cards went the other way. Growth there has slowed every month
      since the regulator made banks hold more capital against unsecured loans.
  - slot: what-it-does-not-say
    text: >
      It does not say how much new lending happened. These are stocks: a loan repaid and a
      loan made can leave the total unchanged. It says nothing about whether the loans will
      be repaid; that shows up in bad-loan figures a year or two later. The sector split
      covers selected banks, not all of them, and finance companies' lending sits outside it.
      We do not know how much of the latest growth is the change in reporting dates.

misread:
  - quote: "Credit grew 20%, so the economy is booming."
    correction: >
      A merger moved existing loans into the banking system that year. Excluding it, growth
      was several points lower.
