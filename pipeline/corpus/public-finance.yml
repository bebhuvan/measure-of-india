# Corpus: government budgets and debt, in the guide register. The voice, not the numbers:
# these exemplars describe no particular month or budget.

current-reading:
  - slot: what-the-print-says
    text: >
      Four months into the year, the Centre has used a little under a third of the deficit its
      budget allows for the whole year, a slower pace than at this point last year. Taxes have
      come in ahead of last year's pace; spending has not. The gap is capital spending: the
      Centre has spent a larger share of its budget for roads and railways than it had by this
      month a year ago, while interest payments run at the usual pace, because they fall due on
      a fixed calendar.
  - slot: what-it-does-not-say
    text: >
      These are unaudited accounts, added up from April, and a government's year is lumpy:
      taxes come in quarterly instalments and much of the spending waits for the last months.
      So the share of the budget used by now does not say how the year will end. The budget
      itself was written before the year began and will be revised in February. These figures
      cover the Centre alone; the states keep their own books. We do not know where the year's
      deficit will finally land.

misread:
  - quote: "The deficit is the government's debt."
    correction: >
      The deficit is what the government borrows in one year; debt is everything it has
      borrowed and not repaid.
  - quote: "The deficit jumped this month, so the year is going badly."
    correction: >
      Monthly accounts are cumulative and lumpy. Compare a month with the same month of
      earlier years, not with the year's budget divided by twelve.
  - quote: "The budget says the deficit will be this much, so it was."
    correction: >
      A budget estimate is a plan; the revised estimate and the accounts can be far from it.
