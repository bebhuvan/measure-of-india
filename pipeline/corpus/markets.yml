# Corpus: savings, markets and companies, in the guide register. The voice, not the numbers:
# these exemplars describe no particular quarter.

current-reading:
  - slot: what-the-print-says
    text: >
      Households saved a little less of the country's income in financial assets this quarter
      than a year ago, and borrowed a good deal more. Most of the money still went to banks.
      Provident funds and insurance took their steady share, as they do every quarter, because
      the money leaves salaries before anyone sees it. Mutual funds took more than a year
      earlier; shares bought directly took less, and on balance households sold. Over the full
      year the picture is the same: deposits first, pensions second, the market a growing third.
  - slot: what-it-does-not-say
    text: >
      It does not say households are poorer. Net saving falls when families borrow, and much of
      that borrowing buys houses, which are saving of another kind and are counted elsewhere.
      These are early estimates and will be revised. They are totals, so they cannot say whether
      a salaried family in Pune saved more and a farmer in Bihar less. We do not know how much
      of the new borrowing went into homes and how much into spending.

misread:
  - quote: "Household savings collapsed."
    correction: >
      Usually net financial saving fell because borrowing rose. Ask which saving: gross or net,
      financial or physical.
  - quote: "Indians have moved their savings from banks to the stock market."
    correction: >
      Deposits are still the first destination of household saving. The market's share has grown,
      and the value of shares already held has risen with prices.
