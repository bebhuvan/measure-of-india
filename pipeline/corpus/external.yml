# Corpus: guide 05, the external account (lb/external, 2026-10). Voice and known misreadings
# for the prose writer; the numbers here are illustrative and never cited.

current-reading:
  - slot: what-the-print-says
    text: >
      India ran a current account deficit of a few billion dollars in the quarter, smaller than
      a year earlier. Goods did what they always do: India bought far more than it sold. What
      changed was the other side of the ledger, where software and business services earned
      more than ever and remittances from Indians abroad held steady. Foreign direct investment
      brought in a little; portfolio investors took money out, and the RBI drew on reserves to
      make up the rest. This is the first estimate; it will be revised.
  - slot: what-it-does-not-say
    text: >
      It does not say how the quarter after this one went: the reserves have already moved
      since, partly because the RBI sold dollars and partly because gold and the euro changed
      price. One quarter is a small window; over a full year the deficit was well under 1% of
      GDP. And the first estimate is a draft. We do not know how far the revision will move it.

misread:
  - quote: "A trade deficit means India is losing to the world."
    correction: >
      The goods gap has been there almost every year since independence. Services and
      remittances pay for most of it; the current account is the number to watch.
  - quote: "Reserves fell, so the RBI sold dollars."
    correction: >
      Reserves are valued in dollars every week; gold and other currencies change price. The
      RBI's own trading is published separately, weeks later.
  - quote: "Record FDI means foreign money is pouring in."
    correction: >
      Gross inflows are the headline; repatriation and Indian investment abroad are taken out
      before it reaches the balance of payments.

what-it-is-not:
  - The current account is not the trade balance; goods are one line of several.
  - The balance of payments always balances; a "deficit" is the balance of one part.
  - Reserves are held by the RBI, not the government, and are partly borrowed money.
