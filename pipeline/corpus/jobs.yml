# Corpus — Dossier 06 (Jobs / PLFS), in the dossier register.

current-reading:
  - slot: what-the-print-says
    text: >
      The unemployment rate sat in the narrow band it has kept for the bulletin's
      short life. Urban women still bore the highest rate of any labour market;
      urban men the lowest. Participation held steady — the share of people in the
      pool barely moved, so the headline is about who found work, not who joined.
  - slot: what-it-does-not-say
    text: >
      It does not say jobs were created. The unemployment rate is a ratio — it can
      fall because more people found work, or because more people stopped looking
      and left the labour force altogether. The monthly bulletin is young; it has
      no seasonal history to adjust against. And it counts work done last week,
      not a pay slip. We do not know how many of these jobs pay a living wage.

as-of:
  - slot: plate1
    text: >
      Read the quarterly line for the long arc, not the month. The pandemic spike
      — one urban worker in five — took years to retrace. The monthly bulletin,
      from 2025, carries the rural half the quarterly never did; it is the first
      same-month reading for the whole country, and it is still finding its
      rhythm.

misread:
  - quote: "The jobs number counts jobs."
    correction: >
      It does not. It counts people who worked last week, or wanted to. The
      survey is a snapshot of labour status, not a payroll count.
