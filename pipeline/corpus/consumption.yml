# Corpus — Dossier 07 (Consumption / HCES), in the dossier register.

current-reading:
  - slot: what-the-print-says
    text: >
      The average Indian spent more a month than in the round before, in both
      village and town, and the urban-rural gap held. Food's share of the budget
      edged down — Engel's law, visible in a single round. The inequality reading
      eased a little too.
  - slot: what-it-does-not-say
    text: >
      It does not say the average person is the typical person. The mean sits
      above the median because the spending ladder is steep at the top. The
      imputed variant — free goods from welfare schemes — adds to the bill without
      adding to what the household paid. And this is a survey of two years, not a
      monthly pulse. We do not know what households spent last month.

as-of:
  - slot: plate1
    text: >
      Read the fractile ladder for the shape of the country, not its average.
      Twelve rungs, from the bottom five per cent to the top five, rural and urban
      side by side. The top urban rung spends many times the bottom rural one; the
      mean hides both behind a single number.

misread:
  - quote: "Average spending is what the typical household spends."
    correction: >
      No. A handful of high spenders pull the mean well above the median. The
      fractile ladder, not the average, describes how the country actually lives.
