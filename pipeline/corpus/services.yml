# Corpus: the services guide. Voice exemplars only; their numbers belong to no real print.

current-reading:
  - slot: what-the-print-says
    text: >
      Services made up 53.4% of the economy's value added in 2024-25, by the provisional
      estimate, up from 51.6% two years earlier. The largest part is not software. It is
      finance, real estate and professional services, a group that includes the rent a
      family would pay to live in a house it already owns. Trade, hotels and transport come
      next, then public administration and the schools, hospitals and barbers counted as
      other services. Air transport grew fastest in real terms, 14.2%; railways slowest, at
      2.1%. Exports of services ran at $36.4 billion in the latest month, about twice what
      India paid for services bought abroad.
  - slot: what-it-does-not-say
    text: >
      It does not say how many people the growth employs. Services are more than half of
      output but under a third of jobs, and the share that pays a regular salary is far
      smaller than the share that sells vegetables from a cart. The monthly Index of
      Services Production is a trial: it covers about three-fifths of services, only the
      formal part, and has no overall figure yet. The latest annual numbers are provisional
      and will be revised. Whether the informal shop is growing as fast as the listed firm,
      we do not know.

how-to-read:
  - slot: share
    text: >
      A share of gross value added is the part of the year's production that a group of
      industries accounts for, at current prices. It can rise because the group grows
      faster, or because its prices rise faster. Read it with the real growth beside it.

misread:
  - quote: "India is a software economy."
    correction: >
      Computer services are India's largest export of services, but a small part of what
      services produce at home. Most service output is trade, transport, finance, rent,
      government and the work of small shops and clinics.
  - quote: "Services employ most Indians."
    correction: >
      Services produce more than half of output but employ about a third of workers.
      Farming still employs the most people, and a large part of service work is
      self-employment in small shops and stalls.
