# Corpus: the ILO guide (ILOSTAT), in the guide's register.

current-reading:
  - slot: what-the-print-says
    text: >
      On the ILO's estimates, a little over half of Indians aged 15 and over are in the labour
      force. Men's participation has barely moved in a decade; women's fell for years and has
      climbed back since the end of the 2010s, though it is still well below men's. Young
      people are less likely to be in the labour force than adults, mostly because more of
      them are studying. These are the ILO's model estimates, drawn from India's surveys where
      they exist and filled in by the model where they do not.
  - slot: what-it-does-not-say
    text: >
      It does not say how many jobs there are, or how good they are. For most years the ILO's
      line is the model's estimate, not a survey's count, and each new edition redraws the
      whole history. The ILO counts work over a week and by calendar year; MoSPI's headline
      counts work over a year, from July to June, so the two never agree and should never be
      joined. How much of women's work gets counted depends on how the survey asks. We do not
      know how much of the recent rise is new paid work and how much is unpaid help on family
      farms.

misread:
  - quote: "The ILO's figure is the real one."
    correction: >
      It is a harmonised estimate, built for comparing countries. For India's own trend, the
      survey MoSPI runs is the measurement; the ILO's model leans on it.
