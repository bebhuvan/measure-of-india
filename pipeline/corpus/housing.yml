# Corpus: house prices guide (BIS, RBI HPI, NHB RESIDEX), in the guide's register.
# Hand-written exemplars of cadence and moves; their numbers are illustrative.

current-reading:
  - slot: what-the-figures-say
    text: >
      House prices rose in rupees again in the June quarter, by a little over five
      per cent on a year ago. After inflation the rise was close to nothing: a home
      cost about what it did a year earlier once everything else a household buys is
      taken into account. The real index is still below its peak of five years ago.
      The cities did not move together. One southern city rose by double digits while
      Delhi's index fell, a reminder that the national figure is an average of very
      different markets.
  - slot: what-they-do-not-say
    text: >
      An index built from registered sales in a handful of big cities is not the
      price of every home in India, and registered values can sit below what buyers
      pay. It also says nothing about incomes, so on its own it cannot say whether
      homes became easier or harder to afford. We do not know how prices moved in
      the smaller towns where most Indians live.

misread:
  - quote: "House prices doubled, so property beat every other investment."
    correction: >
      In rupees, perhaps. After inflation, and before the costs of buying, holding
      and selling, the gain can be small.
