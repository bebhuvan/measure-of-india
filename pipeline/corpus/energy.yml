slug: energy
instrument: "MoSPI Energy Statistics India balance accounts and separate Ember electricity releases"
evergreen:
  - "Primary supply measures energy entering the system before transformation. Final consumption follows the report's end-use boundary, including non-energy feedstocks."
  - "Electricity is one energy carrier. Capacity is a rated stock; generation and demand are flows over time."
  - "Ember national and subnational products use calendar periods; MoSPI energy accounts use fiscal years. Separate release editions and coverage cannot be spliced."
misreadings:
  - "Adding a total to its fuel or subsector components double counts energy."
  - "State generation locates plants; it is not residents' consumption mix."
  - "Ember Clean includes nuclear; Renewables excludes it."
  - "A decline in carbon intensity need not mean a decline in total emissions."
  - "Source-scaled electricity output under a retained GWh heading is audit-only; it is excluded from physical facts and charts."
limitations:
  - "Historical source transformation discrepancies are disclosed and preserved."
  - "Balances do not establish affordability, outages or a household's full energy footprint."
  - "The scope is the complete balance chapter and annex plus original Ember releases; other MoSPI report chapters remain separate products."
