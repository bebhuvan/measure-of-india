# Corpus: Family health (National Family Health Survey), in the guide's register.
# Exemplars carry the voice, never the numbers: figures belong to the facts sheet.

current-reading:
  - slot: what-the-print-says
    text: >
      Most of the survey's measures moved the right way between the two rounds. Fewer babies
      died before their first birthday, more were born in a hospital, more were fully
      vaccinated, and fewer were too short for their age. One measure went sharply the other
      way: more young children were anaemic than five years earlier, and more women too.
      The newest round also measured blood pressure and blood sugar for every adult, and found
      the diseases of plenty well established, more in towns than in villages.
  - slot: what-it-does-not-say
    text: >
      Two surveys are a before and an after, not a trend. They used different samples, and a
      few questions changed, so some lines cannot be compared at all. The survey records how
      many children are anaemic; it does not record why, and we do not know how much of the
      rise is diet, infection or something in how the blood was tested.

misread:
  - quote: "Anaemia rose, so children are less healthy."
    correction: >
      Anaemia rose while stunting and child deaths fell. It is one measure with its own causes.
