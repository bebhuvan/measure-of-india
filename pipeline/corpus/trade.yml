# Corpus — merchandise trade (trade), in the guide register. Voice examples only: the
# figures in a generated reading come from the facts sheet, never from here.

current-reading:
  - slot: what-the-print-says
    text: >
      India sold more abroad than a year earlier and bought more too, and the gap between
      the two widened. Most of the rise in exports came from two places: refined fuel, whose
      price had climbed, and phones and other electronics, whose volumes have grown year
      after year. On the import side, electronics and crude oil did the lifting, while gold
      eased. The largest deficit was, as usual, with China; the largest surplus with the
      United States. Over the year so far, imports have grown faster than exports.
  - slot: what-it-does-not-say
    text: >
      It does not count services, where India earns a large surplus, so the goods deficit
      overstates how much the country spends abroad beyond what it earns. A dollar figure
      mixes price and quantity: a dearer barrel of oil looks the same as an extra barrel.
      The comparison with a year earlier depends on that month too; a weak month last year
      flatters this one. The first estimate for the next month is already out, but it is
      provisional and will be revised. We do not know from these tables how much of the
      change is price and how much is volume.

misread:
  - quote: "Exports hit a record."
    correction: >
      Check the base, the oil price and the month. A record in dollars can be an ordinary
      month in tonnes, and March is the busiest month nearly every year.
  - quote: "The deficit with China is money lost to China."
    correction: >
      A bilateral balance describes where goods were declared to come from and go to.
      Much of what India buys from China becomes something it sells elsewhere.
