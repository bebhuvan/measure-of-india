# Corpus: poverty and inequality (World Bank PIP), in the guide's register.
# Exemplars carry the voice, never the numbers: figures belong to the facts sheet.

current-reading:
  - slot: what-the-print-says
    text: >
      By the World Bank's extreme poverty line, very few Indians were poor in the
      latest survey, fewer than in the round a year earlier. Raise the line to what a
      lower-middle-income country would use and the count multiplies; raise it again
      and most of the country falls below it. The line, not the survey, decides the
      headline. Consumption also grew more even: the richest tenth's share slipped and
      the poorest tenth's rose a little.
  - slot: what-it-does-not-say
    text: >
      It does not say how many Indians are poor by India's own standard. There is no
      official line since 2011-12. It measures what households consume, not what they
      earn or own, and the survey rarely reaches the richest homes. The redesigned
      survey records more spending than the old one did, so the fall since 2011-12 is
      partly a new ruler. We do not know how the years in between went for the poorest;
      the World Bank's yearly figures there are a model.

misread:
  - quote: "Three dollars a day is about two hundred and fifty rupees."
    correction: >
      Only at the market exchange rate. The line is in purchasing-power dollars,
      which already allow for lower Indian prices; in rupees it is a few dozen a day.
  - quote: "Poverty collapsed between 2011-12 and 2022-23."
    correction: >
      Some of it did. The two surveys asked different questions over different
      recall periods; the World Bank keeps them apart for that reason.
