# Corpus — Dossier 02 (GDP), extracted from src/pages/guides/gdp.astro

current-reading:
  - slot: what-the-print-says
    text: >
      The economy grew 8.23% in the September quarter, accelerating from 7.81%
      in the previous one. The composition is the encouraging part: household
      consumption — fifty-six per cent of GDP — rose 7.95%, and investment held
      at 7.33%, so the quarter was carried by domestic demand rather than
      statistical residue. GVA, which strips out taxes and subsidies, came in
      slightly lower at 8.12% — the gap is a net-tax story, not a production story.
  - slot: what-it-does-not-say
    text: >
      It does not say the average Indian is 8.23% better off — GDP says nothing
      about distribution, and per-capita growth is lower once population is
      counted. It says nothing reliable about the informal economy, which is
      estimated, not measured. And unlike the CPI, this number will be revised —
      this is the first estimate of this quarter, and the final figure, due in
      about three years, may look different. We do not yet know how different.

how-to-read:
  - slot: plate1
    text: >
      Each line compares one quarter with the same quarter a year earlier. The
      deep V is the pandemic: a real collapse in mid-2020, then a rebound a year
      later that is arithmetic, not boom — growth measured against a destroyed
      base. Read the 2020–22 stretch as a wound and its scar, not as information
      about trend.
  - slot: gva
    text: >
      GVA measures producers' output net of input costs, before product taxes
      and subsidies. Economists often prefer it as the cleaner read on supply
      conditions; newspapers usually quote GDP. When the two diverge, the cause
      is almost always net taxes — check before reading meaning into it.

as-of:
  - slot: plate1
    text: >
      The base-effect theatre is finally over: the last four quarters read 6.4,
      7.4, 7.8, 8.2 — the cleanest trend signal since before the pandemic, and
      accelerating. Growth is running well above the old 6% trend, with
      consumption growing nearly as fast as the headline. The caution: these
      are early estimates. The quarterly series
      leans heavily on listed-company results and government accounts; the
      informal sector is extrapolated. Revisions over the next three years will
      redraw parts of this picture.
  - slot: gfcf
    text: >
      At 7.33%, investment is steady rather than surging. Public capex has been
      doing the heavy lifting; a broad private-sector capex cycle remains, as
      ever, one budget away.

misread:
  - quote: "+20% means a boom."
    correction: >
      After a −23% collapse, +23% leaves the level about 5% below where it
      started. Growth rates multiply, they do not add. Always ask what the base
      quarter was.
  - quote: "The first estimate is the fact."
    correction: >
      Quarterly GDP is revised for years as better data arrives — sometimes by
      more than a point. The CPI is final; GDP is a draft. Quote the vintage,
      not just the number.
  - quote: "GDP and GVA disagree."
    correction: >
      They differ by net indirect taxes, nothing more. A GDP–GVA gap is an
      accounting story about taxes and subsidies, not evidence of statistical
      confusion.

margin-note:
  - "The rebound is arithmetic. +23% after −23% does not restore the level: 0.77 × 1.23 ≈ 0.94."
  - "Real vs nominal. Real growth measures volume; nominal measures rupees. Debt-to-GDP and tax buoyancy live in the nominal world."
  - "GDP ≠ GVA. GDP adds net indirect taxes to GVA. When subsidy payments swing, the two diverge — check which one a headline is quoting."

register-sub:
  - "Market prices · the headline"
  - "Basic prices · before net taxes"
  - "Machines, buildings, infrastructure"
