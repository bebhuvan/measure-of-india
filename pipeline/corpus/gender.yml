# Corpus: Women and men (MoSPI's Women and Men in India), in the guide's register.
# Exemplars carry the voice, never the numbers: figures belong to the facts sheet.

current-reading:
  - slot: what-the-print-says
    text: >
      Fewer girls go missing at birth than a decade ago, though the count is still short of
      what nature produces. Mothers die in childbirth far less often than they did, and a baby
      girl is now no more likely to die in her first year than a baby boy, a reversal of the
      old pattern of neglect. At work the gap is wider: far fewer women than men are in the
      labour force, and the women who do casual labour in villages are paid less for a day.
      At home the gap runs the other way, in hours of unpaid work.
  - slot: what-it-does-not-say
    text: >
      Each figure belongs to the agency that measured it, on its own calendar, and they cannot
      be added into one picture of a woman's life. A crime the police did not register does not
      appear. An account in a woman's name does not say who spends from it. We do not know how
      many women decide over their own money.

misread:
  - quote: "Crime against women is highest where the rate is highest."
    correction: >
      Recorded crime is highest there. Reporting differs from state to state.
