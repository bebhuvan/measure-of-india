# Corpus: how Indians pay (payments), in the guide register. Voice examples only: the figures in
# a generated reading come from the facts sheet, never from here, and these exemplars describe
# no particular month.

current-reading:
  - slot: what-the-print-says
    text: >
      UPI carried more payments than in any month before, and more than a year earlier by a
      wide margin. It now makes up nearly all of the small, everyday payments Indians make
      through the banking system, and the average UPI payment keeps getting smaller as it
      reaches the tea stall and the vegetable cart. The money is elsewhere: RTGS, used by
      companies and banks, still moves most of the rupees. Credit cards grew while debit
      cards, cheques and IMPS shrank, and fewer people went to the ATM than a year earlier.
  - slot: what-it-does-not-say
    text: >
      It counts payments, not people. A shopkeeper receiving a hundred scans a day adds a
      hundred, and we do not know how many Indians pay this way or how often. The average
      payment is pulled up by a few large transfers; the RBI does not publish the typical
      one. Cash is not counted at all, and the notes people hold have kept growing. Payment
      values add up every time the same money moves, so they say nothing about how much
      the country spends.

misread:
  - quote: "UPI has killed cash."
    correction: >
      Cash payments are not counted, and the cash the public holds has kept growing. People
      go to the ATM less often and take out more each time.
  - quote: "Digital payments are worth many times India's GDP."
    correction: >
      Payment values count every transfer, including money moving back and forth between
      banks and companies. GDP counts what is produced once.
  - quote: "Debit card use collapsed in 2019."
    correction: >
      The RBI moved ATM withdrawals out of the card lines in November 2019. Part of the fall
      is the table changing.
