# Corpus: interest rates and monetary policy, in the guide register. The voice, not the
# numbers: these exemplars describe no particular meeting.

current-reading:
  - slot: what-the-print-says
    text: >
      The committee left the repo rate where it was, and said so in one line. The corridor
      around it did not move either: the floor and the ceiling stay a quarter point on each
      side. What changed over the year happened elsewhere. The cash reserve ratio came down a
      full point, which frees money banks would otherwise park idle at the RBI. Banks had
      already passed most of the earlier cuts to new borrowers. Savers felt them too, and less
      kindly: a new fixed deposit now earns barely more than inflation takes away.
  - slot: what-it-does-not-say
    text: >
      It does not say when your loan will change. A home loan priced off the repo rate resets
      within three months; one priced off the bank's own lending rate may wait a year. The
      bank rates in this sheet were struck before the meeting, so they cannot show its effect.
      Nor does it say how fast banks will follow: deposits renew only as they mature, and we
      do not know how many will roll over at the new rate.

misread:
  - quote: "The RBI cut rates, so my EMI falls next month."
    correction: >
      Only for loans tied to the repo rate, and only at their next reset. Many banks keep the
      instalment fixed and shorten the loan instead.
