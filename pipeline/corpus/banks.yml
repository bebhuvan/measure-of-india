# Corpus: India's banks one by one, in the guide's register. Exemplars of cadence and moves,
# not of numbers: the numbers belong to a past quarter.

current-reading:
  - slot: what-the-print-says
    text: >
      Bad loans at India's banks kept falling. Across all commercial banks, the share of
      loans not being repaid is now a fraction of what it was at the 2018 peak, and the
      public sector banks, which carried most of that burden, have closed most of the gap
      with private banks. Capital is comfortably above the RBI's minimum in every group.
      Small finance banks, which lend to the smallest borrowers, carry the most bad loans,
      as they have since they began. Private banks still earn more on each rupee of assets,
      and keep taking market share: they now hold more than a third of all deposits.
  - slot: what-it-does-not-say
    text: >
      It does not say how the bad loans went. Some were repaid, some recovered in court, many
      written off after full provision; the ratio falls the same way for all three. These are
      the banks' own quarterly returns, not audited accounts. A group's average can hide one
      weak bank, and co-operative banks and finance companies report elsewhere. We do not know
      how much of the improvement would survive a sharp slowdown.

misread:
  - quote: "Bad loans are down, so borrowers are paying back."
    correction: >
      Much of the fall came from write-offs: loans taken off the books after the bank had
      already set aside their full value, most never recovered.
  - quote: "HDFC Bank doubled in a quarter."
    correction: >
      It merged with HDFC Ltd in July 2023; the jump that quarter is the merger, not new
      business.
