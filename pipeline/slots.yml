# Slot contracts for dated prose generation.
# Evergreen slots (how-to-read, misread, margin-note) are NEVER generated —
# they are human-only. Only the dated slots below regenerate on a release.

cpi:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [headline.latest, food_and_beverages.latest, transport.latest]
    minSeriesMentioned: 5        # headline + at least 4 of the 12 divisions
    mustName: [extremes]         # the hottest and weakest divisions must appear
    mustAcknowledge: [contradictions]
    bannedWords: []
    brief: >
      Two short paragraphs on the latest 2024-base print (name its month from the
      sheet, never from memory): the headline, what drives it (food and beverages,
      transport, restaurants, and personal care / gold as a world-market spectator to
      set apart), and the run since the series opened in January. Name the band
      position. Then the cuts that answer "what does inflation look like for me": the
      rural and urban division gap (proseInputs cpi-2024-rural-divisions and
      -urban-divisions), the state spread by division (cpi-2024-states-divisions), and
      the industrial worker's index (cpiiw-2016: a different instrument, the Labour
      Bureau's, for the same month; its sheet summarises its six groups only, so name
      their range and leave the general rate to the §13 plate, without remarking on
      what the sheet lacks). Concede what is genuine before qualifying it.
      READING THE SHEET (wave 2): "topMover"/"bottomMover" (cross) and "top"/"bottom"
      (proseInputs) rank series by how much their rate CHANGED, not by the rate itself:
      never call a mover the highest or smallest; the highest and lowest RATES are
      "topByLatest" and "bottomByLatest". "rising" and "falling" in a tail count series whose rate rose or fell
      on the previous month, not prices rising or falling: say "faster than last month". The sheet's
      13 main series are the General index (the headline) plus TWELVE divisions: write
      "twelve divisions", never "thirteen". The 2024 base publishes NO weights: never call
      a division the largest or say what share of the basket it is. Before saying a division
      alone did something (eased, rose), check every division's deltaVsPrev; name all that did.
      Do not draw causal conclusions the figures do not show.
      CPI-IW (cpiiw-2016): "general_index" is an index LEVEL (154.4), not a rate; its change
      on a year earlier in points is not a per cent. Quote the worker's inflation from the
      series "general" (a y/y rate), or quote only the level. Every figure on this page is
      already year-on-year: never write that there is no year-ago reading. Every rate is a per cent: write the %.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [headline.latest, legacy.oldHeadline.value, legacy.core.value]
    brief: >
      The honest limits of the new base: the API serves no component weights, so
      no core index can be computed on it — the last core reading lives on the
      retired 2012 base, which closed at a different headline. The latest figure
      and the December 2025 figure are different rulers, not a jump. Must contain a
      plain "we do not know" sentence.
      READING THE SHEET (wave 2): "topMover"/"bottomMover" (cross) and "top"/"bottom"
      (proseInputs) rank series by how much their rate CHANGED, not by the rate itself:
      never call a mover the highest or smallest; the highest and lowest RATES are
      "topByLatest" and "bottomByLatest". "rising" and "falling" in a tail count series whose rate rose or fell
      on the previous month, not prices rising or falling: say "faster than last month". The sheet's
      13 main series are the General index (the headline) plus TWELVE divisions: write
      "twelve divisions", never "thirteen". The 2024 base publishes NO weights: never call
      a division the largest or say what share of the basket it is. Before saying a division
      alone did something (eased, rose), check every division's deltaVsPrev; name all that did.
      Do not draw causal conclusions the figures do not show.
      CPI-IW (cpiiw-2016): "general_index" is an index LEVEL (154.4), not a rate; its change
      on a year earlier in points is not a per cent. Quote the worker's inflation from the
      series "general" (a y/y rate), or quote only the level. Every figure on this page is
      already year-on-year: never write that there is no year-ago reading. Every rate is a per cent: write the %.
  - id: as-of.newbase
    maxSentences: 6
    dateStamp: true
    requiredFigures: [headline.latest, headline.yearStart]
    brief: >
      The new base's months so far in one arc: where it opened (January), where
      it stands (the latest month in the sheet), its position in the RBI tolerance
      band, and the one thing to watch. Reads like a newspaper's second paragraph.
      READING THE SHEET (wave 2): "topMover"/"bottomMover" (cross) and "top"/"bottom"
      (proseInputs) rank series by how much their rate CHANGED, not by the rate itself:
      never call a mover the highest or smallest; the highest and lowest RATES are
      "topByLatest" and "bottomByLatest". "rising" and "falling" in a tail count series whose rate rose or fell
      on the previous month, not prices rising or falling: say "faster than last month". The sheet's
      13 main series are the General index (the headline) plus TWELVE divisions: write
      "twelve divisions", never "thirteen". The 2024 base publishes NO weights: never call
      a division the largest or say what share of the basket it is. Before saying a division
      alone did something (eased, rose), check every division's deltaVsPrev; name all that did.
      Do not draw causal conclusions the figures do not show.
      CPI-IW (cpiiw-2016): "general_index" is an index LEVEL (154.4), not a rate; its change
      on a year earlier in points is not a per cent. Quote the worker's inflation from the
      series "general" (a y/y rate), or quote only the level. Every figure on this page is
      already year-on-year: never write that there is no year-ago reading. Every rate is a per cent: write the %.

gdp:
  - id: current-reading.what-the-print-says
    maxSentences: 6
    dateStamp: true
    requiredFigures: [gdp.latest, gdp.previous, pfce.latest, gfcf.latest, gva.latest]
    minSeriesMentioned: 4        # gdp, gva, consumption, investment
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The quarter: growth, direction of travel vs the previous quarter, the
      composition (consumption, investment), and the GDP–GVA gap as accounting.
      If the annual accounts appear at all, write the saving rate as "X% of GDP" and every
      other annual line as growth ("grew X%"), and do not compare the two kinds or remark on
      the difference. "Fastest" and "slowest" apply within the four headline series (GDP,
      GVA, consumption, investment) unless the sentence names the wider set. The 6% line is a
      rough pre-pandemic trend. Never say how far the annual accounts lag the quarter.
  - id: current-reading.what-it-does-not-say
    maxSentences: 5
    dateStamp: false
    requiredFigures: [gdp.latest]
    brief: >
      Distribution, the unmeasured informal sector, and revisions. Must state
      which estimate this is and that the final figure may differ.
      If the annual accounts appear at all, write the saving rate as "X% of GDP" and every
      other annual line as growth ("grew X%"), and do not compare the two kinds or remark on
      the difference. "Fastest" and "slowest" apply within the four headline series (GDP,
      GVA, consumption, investment) unless the sentence names the wider set. The 6% line is a
      rough pre-pandemic trend. Never say how far the annual accounts lag the quarter.
  - id: as-of.plate1
    maxSentences: 6
    dateStamp: true
    requiredFigures: [gdp.last4]
    brief: >
      The trend read: the last four quarters as a sequence, position vs the 6%
      trend, and the early-estimate caution.
      If the annual accounts appear at all, write the saving rate as "X% of GDP" and every
      other annual line as growth ("grew X%"), and do not compare the two kinds or remark on
      the difference. "Fastest" and "slowest" apply within the four headline series (GDP,
      GVA, consumption, investment) unless the sentence names the wider set. The 6% line is a
      rough pre-pandemic trend. Never say how far the annual accounts lag the quarter.

wpi:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [headline.latest, fuel.latest, primary.latest, manufactured.latest]
    minSeriesMentioned: 5        # the headline and all four moving parts
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The headline wholesale print and its three moving parts (primary, fuel,
      manufactured). Name which group did the lifting this month. Concede the
      genuine before qualifying it.
      READING THE SHEET (wave 2): "topMover"/"bottomMover" (cross) and "top"/"bottom"
      (proseInputs) rank series by how much their rate CHANGED, not by the rate itself:
      never call a mover the highest or smallest; the highest and lowest RATES are
      "topByLatest" and "bottomByLatest". "rising" and "falling" in a tail count series whose rate rose or fell
      on the previous month, not prices rising or falling: say "faster than last month". Every rate is a per cent: write the %.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [headline.latest]
    brief: >
      The honest limits: this is the factory gate, not the shop (no services, no
      retail margins); pass-through is slow; and it is provisional, revised in
      about eight weeks. Must contain a plain "we do not know" or "provisional".
      READING THE SHEET (wave 2): "topMover"/"bottomMover" (cross) and "top"/"bottom"
      (proseInputs) rank series by how much their rate CHANGED, not by the rate itself:
      never call a mover the highest or smallest; the highest and lowest RATES are
      "topByLatest" and "bottomByLatest". "rising" and "falling" in a tail count series whose rate rose or fell
      on the previous month, not prices rising or falling: say "faster than last month". Every rate is a per cent: write the %.

iip:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [general.latest, sector_manufacturing.latest, use_capital_goods.latest]
    minSeriesMentioned: 4        # general + sector and use-based cuts
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The headline industrial growth, the sector split (manufacturing, mining,
      electricity), and the use-based read (capital goods = investment). Name the
      standout. Concede before qualifying. Every figure here is a growth rate: the
      rising and falling counts compare each industry's growth with the month before
      (say "accelerated" and "slowed", never that output rose or fell), and a line
      "below a year ago" grew more slowly than it did a year earlier: write "grew more slowly than a year earlier", never "below where it stood". Write category names in sentence case (capital goods, not Capital Goods).
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [general.latest]
    brief: >
      The honest limits: one month is noise; these are quick estimates, revised;
      the index is goods only (services live elsewhere). Must contain a plain "we
      do not know". Rising and falling counts compare growth with the month before
      ("accelerated", "slowed"); never present them as output going up or down.

jobs:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [ur.latest, lfpr.latest]
    minSeriesMentioned: 3        # ur, lfpr, wpr
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The unemployment rate and participation, and what moved them. Name which
      labour market (urban women, rural men) sits highest, and say what the young
      (15 to 29) face. Concede before qualifying. The deep-cut summaries rank
      participation, worker and unemployment rates together: they are different
      ratios, so never compare one kind with another and never quote a summary's
      "range" from one to the other. Every figure here is the survey's revamped
      design (from January 2025); never compare it with a year before 2025.
      Two decimals only for the headline unemployment rate; every other figure at
      one decimal. Never say "basket". Never count how many series rose or fell.
      The sheet flags participation and the worker ratio as moving "against" the
      headline whenever they rise as unemployment falls. They do not contradict it:
      rising participation and employment with falling unemployment agree. Name
      them and say plainly that more people joined the labour force and more of them
      found work; never write "against the headline" or "contradict" for that case.
      Use those words only if unemployment and employment truly move the wrong way
      together (unemployment falling while the worker ratio falls too).
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [ur.latest]
    brief: >
      The honest limits: the UR is a ratio that can fall for the wrong reason
      (people leaving the pool); the monthly bulletin is young with no seasonal
      history; this counts work done last week, not a pay slip; the survey was
      redesigned in January 2025, so nothing here can be set against an earlier
      year. Must contain a plain "we do not know". Figures at one decimal, except the
      headline rate. Do not list the deep cuts or their series counts.

consumption:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [rural.latest, urban.latest]
    minSeriesMentioned: 2        # rural and urban
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The average monthly spend per person, rural and urban, and the urban-rural
      gap (use cross.urbanRuralRatio, never compute a ratio). Name the highest and
      lowest state from the hces-states input, and say once that counting free
      items (with imputation) adds a little to each. Name any shift in food's share
      (Engel's law). Call the latest period "the 2023-24 survey" and the earlier
      one "the previous survey", never FY24 or FY23: these are survey rounds, not
      financial years.
      Two rounds are two points, not a trend: never say "rising", "a trend" or
      "growth rate". Do not explain the change with a base effect. The fractile
      classes are slices of the population ranked by spending: "0-5%" is the
      poorest twentieth and "95-100%" the richest twentieth, never a tenth. Never
      set a with-imputation figure against a without-imputation one. Concede
      before qualifying.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [rural.latest]
    brief: >
      The honest limits: an average per person is not what a typical household
      spends, and the survey publishes no median, so say we do not know the
      median; the with-imputation figures add the value of free items the
      household did not pay for; spending is not income, and the Gini of spending
      understates inequality; this is a survey of two rounds, not a monthly
      pulse. Call the period "the 2023-24 survey", never FY24. The fractile
      classes are slices: "95-100%" is the richest twentieth, never a tenth.
      Vary sentence length. Must contain a plain "we do not know".

factories:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [gva.growthVsYearPct, factories_in_operation.latest]
    minSeriesMentioned: 3        # gva, factory count, people
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The factory sector's value added, factory counts and people on the shop
      floor. Set the registered (ASI) beside the informal (ASUSE) scale. Concede
      before qualifying. ASUSE now has a calendar-year 2025 round (asuse-2025-t26, workers):
      it covers January to December 2025, a different twelve months from the 2023-24 round,
      so name its year, keep it in its own sentence, and never state a change between 2023-24
      and 2025. Workers in asuse-2025-t26 are counts of people; its labels name the cut.
      Write every figure the way a reader says it: ASI money is in ₹ lakh in the sheet, so
      write it in ₹ lakh crore or ₹ crore (245833606 ₹ lakh is ₹24.6 lakh crore); counts in
      lakh or crore (19589131 is 1.96 crore), except the factory count, written in full with
      Indian grouping (2,12,990). Never print a bare long number. Write years as
      2023-24, not FY24. Never call a change "the largest", "the biggest" or "the fewest": the series are in different units (rupees, factories, people) and cannot be ranked against each other. The factory count has
      a frame revision in 2010-11 (the count jumps that year): do not call the rise since
      2008-09 an unbroken streak.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [gva.growthVsYearPct]
    brief: >
      The honest limits: registered and informal are separate instruments, never
      summed; GVA is nominal (prices as much as product); the data lands with a
      two-year lag. Must contain a plain "we do not know". Money in ₹ lakh crore or ₹ crore,
      counts in lakh or crore, never a bare long number; years as 2023-24, not FY24. Never call a change "the largest", "the biggest" or "the fewest" across series in different units.

# ---- bis family session ----
debt:
  - id: current-reading.what-the-figures-say
    maxSentences: 7
    dateStamp: true
    requiredFigures: [total.latest, government.latest, households.estimated.lastMeasured.value, companies.estimated.lastMeasured.value]
    minSeriesMentioned: 4        # the total and at least three of the borrowers
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The quarter's debt picture as a share of GDP, honest about what is measured.
      Each series' "estimated" field says which readings are BIS estimates: since the
      RBI's last financial accounts quarter, BIS extends private credit with bank
      credit and keeps the household/company split fixed. So: name the total and
      government (measured); give private credit and the credit gap as BIS estimates
      and say so; never describe households or companies as rising, falling or
      driving anything after the last measured quarter, because their split is
      carried forward, not observed. Use their lastMeasured values (and period) for
      who owes what. Bring in the debt service ratio and one comparison with China or
      the United States from the peer rankings. Concede before qualifying.
  - id: current-reading.what-they-do-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [households.latest]
    brief: >
      The honest limits: the latest quarters of private credit are BIS estimates scaled
      from bank credit, with the household/company split frozen at the last measured
      quarter (see each series' "estimated" field), so we do not know how households'
      and companies' debts moved since then; these are national totals, so they cannot
      say how many families or firms are stretched; a ratio to GDP moves with inflation
      and growth as well as with borrowing. Must contain a plain "we do not know".

housing:
  - id: current-reading.what-the-figures-say
    maxSentences: 7
    dateStamp: true
    requiredFigures: [nominal_yoy.latest, real_yoy.latest]
    minSeriesMentioned: 2        # nominal and real
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      House prices in the quarter: the change on a year ago in rupees (nominal) and
      after inflation (real), and where the real index stands against its own past.
      Bring in the city spread from the RBI's 18-city summary (fastest and slowest
      city on a year ago). Those city figures are one quarter LATER than the BIS
      series (their latestPeriod is 2026-04, April to June 2026) and the latest
      quarter is provisional: say so in the same sentence, and warn that single
      cities swing with the mix of homes sold. Then how India's real change ranks
      among the comparison economies. Concede before qualifying.
  - id: current-reading.what-they-do-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [real_yoy.latest]
    brief: >
      Do not repeat the other column's figures: cite the real change once and no
      other index level. The honest limits: an index of registered transactions in a few big cities
      is not the price of every home; it says nothing about incomes, so it cannot by
      itself say whether homes are affordable; registered values can sit below what
      buyers actually pay. Must contain a plain "we do not know".

# ---- services ----
services:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [services.latest, finance_realty_prof.latest, trade_transport_comm.latest, public_admin_other.latest]
    minSeriesMentioned: 4        # the services total and the three service groups
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The latest year on the 2022-23 base: services' share of gross value added and how it
      moved, which of the three service groups is largest, and what the sibling sheets add:
      the fastest and slowest service sub-industries in real terms (services-gva-2022-growth),
      the latest month of services exports and imports (services-trade-monthly), and the
      latest month of the trial ISP's sub-sectors (services-isp-growth). Name the estimate
      (provisional, revised) where it matters. Concede what is genuine before qualifying it.
      Periods differ by sheet: the share is for FY26; sub-industry growth stops at 2024-25
      (FY25), the latest year with sub-industry detail; trade is May 2026; the ISP is July 2026.
      Name each figure's own period, and call the ISP a trial. Services and goods shares add
      to 100 by construction: never present one as explaining the other. Write every growth
      rate or share with a per cent sign.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [services.latest]
    brief: >
      The honest limits: a share of output is not a share of jobs or incomes; the ISP is a
      trial covering only the formal part of services, with no overall index; the latest
      annual figures are provisional and will be revised; the informal service economy is
      estimated, not measured each year. Must contain a plain "we do not know" sentence.
      PLFS does publish services' share of jobs (about a third), so never say the number of
      service jobs is unknown; what is not known is, for example, how fast the informal service
      businesses grow year to year, since ASUSE runs a year or more behind.
      Keep figures few, and write each with its unit (per cent, US$ billion). Talk only about
      service industries; leave farms, factories and utilities out.
# ---- end services ----

# --- states (state economies) ---
states:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [gap_current.latest, gap_current.min, richest_current.latest, poorest_current.latest]
    minSeriesMentioned: 4        # the multiple, richest, poorest, and the spread or the middle state
    # no mustName extremes: the sheet mixes units (a multiple, rupees, per cent), so its
    # "top and bottom movers" compare unlike things and pushed the writer into doing so
    mustAcknowledge: [contradictions]
    brief: >
      The gap between India's states in the latest year the fixed panel covers: the
      richest state's income per person as a multiple of the poorest's, the two
      figures themselves in rupees, and where the multiple stood
      in 2011-12. The path was not steady: the multiple's low (gap_current.min) came
      early, in FY14, below today's level, then it rose and has fallen again since; say
      that plainly rather than calling the fall a steady drift. Say whether the spread
      across all states narrowed, and how fast the
      typical state grew in real terms (that figure is the median of all the states'
      growth rates, not the growth of the median-income state; say "the typical state's
      economy grew"). The sheet does not name the states: do not name any, and never
      mention the sheet or your sources. Income per person is production, not earnings:
      never write "earned". The sheet's figures are of different kinds (a multiple, rupees,
      a percentage, a growth rate): never rank or compare one kind against another, and
      never call the sheet a "basket". Concede before qualifying.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [gap_current.latest]
    brief: >
      The honest limits: income per person is production per resident, not what people
      take home, so commuters and migrants distort it (states that receive workers look
      richer, states that send them look poorer); every state counts once, whatever its
      size; the latest year is an estimate each state will revise; the rupee distance
      between richest and poorest can widen while the multiple narrows. Cite only the
      multiple; the other column carries the numbers. Do not mention growth. Use
      "they", never "he". Must contain a plain "we do not know".

# --- worldbank family (2026-10-09): poverty (World Bank PIP) and population (UN WPP 2024) ---
poverty:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [headcount_3_00.latest, headcount_4_20.latest, headcount_8_30.latest, gini.latest]
    minSeriesMentioned: 4        # the three lines and one distribution measure
    bannedWords: []
    brief: >
      Two short paragraphs on the latest survey (HCES 2023-24, PIP reporting year 2023) against
      the one before it in the same comparable spell (HCES 2022-23, reporting year 2022): the
      share of Indians below $3.00, $4.20 and $8.30 a day (2021 PPP), and the number of people
      below $3.00. Say plainly how much the answer depends on the line. Then one distribution
      fact: the Gini or the share of the richest and poorest tenths. Call the rounds 2022-23 and
      2023-24. The facts cover only this survey design; give no figure for earlier surveys.
      Write for a reader: never mention "the sheet", rankings or series names.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [headcount_3_00.latest]
    brief: >
      The honest limits: the lines are the World Bank's international lines, not an Indian
      official line (India has none since 2011-12); consumption per person is not income or
      wealth, and the survey misses the very rich; the redesigned HCES is not comparable with
      2011-12, so part of the fall between them is the new questionnaire; the years between
      surveys are World Bank model estimates. PIP publishes no rural or urban split for India.
      Must contain a plain "we do not know".

population:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [population_billion.latest, tfr.latest, medianagepop.latest, lex.latest]
    minSeriesMentioned: 5        # population, fertility, age, life expectancy, and births or deaths
    bannedWords: []
    brief: >
      Two short paragraphs on the UN's latest estimate year (WPP 2024, estimate for 2023): how
      many Indians there are (cite population_billion or population_crore, never the thousands), how fast the
      number grows, the fertility rate against replacement (2.1), the median age, life
      expectancy, and births against deaths, and how long fertility has been falling. Say
      nothing about projections: the facts hold estimates only, and the plates below carry the
      UN's projections. Plain words, no jargon. Write for a reader: never mention "the sheet", rankings or series names.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [population_crore.latest]
    brief: >
      The honest limits of the estimate itself: India has not taken a census since 2011, so the
      figure is the UN's model, built from that census, sample registration of births and
      deaths, and surveys, and the next census will revise it; the UN re-estimates the whole
      history every two years; a national figure hides large differences between states;
      India's own official figures can differ. Do not discuss projections or forecasts. Plain,
      literal sentences, no metaphors. Must contain a plain "we do not know".

# --- climate (lb/climate) ---
climate:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [temperature_anomaly.latest, temperature_2m.latest, climate.last12Mean]
    minSeriesMentioned: 2        # the anomaly and the average temperature it is measured against
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      The month just published: how far India's average temperature sat from the
      1991-2020 average for that month, what the month's average actually was in
      degrees, and where it ranks among the same month in every year since 1940.
      Then the last twelve months as a whole and how many months of the current
      year ran above their normal. State the rank once. Never describe the average
      temperature rising or falling from one month to the next: it falls every year
      from May into the monsoon, so only the anomaly and the same month a year
      earlier carry meaning. Concede a cool or ordinary month plainly; one month is
      weather, not climate.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [temperature_anomaly.latest, climate.century.change]
    brief: >
      The honest limits: one month is weather, and an anomaly against 1991-2020 hides
      the warming already inside that baseline (the century figure from the station
      record shows how much). The national average blurs states, days and nights,
      and dry heat and humid heat. Recent months are revised. Do not repeat the
      month's rank (the first paragraph gives it), and never describe the average
      temperature rising or falling from month to month: that is the season. Must
      contain a plain "we do not know".
# --- end climate ---

# ilo: the current bundle is the ILO's modelled participation (ilo-est-eap-2wap); the writer also
# sees employment, unemployment, NEET, labour's share and hours (registry proseInputs)
ilo:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [eap_2wap_sex_age_rt__sex_t__age_ythadult_yge15.latest, eap_2wap_sex_age_rt__sex_f__age_ythadult_yge15.latest]
    minSeriesMentioned: 4        # everyone, women, men and young people
    mustAcknowledge: [contradictions]
    brief: >
      The ILO's modelled estimates for the latest year: how many Indians are in the labour
      force, women against men, young people, and the direction since the low point of the
      late 2010s. Say plainly that these are the ILO's model estimates, not a survey. Plain
      words: no "basket", no "movers". Concede what is genuine before qualifying it.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [eap_2wap_sex_age_rt__sex_f__age_ythadult_yge15.latest]
    brief: >
      The honest limits: most years in the ILO's line are imputed by its model, not measured.
      India did run surveys in many of those years (NSS rounds, then the PLFS); the ILO flags only
      a few years as taken directly from one, so never say there was no survey;
      each yearly edition rewrites the whole history; the ILO's definitions and calendar years
      differ from MoSPI's usual-status figures, so the two never match and are never joined;
      counting women's work at all depends on what the survey calls work. Must contain a
      plain "we do not know".


# --- rates (atlas-rates) ---
rates:
  - id: current-reading.what-the-print-says
    maxSentences: 6
    dateStamp: true
    requiredFigures: [repo.latest, repo.previous, sdf.latest, msf.latest]
    minSeriesMentioned: 3        # the repo rate and the corridor around it (floor, ceiling)
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      Paragraph one: the decision of the latest Monetary Policy Committee meeting (the repo
      rate after it and before it, the SDF floor and MSF ceiling that moved with it, and the
      change in the cash reserve ratio over the year). Paragraph two: what banks were charging
      and paying in the latest lending-rate release, using only figures the sheet gives for
      loans or deposits and saying which is which (a deposit rate is never a lending rate),
      and what a fixed deposit earned after inflation from the real-rate figures. Do not
      describe the bond market. Name the month of the decision. Concede before qualifying.
  - id: current-reading.what-it-does-not-say
    maxSentences: 5
    dateStamp: false
    requiredFigures: [repo.latest]
    brief: >
      The honest limits, without repeating the figures of the other slot beyond the repo
      rate itself: a change in the repo rate reaches loans priced off it within three months
      and other loans far more slowly; the bank rates in the sheet describe months before the
      decision, so they cannot show its effect yet; the minutes, with each member's reasons,
      come about two weeks after a meeting. Real rates subtract the inflation that happened,
      not what savers expected. Do not say anything about how the members voted. Must
      contain a plain "we do not know" (for example: how quickly banks will pass the change on,
      or where inflation goes next).

# ---- external (lb/external, 2026-10): the quarter's balance of payments, RBI DBIE ----
external:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [cross.bn.current_account.latest, cross.bn.goods.latest, cross.bn.services.latest, cross.bn.private_transfers.latest]
    minSeriesMentioned: 6        # current account, goods, services, remittances, income, and the money that financed it
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      Two short paragraphs on the latest quarter of India's balance of payments. The current
      account balance first, against the quarter before and the same quarter a year earlier;
      then what made it: the goods deficit against services (software above all), remittances
      and income. Then how the gap was financed or not: direct investment, portfolio flows,
      loans and NRI deposits, and the overall balance that moved the reserves. Cite every dollar
      figure from cross.bn in US$ billion exactly as written there, never the US$ million series
      values. Say plainly that this is the first (provisional) estimate.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [cross.reserves.latest_bn, cross.annual.ca_pct_gdp]
    brief: >
      The honest limits of one quarter's account. It is a provisional estimate and will be
      revised, often by billions. One quarter is not a year: give the last full fiscal year's
      current account as a share of GDP (cross.annual). The reserves have moved since the
      quarter ended (cross.reserves, latest week and the peak), and reserves move with the
      dollar value of gold and other currencies, not only with the RBI's trading. Must contain
      a plain "we do not know" sentence about what the next revision or the current quarter
      will show.
# ---- end external ----
# credit (lb/credit): the monthly sectoral credit release
credit:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [headline.latest, non_food_credit.latest, personal_loans.latest, industry.latest]
    minSeriesMentioned: 6        # bank credit + 5 of the sectors and loan types
    mustName: [extremes]
    mustAcknowledge: [contradictions]
    brief: >
      Two short paragraphs on the month's bank credit: total growth on a year earlier and
      what drove it, by the four big sectors (agriculture, industry, services, personal
      loans) and the standouts among loan types (gold loans, loans to NBFCs, cards, home
      loans). Say how this compares with a year ago. Food credit is a tiny, seasonal line
      for grain procurement: if it is the fastest grower, say so in those terms and do not
      let it lead. A loan type whose growth slowed sharply must be described as exactly that,
      "growth slowed from X% a year earlier to Y%", never as "weakest" while it still grows
      fast. Write for a reader, not for the pipeline: never use the words "sheet", "mover",
      "print", "base" or "line". Name months in full ("August 2026"). The deep-cut counts of
      categories "rising" and "falling" are month-on-month changes in the amount lent, not
      growth rates: leave them out, or say "the amount lent rose in N of the 43 categories
      over the month". Concede what is genuine before qualifying it.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [headline.latest]
    brief: >
      The honest limits. Growth in the stock of loans is not the same as new lending, and
      says nothing about whether loans will be repaid. Sector figures come from selected
      banks, not all. NBFC lending sits outside these numbers. Since December 2025 the
      year-on-year rate compares a month-end with an older reporting Friday, which flatters
      it by an amount we do not know. Must contain a plain "we do not know". Name months in
      full ("August 2026"); never use the words "sheet", "print" or "headline".

# --- trade (lb/trade) ---
trade:
  - id: current-reading.what-the-print-says
    maxSentences: 7
    dateStamp: true
    requiredFigures: [cross.trade.exports_bn, cross.trade.imports_bn, cross.trade.exportsYoYPct, cross.trade.importsYoYPct]
    minSeriesMentioned: 3          # exports, imports and the balance: the whole current bundle
    # no mustName extremes: with three series, "extremes" is the balance and imports, which
    # the floor above already requires; naming them as extremes produced pipeline jargon
    mustAcknowledge: [contradictions]
    brief: >
      Two short paragraphs on the latest month of final tables: exports and imports in US$
      billion and their change on the same month a year earlier; the trade deficit against a
      year earlier. Then what drove it: name the chapters that rose and fell most (from
      exportDrivers and importDrivers), and say what fuel (chapter 27) and gold imports did.
      Name the largest deficit and surplus partners of the month. Close with the year so far
      (April to the latest month) against the same months a year earlier. For how broad the
      month was, use only exportBreadth, importBreadth and partners.countInDeficit /
      countInSurplus as given (say it from India's side: "India ran a deficit with N
      partners"); never infer a count from the deep-cut summaries. US$ billion
      to one decimal; growth in per cent to one decimal. Write for a reader, never about the
      data sheet: no "sheet", "line", "series" or "hottest".
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [cross.trade.quickEstimate.exports_bn]
    brief: >
      The honest limits. These are goods only: services are not in these figures (say no more
      about services than that; the facts sheet has no services data). Dollar values mix price and volume: a rise in fuel or gold imports can be
      dearer oil or gold, not more of it. Growth on a year earlier depends on that month too
      (a base effect). Give the first estimate for the next month (quickEstimate) and say it
      is provisional and will be revised. Must contain a sentence beginning "We do not know"
      about something these tables cannot tell (for example, how much of the change is price).
      Give no counts of chapters or partners here: the first slot carries them, and the
      deep-cut "rising" counts compare with the previous month, not a year earlier.
# --- end trade ---

# --- health-gender: Family health (NFHS) and Women and men (the gender compendium) ---
# Both sheets are assembled by pipeline/lib/facts-health-gender.mjs (registry factsModule): NFHS-5
# beside NFHS-4 on separate rulers, and the compendium's tables each on its own agency's calendar.
# No keyword map: these are cross-sections and many-source tables, not time series, so the
# streak and record claim checks do not apply; every figure is still traced by verify.mjs.
nfhs:
  - id: current-reading.what-the-print-says
    maxSentences: 8
    dateStamp: true
    requiredFigures: [child_anaemia.latest, stunting.latest, institutional_births.latest, men_high_bp.latest, women_high_bp.latest]
    bannedWords: []
    brief: >
      Two short paragraphs on what the National Family Health Survey's latest round, NFHS-5
      (2019-21), found for India, against NFHS-4 (2015-16) where the sheet gives an NFHS-4
      figure. First the direction of change: how many of the measures compared moved the right
      way and how many the wrong way (cross.directionOfChange), and that anaemia leads the wrong
      way (children, then women). Then children (stunting, infant deaths, full vaccination) and
      births (facility births, caesareans). Second paragraph: the adult measures NFHS-5 took
      for everyone 15 and over for the first time: the share of men and women with high blood
      pressure or taking medicine for it, and with high blood sugar or taking medicine for it
      (always say "or taking medicine"); then one fact about women's lives (bank account,
      phone, or violence by a husband). Name the rounds as "NFHS-5 (2019-21)" and "NFHS-4 (2015-16)". Never give an
      NFHS-4 figure the sheet does not hold, and never describe a change for a measure whose
      series carries noEarlierRound. Write for a reader: never mention "the sheet", series keys
      or rankings.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [cross.withheld.nfhs4LinesWithheld]
    brief: >
      The honest limits. The two rounds are separate surveys with different samples; two points
      are a change, not a trend. Some NFHS-4 figures in MoSPI's copy of the survey are filed
      against the wrong measure (cross.withheld.misfiledByMoSPI lines; for example women's bank
      accounts, which the NFHS-5 national report puts at 53 per cent in NFHS-4), and others were
      measured on a different age group or question (cross.withheld.differentAgeGroupOrQuestion
      lines: blood pressure, blood sugar, tobacco and alcohol for ages 15-49 in NFHS-4 against 15
      and over in NFHS-5, and cancer screening), so the guide withholds all
      cross.withheld.nfhs4LinesWithheld. When saying why a measure has no NFHS-4 figure, use
      that series' noEarlierRound reason; never say a measure is new in NFHS-5. The survey measures, it does not explain: it cannot say why
      anaemia rose. Must contain a plain "we do not know". Plain, literal sentences, no metaphors.

gender:
  - id: current-reading.what-the-print-says
    maxSentences: 8
    dateStamp: true
    requiredFigures: [sex_ratio_at_birth.latest, maternal_mortality.latest, women_labour_force_2025.latest, men_labour_force_2025.latest, unpaid_work_women.latest]
    bannedWords: []
    brief: >
      Two short paragraphs on where women in India stand in MoSPI's Women and Men in India 2025.
      First the count and survival: girls born per 1,000 boys in the latest Sample Registration
      System window (2021-23) against the first window the sheet gives, maternal deaths per
      1,00,000 births then and now, and that girls' infant mortality is now level with or below
      boys'. If you give life expectancy, say "life expectancy at birth in 2019-23", never "women
      born in 2019-23 can expect": it is a period measure, not a cohort's. Second paragraph, work, time and voice: women's and men's labour force
      participation in PLFS 2025, the minutes a day women and men spend on unpaid work at home
      (Time Use Survey 2024, with 2019), the rural casual wage women earn for every 100 rupees
      a man earns, and women's share of Lok Sabha seats. Name each figure's source and period
      as the sheet gives it; each comes from a different agency and calendar, so never compare
      two figures from different sources as if they were one series. Write for a reader: never
      mention "the sheet", series keys, rankings or missing tables.
  - id: current-reading.what-it-does-not-say
    maxSentences: 6
    dateStamp: false
    requiredFigures: [cross.womenShareOfAccounts.individualDepositsByValue]
    brief: >
      The honest limits. The compendium reprints other agencies' tables: each figure is that
      agency's, with its own definitions and calendar. Recorded crime is what the police
      registered, not what happened, so a high state rate can mean more reporting. Accounts in
      women's names are not money women control. Labour figures changed survey design in 2025
      and cannot be joined with the years before. There has been no census since 2011. Women's
      share of individuals' bank deposits by value (cross.womenShareOfAccounts) is far below
      their share of scheme accounts. Do not discuss the compendium's missing tables. Must contain
      a plain "we do not know". Plain, literal sentences, no metaphors.
# --- end health-gender ---
