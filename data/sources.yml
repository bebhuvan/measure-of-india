      bundles: [ilo-census-eap-dwap, ilo-census-eap-teap, ilo-census-eip-dwap, ilo-census-eip-teip, ilo-census-pop-mfrc, ilo-census-pop-xwap]
    - base: "Employment Market Information survey"
