      # published "All" aggregate row; 9/19 are state-keyed tables whose
      # All-India rows are used). Baked into asuse-owners / asuse-modernity
      # / asuse-structure.
      portrait_indicators:
        "3": ownership         # per-1000 distribution by type of ownership
        "5": owner_education   # per-1000, education of owner/major partner
        "6": owner_social_group # per-1000, social group of owner/major partner
        "9": bank_accounts     # per-1000 maintaining bank/PO accounts (state table, All-India rows used)
        "10": location         # per-1000 by type of location
        "12": operation        # per-1000 by nature of operation (perennial/seasonal/casual)
        "14": months_operated  # per-1000 by months operated + average months
        "16": working_hours    # per-1000 by hours normally worked per day
        "19": npi_status       # per-1000 NPIs vs non-NPIs (state table, All-India rows used)
        "20": computer_internet # per-1000 using computers / internet
        "22": registration     # per-1000 registered under acts / not registered
        "25": franchise        # estimated count of franchisee outlets (absolute, tiny)
      # Lean state cuts (Combined sector, activity "All", all establishment
      # types): the only state-wise variants baked. 4/7/11/13/15/17/21/23/29/
      # 31/35 are state-wise duplicates of the distribution tables above —
      # ingesting them would multiply volume without new All-India signal;
      # consciously skipped and documented on the page.
      state_indicators:
        "2": establishments
        "27": workers
        "33": gva_per_worker
      quarterly_indicators:    # calendar quarters, from Jan–Mar 2025
        "40": pct_proprietary
        "41": pct_hired_worker_estts
        "42": pct_market_estts
        "46": share_working_owner
        "47": establishments_00
        "48": workers_00
        "49": share_hired_workers
        "50": share_other_workers

