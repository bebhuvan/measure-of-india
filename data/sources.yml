    frequency_exempt: true
    family: mospi
    geo: IND
    product: plfs
    frequency: monthly        # primary bundle; quarterly and annual bundles are also emitted
    base: "PLFS revamped design (from January 2025)"   # the current ruler; seams: plfs below
    release_calendar: "monthly bulletin ~mid following month; quarterly bulletin ~6 weeks after the quarter; calendar-year report ~4 months after the year"
    revision_policy: "Final on release. Two survey designs, never joined: the original design (agriculture years 2017-18 to 2023-24, calendar years 2022 to 2024, the urban quarterly bulletin to Oct-Dec 2024) and the revamped design from January 2025 (monthly bulletin from Apr 2025, quarterly bulletin with rural areas and states from Apr-Jun 2025, calendar year 2025 on)."
    source_agency: "MoSPI, National Statistical Office"
    release_url: https://www.mospi.gov.in
    fetch:
      endpoint: plfs/getData
      indicators:
        "1": lfpr
        "2": wpr
        "3": ur
      # THE CUBE (scripts/lib/products/plfs-cube.mjs): every indicator x frequency x year is
      # fetched unfiltered, every page, and archived as served to data/raw/plfs/<freq>/
      # (gzipped JSON, indexed in data/raw/plfs-index.json). Every bundle is cut from those
      # rows (plfs.mjs: the curated headline bundles; plfs-deep.mjs: everything else), so no
      # filter quirk of the API can make two bundles disagree. A release-cycle run refetches
      # only call sets a release can change; PLFS_CUBE_FULL=1 re-asks for all of them.
      # The eight indicators: 1 LFPR, 2 WPR, 3 UR (state x gender x sector x age band, with
      # education, religion and social group cuts on the annual side); 4 percentage
      # distribution of workers (status, industry, NIC section and group, NCO division,
      # enterprise type and size, contract; quarterly: broad industry); 5 regular employees'
      # job conditions (served since about 2026-10; it answered HTTP 500 before); 6 regular
      # wage (₹/month), 7 casual wage (₹/day), 8 self-employment earnings (₹/30 days).
      # Source defects (quarantined in plfs-deep.mjs, disclosed on each series): OCR debris
      # in values ("l0.8", "IS.2", "20. I"), a WPR of 415, the Apr-Jun 2019 UR column, and
      # the Jul-Sep 2025 LFPR state labels shifted one row from Jammu & Kashmir on.

  rbi:
    # 2026-10: the external guide moved to RBI DBIE (dossiers external-bop / external-flows /
    # external-reer). The bundles DBIE replaces (forex, BoP, ratios, debt, NRI, invisibles, rates,
    # premia, intervention, turnover) are retired: rbi.mjs no longer writes them; their raw dumps
    # stay. The merchandise-trade bundles below are still written, for the trade guide's cross-check.
    family: mospi
    geo: IND
    product: rbi
    frequency: monthly
    base: "as published (US$ Millions; ₹ per US$)"
    release_calendar: "trade ~mid-month; reserves weekly/monthly; reference rates daily"
    revision_policy: "Trade figures are revised (provisional -> final). Vintages are kept."
    source_agency: "Reserve Bank of India (via MoSPI eSankhyiki)"
    release_url: https://rbi.org.in
    fetch:
      endpoint: rbi/getRbiRecords
      # FULL INGEST: every sub-indicator of the RBI product is archived to
      # data/raw/rbi/<code>-<slug>.json. Records are keyed by
      # sub_indicator_code; other dimension params (trade, currency, month)
      # are unreliable — pages are pulled unfiltered and filtered client-side.
      # Trade rows use fiscal-year labels ("2025-26"); reserves and exchange
      # rates use calendar years.
      # The curated monthly bundles below are built from the ingested rows:
      sub_indicators:
        trade: "12"     # India's Foreign Trade – US Dollars (monthly)
        forex: "47"     # Foreign Exchange Reserve Monthly
        usdinr: "36"    # Monthly Average Exchange Rates (EURO, GBP, JPY, USD)
        # further curated bundles built from the full ingest (codes fixed by
        # the API): oil/non-oil trade "42", overall BoP quarterly "4",
        # BoP ratios "22", external debt end-March "25", NRI deposits "40",
        # 4-currency rates "36", forward premia "34", RBI US$ sale/purchase
        # "28", invisibles US$ annual "9", quarterly external debt "27";
        # v1.2 adds direction of trade by partner "11" (annual, US$; the
        # source labels the UK's rows "USA" — split by size, asserted in
        # validate.mjs), major commodities exports "44" / imports "46"
        # (annual, US$; groups sum to the published Total), and forex-market
        # turnover "30" (monthly segment totals, merchant/inter-bank).
      # curated bundles carry the FULL published history (levels, not y/y);
      # any display window is a dossier decision, not a data decision.
      # COVERAGE (all 39 archived tables): BAKED into bundles — 4, 9, 11, 12,
      # 22, 25, 27, 28, 30, 34, 36, 40, 42, 44, 46, 47 (16 tables).
      # RAW ARCHIVE ONLY (each adds no honest series beyond a baked table):
      # 1 (₹ twin of 11), 2/20 (commodity×country matrix — detail behind
      # 44/46, kept as archive reference), 5/6/7/8/10/14 (older-vintage and
      # ₹ BoP/invisibles variants of 4/9), 13/16/17 (₹ and annual twins of
      # 12), 24 (twin of 42), 26 (₹ twin of 25), 29 (month high–low rate
      # detail behind 36), 31/32/33/35/37 (SDR & multi-currency rate tables
      # behind 36), 43/45 (₹ twins of 44/46), 48 (annual twin of 47).

