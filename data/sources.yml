  # ---- ilo (ILOSTAT): work in India as the ILO counts it ----
  ilo:
    # regression floor: the ILOEST edition must reach 2024, PLFS (ILO processing) 2024
    stale_after: "2024-01"
    frequency_exempt: true          # annual modelled + annual and quarterly survey bundles
    family: ilostat
    geo: IND
    product: ilostat
    frequency: annual
    base: "varies by instrument (ILOEST edition; PLFS, NSS, Census as processed by the ILO)"
    release_calendar: "ILOEST: one edition a year (November); survey series as the ILO processes each new PLFS year or quarter"
    revision_policy: "Each ILOEST edition re-estimates the whole modelled history; the raw dump of the previous edition is archived under data/raw/vintages. Survey series change when the ILO reprocesses the unit data."
    source_agency: "International Labour Organization, ILOSTAT"
    release_url: https://ilostat.ilo.org
    # peer countries: a short, fixed list, drawn in grey beside India
    peers: [CHN, BGD, IDN, VNM]
    peerFlows: [DF_EAP_2WAP_SEX_AGE_RT, DF_EMP_2WAP_SEX_AGE_RT, DF_UNE_2EAP_SEX_AGE_RT, DF_EIP_2EET_SEX_RT, DF_EMP_2IFL_SEX_RT,
      DF_EMP_2EMP_SEX_STE_NB, DF_EMP_2EMP_SEX_ECO_NB, DF_EMP_2EMP_SEX_AGE_CLA_NB, DF_EMP_2EMP_SEX_AGE_NB, DF_LAP_2GDP_NOC_RT,
      DF_GDP_211P_NOC_NB, DF_HOW_2EMP_SEX_NB]
    bake:
      # survey tables (PLFS, NSS): how many classifications (sex counts as one) a baked table may
      # carry. Deeper cubes stay at ILOSTAT, listed in the catalogue and the ledger. Raising
      # annualMaxCuts to 3 bakes ~1.9 million more observations (docs/status/ilo.md).
      annualMaxCuts: 2
      quarterlyMaxCuts: 1
      # ...except the core quarterly rates by sex and age, and by sex and area, which are baked
      quarterlyFlows: [DF_EAP_DWAP_SEX_AGE_RT, DF_EMP_DWAP_SEX_AGE_RT, DF_UNE_DEAP_SEX_AGE_RT, DF_EIP_DWAP_SEX_AGE_RT,
        DF_EAP_DWAP_SEX_GEO_RT, DF_EMP_DWAP_SEX_GEO_RT, DF_UNE_DEAP_SEX_GEO_RT]
      # survey topics with this many series or fewer fold into ilo-<instrument>-more (the
      # every-cut table lists bundles of up to 150 series inline on the guide page)
      mergeBelowSeries: 150
      # ILOSTAT's copies of other agencies' data and currency conversions: listed, never baked
      excludeFlows: ["^DF_CPI_", "^DF_CCF_", "_CUR_"]
