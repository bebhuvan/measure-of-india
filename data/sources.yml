    # regression floor (docs/RELEASE-CHECKLIST.md §2): the minimum period this
    # dossier's live bundles must cover — bump it when a release moves the data
    stale_after: "2023-04"
    family: mospi
    geo: IND
    product: asi
    frequency: annual
    base: "NIC 2008"        # current classification. The NIC 2004/1998/1987
                            # blocks ARE also ingested (legacy_blocks below)
