        total_precipitation_annual: climate-rain-owid
        yearly_burned_area: climate-burned-area
        wildfires_by_year: climate-wildfires
        weekly_wildfires: climate-wildfires-weekly
        national_contributions: climate-warming-contrib
        heat_deaths_undp_climate_horizons: climate-heat-deaths
        young_people_opinions_climate_change__hickman_et_al__2021: climate-opinion-youth
