  # New capital issues: the RBI's annual table is in calendar years to 1980 and fiscal years from
  # 1981-82; the monthly report carries a current layout and an old detailed one (to Nov 2024).
  markets-issues:
    - base: "calendar year"
      from: "1970-01"
      to: "1980-12"
      bundles: [markets-issues-annual-cy]
    - base: "fiscal year (April to March)"
      from: "1981-04"
      to: null
      bundles: [markets-issues-annual]
    - base: "current layout"
      from: "1990-04"
      to: null
      bundles: [markets-issues]
    - base: "old detailed layout"
      from: "1990-04"
      to: "2024-11"
      bundles: [markets-issues-detail]
  # The Survey of Professional Forecasters moved its GDP and CPI forecasts to the new bases
  # (GDP 2022-23, CPI 2024) from round 99 (March 2026); earlier rounds forecast the old ones.
  markets-spf:
