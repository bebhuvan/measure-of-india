      #
      # FULL SURFACE AUDIT (2026-08-08, via getIipBaseYear / getIipFilter /
      # getIIPData row inspection):
      # - iip/getIipBaseYear serves FOUR bases: 2022-23, 2011-12, 2004-05,
      #   1993-94. All four are ingested below, each as separate bundles
      #   (base-year rule). Monthly spans: 2022-23 -> Apr 2023 on;
      #   2011-12 -> Apr 2012 – Mar 2026 (Mar 2025 missing until MoSPI
      #   loaded it, seen 2026-10-09);
      #   2004-05 -> 2005–2017; 1993-94 -> 1994–2011.
      # - frequency "Annually" IS served for all four bases (FY-labelled
      #   rows; the year filter is ignored — the endpoint returns the whole
      #   set). Verified spans: 2023-24..2025-26 / 2012-13..2025-26 /
      #   2005-06..2016-17 / 1994-95..2010-11 with the SAME series sets as
      #   monthly (43/33/31/26). No longer history, no finer detail — a
      #   derivable FY-average twin of the monthly. NOT baked.
      # - the filter space is year/month/type/category/subcategory only.
      #   subcategory is 2-digit NIC (32/23/22/17 entries per base): the API
      #   serves NO 3-digit NIC detail, no state cut, no item level.
      # - use-based classification is served and baked for every base. The
      #   pre-2011 bases use the older 5-way scheme (Basic Goods instead of
