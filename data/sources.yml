    # regression floor: BSR-2 is annual, as on 31 March
    stale_after: "2026-03"
    family: databank
    geo: IND
    product: bsr2
    frequency: annual
    base: "as on 31 March"
    release_calendar: "annual, about two months after 31 March"
    revision_policy: "BSR-2 stocks are final on release for the year; the sector classification changed in 2018-19 and the deposit-size bands in March 2026 (both disclosed, never spliced)."
