      csv_bundles:
        co2: { IND: climate-co2, CHN: climate-co2-chn, USA: climate-co2-usa, WLD: climate-co2-world }
        energy: { IND: climate-energy, CHN: climate-energy-chn, USA: climate-energy-usa, WLD: climate-energy-world }
      # OWID dataset (ETL short name, version dropped) -> bundle. In-scope datasets left out
      # here are decided in data/coverage/climate-owid.yml (pivots of a baked series).
