        "2": adult_characteristics
        "3": marriage_fertility
        "4": child_mortality
        "5": family_planning
        "6": unmet_need_fp
        "7": fp_quality
        "8": maternity_care
        "9": delivery_care
        "10": child_vaccination
        "11": childhood_disease
        "12": child_feeding_nutrition
        "13": adult_nutrition
        "14": anaemia
        "15": blood_sugar
        "16": hypertension
        "17": cancer_screening
        "18": hiv_knowledge
        "19": womens_empowerment
        "20": gender_violence
        "21": tobacco_alcohol

