    source_agency: "Ministry of New and Renewable Energy (via MoSPI eSankhyiki)"
    release_url: https://mnre.gov.in
    fetch:
      endpoint: mnre/getDataByEnergy
      # Five renewable energy types, each a cumulative INSTALLED CAPACITY
      # stock in MW (not generation): Solar (1), Wind (2), Hydro (3), Bio (4),
      # Total (5). Monthly from Jan 2020 to the latest month served.
      # state_code 36 = All India. Categories vary by type:
      #   Solar (1):  Ground Mounted / Rooftop (PM Surya Ghar) / Hybrid /
      #               Off-Grid KUSUM / Solar Power Total
      #   Wind (2):   no category dimension (single total per month)
      #   Hydro (3):  Small Hydro / Large Hydro
      #   Bio (4):    Waste to Energy / Biomass Bagasse / Biomass Non-Bagasse /
      #               Waste to Energy Off-Grid / Bio Power Total
      #   Total (5):  no category (grand total of all RE capacity)
      #
      # CLASSIFICATION BREAK — "large hydro added" (Dec 2023):
      # Large Hydro Power (type 3) reads 0.00 MW through Nov 2023, then jumps
      # to ~46,910 MW in Dec 2023. This is not a capacity addition — it is a
      # definitional change: large hydro (>25 MW) was folded into the RE
      # total starting Dec 2023. The published Grand Total (type 5) carries
      # the step: 132.7 GW (Nov 2023) → 180.8 GW (Dec 2023), of which ~47 GW
      # is the reclassification. The Total series before and after Dec 2023
      # is NOT comparable — the dossier annotates the break as a seam and
      # never computes growth across it. Individual sources (Solar, Wind,
      # Small Hydro, Bio) are unaffected.
      types:
        "1": solar
        "2": wind
        "3": hydro
        "4": bio
        "5": total
      state_all_india: 36

