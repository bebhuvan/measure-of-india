    revision_policy: "Weekly reserves and daily rates are final on release. Investment flows, ECBs and LRS are revised in later Bulletins; external debt is provisional for a quarter, then partially revised."
    source_agency: "Reserve Bank of India, Database on Indian Economy (via the Data Bank)"
    release_url: https://data.rbi.org.in
    # Classification breaks kept as separate bundles, never joined: foreign investment inflows'
