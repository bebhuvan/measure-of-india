    fetch:
      endpoint: asi/getASIData
      classification_year: 2008
      # getASIData honours server-side filters (VERIFIED 2026-08-06 by
      # totalPages + row inspection): unfiltered = 226,635 pages at limit=10
      # (~2.27M rows); +indicator_code=19 -> 4,048; +state_code=99 -> 414;
      # +nic_code=99999 -> 5; +nic_type=2-digit -> 48. nic_id is IGNORED
      # (same totals as without). asi/getDownloadASIRecords returns nothing.
      # Ingest strategy: (a) All-India × nic 99999 (All) × all 57 indicators;
      # (b) All-India × 2-digit NIC × core indicators; (c) state-wise ×
      # nic 99999 × core indicators. Never page the unfiltered stream.
      # NOTE: nic_code=99999 rows arrive in TRIPLICATE (once per nic_type,
      # identical values) — deduped client-side.
      headline_indicators:     # baked into asi-headline.json
        "1": number_of_factories
        "2": factories_in_operation
        "3": fixed_capital
        "6": invested_capital
        "15": total_output
        "18": total_inputs
        "19": gva
        "21": net_value_added
        "31": persons_engaged
        "32": workers
        "43": emoluments       # Wages & Salaries Incl. Employer's Contribution
      core_indicators:         # 2-digit NIC + state-wise cuts
        "2": factories_in_operation
        "3": fixed_capital
        "15": total_output
        "19": gva
        "31": persons_engaged
        "43": emoluments
      # Older classification blocks (VERIFIED live 2026-08-06 via
      # asi/getAsiFilter + getASIData probes): same param scheme as 2008,
      # nic_code=99999 is "All" in every block, rows arrive once per
      # nic_type (2004: ×3; 1998/1987: ×2) with identical values — deduped.
      # Year ranges as served: 2004 block 2004-05..2007-08 (4 yrs, 57
      # indicators); 1998 block 1998-99..2003-04 (6 yrs, 28 indicators —
      # NO GVA, NO factories-in-operation, NO emoluments-43); 1987 block
      # 1992-93..1997-98 with 1993-94 NOT SERVED (5 yrs, 32 indicators —
      # NO GVA; Total Emoluments is code 59 and carries unit "-" at source
      # though it is ₹ lakh). Ingested All-India × NIC 99999 only; baked
      # as asi-headline-<block>.json, never spliced with each other or 2008.
      legacy_blocks:
        "2004":
          base: "NIC 2004"
          core:
            "1": number_of_factories
            "2": factories_in_operation
            "3": fixed_capital
            "6": invested_capital
            "15": total_output
            "18": total_inputs
            "19": gva
            "21": net_value_added
            "31": persons_engaged
            "32": workers
            "43": emoluments
        "1998":
          base: "NIC 1998"
          core:
            "1": number_of_factories
            "3": fixed_capital
            "6": invested_capital
            "15": total_output
            "18": total_inputs
            "21": net_value_added
            "31": persons_engaged
            "32": workers
            "44": wages_incl_bonus   # closest wage aggregate the block serves
        "1987":
          base: "NIC 1987"
          core:
            "1": number_of_factories
            "3": fixed_capital
            "6": invested_capital
            "15": total_output
            "18": total_inputs
            "21": net_value_added
            "31": persons_engaged
            "32": workers
            "59": total_emoluments   # unit "-" at source; it is ₹ lakh (disclosed)

