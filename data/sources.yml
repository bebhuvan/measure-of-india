# ---------------------------------------------------------------------------
# SEAMS: the base-year registry (2026-10). One entry per base (or
# classification) for every product whose instrument has changed ruler.
# validate.mjs enforces it: every bundle of these dossiers is listed under
# exactly one base, its meta.base equals that base, and its dates stay inside
# the base's window (`to: null` = the live base). Overlaps between bases are
# computed and reported, never joined.
#
# A `bridge` is allowed only where the AGENCY publishes the link itself (a
# back series or a linking factor). Bundles that use it are listed under
# `bridge.bundles`. We never chain-link or back-cast on our own.
#
# Windows are the agency's own spans for each base, checked live on the MoSPI
# MCP server 2026-10-09 (get_metadata + get_data probes).
  # ---- farms (lb/farms): what India grows, where, per hectare, and what the state pays ----
  # RBI DBIE agriculture reports via the Data Bank, report 190 and the Handbook grids via the
  # RBI Innovation Hub (scripts/lib/products/farms.mjs). Rulers kept apart: the ministry's
  # final estimates and its latest advance estimate; index numbers on three bases.
  farms:
    # regression floor: final crop estimates run to 2024-25 (2025-26 is an advance estimate)
    stale_after: "2024-04"
    family: databank
    geo: IND
    product: farms
    frequency: annual
    frequency_exempt: true      # the part-year stock position is dated, not annual
    base: "ministry final estimates"
    release_calendar: "annual in the RBI Handbook (September); the agriculture ministry's advance estimates through the crop year, final estimates about a year after it ends; MSPs before each sowing season"
    revision_policy: "Advance estimates are revised until the ministry's final estimates; final figures change rarely. The latest year is kept apart as an advance estimate, never joined to the final years."
    source_agency: "Reserve Bank of India, DBIE (agriculture ministry and food ministry data), via the Data Bank"
    release_url: https://data.rbi.org.in
  # ---- end farms ----# ---- energy expansion ----
