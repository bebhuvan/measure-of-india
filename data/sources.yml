      #   rows; the year filter is ignored — the endpoint returns the whole
      #   set). Verified spans: 2023-24..2025-26 / 2012-13..2025-26 /
      #   2005-06..2016-17 / 1994-95..2010-11 with the SAME series sets as
      #   monthly (43/33/31/26). No longer history, no finer detail — a
      #   derivable FY-average twin of the monthly. NOT baked.
      # - the filter space is year/month/type/category/subcategory only.
      #   subcategory is 2-digit NIC (32/23/22/17 entries per base): the API
