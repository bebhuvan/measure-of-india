  # ---- ilo (ILOSTAT): work in India as the ILO counts it ----
  ilo:
    # regression floor: the ILOEST edition must reach 2024, PLFS (ILO processing) 2024
    stale_after: "2024-01"
    frequency_exempt: true          # annual modelled + annual and quarterly survey bundles
    family: ilostat
    geo: IND
    product: ilostat
    frequency: annual
    base: "varies by instrument (ILOEST edition; PLFS, NSS, Census as processed by the ILO)"
    release_calendar: "ILOEST: one edition a year (November); survey series as the ILO processes each new PLFS year or quarter"
    revision_policy: "Each ILOEST edition re-estimates the whole modelled history; the raw dump of the previous edition is archived under data/raw/vintages. Survey series change when the ILO reprocesses the unit data."
    source_agency: "International Labour Organization, ILOSTAT"
    release_url: https://ilostat.ilo.org
    # peer countries: a short, fixed list, drawn in grey beside India
    peers: [CHN, BGD, IDN, VNM]
    peerFlows: [DF_EAP_2WAP_SEX_AGE_RT, DF_EMP_2WAP_SEX_AGE_RT, DF_UNE_2EAP_SEX_AGE_RT, DF_EIP_2EET_SEX_RT, DF_EMP_2IFL_SEX_RT,
      DF_EMP_2EMP_SEX_STE_NB, DF_EMP_2EMP_SEX_ECO_NB, DF_EMP_2EMP_SEX_AGE_CLA_NB, DF_EMP_2EMP_SEX_AGE_NB, DF_LAP_2GDP_NOC_RT,
      DF_GDP_211P_NOC_NB, DF_HOW_2EMP_SEX_NB]
    bake:
      # survey tables (PLFS, NSS): how many classifications (sex counts as one) a baked table may
      # carry. Deeper cubes stay at ILOSTAT, listed in the catalogue and the ledger. Raising
      # annualMaxCuts to 3 bakes ~1.9 million more observations (docs/status/ilo.md).
      annualMaxCuts: 2
      quarterlyMaxCuts: 1
      # ...except the core quarterly rates by sex and age, and by sex and area, which are baked
      quarterlyFlows: [DF_EAP_DWAP_SEX_AGE_RT, DF_EMP_DWAP_SEX_AGE_RT, DF_UNE_DEAP_SEX_AGE_RT, DF_EIP_DWAP_SEX_AGE_RT,
        DF_EAP_DWAP_SEX_GEO_RT, DF_EMP_DWAP_SEX_GEO_RT, DF_UNE_DEAP_SEX_GEO_RT]
      # ILOSTAT's copies of other agencies' data and currency conversions: listed, never baked
      excludeFlows: ["^DF_CPI_", "^DF_CCF_", "_CUR_"]

# ---------------------------------------------------------------------------
# SEAMS: the base-year registry (2026-10). One entry per base (or
# classification) for every product whose instrument has changed ruler.
# validate.mjs enforces it: every bundle of these dossiers is listed under
# exactly one base, its meta.base equals that base, and its dates stay inside
# the base's window (`to: null` = the live base). Overlaps between bases are
# computed and reported, never joined.
#
# A `bridge` is allowed only where the AGENCY publishes the link itself (a
# back series or a linking factor). Bundles that use it are listed under
# `bridge.bundles`. We never chain-link or back-cast on our own.
#
# Windows are the agency's own spans for each base, checked live on the MoSPI
# MCP server 2026-10-09 (get_metadata + get_data probes).
seams:
  cpi:
    - base: "2012=100"
      from: "2011-01"
      to: "2025-12"
      bundles: [cpi, cpi-rural, cpi-urban, cpi-subgroups, cpi-states, cpi-states-sectors]
    - base: "2024=100"
      from: "2013-01"        # series=Back from 2013; series=Current from 2025-01
      to: null
      bundles: [cpi-2024, cpi-2024-sectors, cpi-2024-groups, cpi-2024-items, cpi-2024-states, cpi-2024-states-sectors]
      bridge:
        kind: agency back series
        what: "NSO back-cast of the 2024=100 General index, All India, 2013 to 2024 (series=Back); headline only, no components"
        bundles: [cpi-2024-back, cpi-2024-linked]
  wpi:
    - base: "2011-12=100"
      from: "2012-04"
      to: "2026-04"
      bundles: [wpi, wpi-groups, wpi-subgroups, wpi-items]
    - base: "2022-23=100"
      from: "2023-04"
      to: null
      bundles: [wpi-2022, wpi-2022-groups, wpi-2022-subgroups, wpi-2022-items]
  iip:
    - base: "1993-94=100"
      from: "1994-04"
      to: "2011-06"
      bundles: [iip-1993, iip-industries-1993]
    - base: "2004-05=100"
      from: "2005-04"
      to: "2017-03"
      bundles: [iip-2004, iip-industries-2004]
    - base: "2011-12=100"
      from: "2012-04"
      to: "2026-03"
      bundles: [iip-2011, iip-industries-2011]
    - base: "2022-23=100"
      from: "2023-04"
      to: null
      bundles: [iip-2022, iip-industries-2022]
  gdp:
    # quarters are dated at their first month (Q2 FY26 = 2025-07); annual
    # rows at April of the fiscal year
    - base: "2011-12"
      from: "2011-04"
      to: "2025-07"
      bundles: [gdp, gdp-expenditure, gdp-accounts, gdp-industries, gdp-nominal]
      bridge:
        kind: agency back series
        what: "NSO back series (series=Back) at 2011-12 prices, annual 1950-51 to 2011-12; growth from 1951-52"
        from: "1950-04"
        to: "2011-04"
        bundles: [gdp-back]
    - base: "2022-23"
      from: "2022-04"
      to: null
      bundles: [gdp-2022, gdp-2022-expenditure, gdp-2022-industries, gdp-2022-nominal, gdp-2022-accounts]
  cpialrl:
    - base: "1986-87=100"
      from: "1995-07"
      to: "2025-05"
      bundles: [cpialrl-1986, cpialrl-states-1986]
    - base: "2019=100"
      from: "2025-06"
      to: null
      bundles: [cpialrl-2019, cpialrl-groups-2019, cpialrl-states-2019]
  asi:
    # not price bases: NIC classification blocks, equally never joined
    - base: "NIC 1987"
      from: "1992-04"
      to: "1997-04"
      bundles: [asi-headline-1987]
    - base: "NIC 1998"
      from: "1998-04"
      to: "2003-04"
      bundles: [asi-headline-1998]
    - base: "NIC 2004"
      from: "2004-04"
      to: "2007-04"
      bundles: [asi-headline-2004]
    - base: "NIC 2008"
      from: "2008-04"
      to: null
      bundles: [asi-headline, asi-accounts, asi-industries, asi-states]
  isp:
    - base: "2024-25=100"
      from: "2025-04"
      to: null
      bundles: [isp]
  # ilo (ILOSTAT): not price bases but instruments, each its own ruler, never joined.
  # Generated from the baked bundles; a new ilo bundle fails validate until it is listed here.
  ilo:
    - base: "Labour inspectorate records (ADM-IR)"
      from: "1971-01"
      to: null
      bundles: [ilo-adm-ir-inj-fatl, ilo-adm-ir-inj-nftl, ilo-adm-ir-sdg-f881, ilo-adm-ir-sdg-n881]
    - base: "Labour inspectorate records (ADM-LIR)"
      from: "1969-01"
