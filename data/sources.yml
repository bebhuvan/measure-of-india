    base: "RBI overall-BoP layout"
    release_calendar: "quarterly, about 12 weeks after the quarter (last week of Mar, Jun, Sep, Dec)"
    revision_policy: "Provisional on release; partially revised with the next quarter's release and revised again later. DBIE keeps the first and the latest version of recent quarters; both are kept."
    source_agency: "Reserve Bank of India, Database on Indian Economy (via the Data Bank)"
    release_url: https://data.rbi.org.in
