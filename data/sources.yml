# India Atlas — data source registry
# Normative config for scripts/fetch.mjs. Every baked file in data/series/
# must be traceable to an entry here.
#
# BASE-YEAR RULE (integrity): series on different base years are NEVER
# spliced, chained, or back-calculated into one continuous array. Each base
# is a separate series key, plotted side by side with an event annotation at
# the changeover ("base revised 2011-12 → 2022-23"). A series that crosses a
# base revision is a defect; validate.mjs fails on it.

families:
  mospi:
    transport: mospi
    base: https://api.mospi.gov.in/api/
    note: >
      MoSPI eSankhyiki API. The host requires legacy TLS renegotiation;
      scripts/lib/mospi.mjs sets SSL_OP_LEGACY_SERVER_CONNECT. Endpoint names
      were recovered from the eSankhyiki SPA bundle (see docs/reference/esankhyiki-api.md).
  worldbank:
    transport: worldbank
    base: https://api.worldbank.org/v2/
    note: >
      World Bank API v2 (WDI, Data360). JSON envelope [metadata, rows];
      scripts/lib/worldbank.mjs paginates it. No key required; be polite:
      per_page 500, one request at a time.
  # worldbank family session (2026-10-09): UN WPP, the population guide's projections
  unpd:
    transport: http-gzip-csv
    base: https://population.un.org/wpp/assets/Excel%20Files/
    note: >
      UN DESA Population Division, World Population Prospects standard CSV files (gzip,
      all countries). scripts/lib/products/wpp.mjs downloads them with net.mjs getBuffer and
      caches them in data/raw/http-cache for 30 days; WPP is revised every two years.
  databank:
    transport: local
    root: "~/Documents/Data/Data bank"
    note: >
      The owner's local Data Bank (validation-first data lake). Read-only: adapters read the
      RBI DBIE webi mirror (dataset rbi_dbie_webi_rows) through scripts/lib/databank.mjs.
      Refresh the mirror with the Data Bank's own CLI (docs/RBI_DBIE_WEBI_RUNBOOK.md there),
      then run `npm run data`. Override the path with INDIA_ATLAS_DATABANK.
  # --- climate (lb/climate) ---
  owid:
    transport: owid
    base: https://ourworldindata.org/
    note: >
      Our World in Data: the CO2 and energy datasets (CSV plus codebook) and OWID's own
      indicators (api.ourworldindata.org/v1/indicators/<id>.data.json). Licence CC BY 4.0:
      credit OWID and the underlying producer. scripts/lib/owid.mjs; docs/reference/owid.md.
  cckp:
    transport: cckp
    base: https://cckpapi.worldbank.org/cckp/v1/
    note: >
      World Bank Climate Change Knowledge Portal aggregation API (ERA5, CRU TS, CMIP6 by
      country and first-level unit) and its public S3 bucket (the catalogue). No key.
      scripts/lib/cckp.mjs; docs/reference/cckp.md.
  # --- end climate ---

  # ---- bis family session (housing, debt) ----
  bis:
    transport: http
    base: https://stats.bis.org/api/v1/
    note: >
      Bank for International Settlements statistics API (SDMX). Used ONLY for the coverage
      catalogue (series-key listings, scripts/lib/bis.mjs); BIS values are read from the Data
      Bank's bis_series and bis_daily datasets. No key; one request at a time, 3 s apart.
  nhb:
    transport: http
    base: https://residex.nhbonline.org.in/
    note: >
      National Housing Bank RESIDEX dashboards (ASP.NET, form POSTs that answer JSON). Three
      bases, each its own controller: DashboardBY2013, DashboardBY2018, Dashboard (2024-25).
      scripts/lib/nhb.mjs posts one request at a time, 1.5 s apart. See docs/reference/residex.md.
  # ---- end bis family ----

dossiers:

  cpi:
    # regression floor (docs/RELEASE-CHECKLIST.md §2): the minimum period this
    # dossier's live bundles must cover — bump it when a release moves the data
    stale_after: "2026-06"
    family: mospi
    geo: IND
    product: cpi
    frequency: monthly
    base: "2012=100"
    release_calendar: "~12th of each month"
    revision_policy: "CPI is final on release; never revised."
    source_agency: MoSPI, National Statistical Office
    release_url: https://www.mospi.gov.in
    fetch:
      endpoint: cpi/getCPIData
      params:
        base_year: 2012
        level: Group
        series: Current
        state_code: 99      # All India
        sector_code: 3      # Combined
      # subgroup codes of the six COICOP groups (+ 0.99 published headline,
      # fetched only to cross-check the computed headline in validate.mjs)
      subgroups:
        "0.99": published_headline
        "1.99": food
        "2.99": pan
        "3.99": clothing
        "4.99": housing
        "5.99": fuel
        "6.99": misc
    # CPI (Combined) group weights, base 2012 — sum must equal 100.00
    weights:
      food: 45.86
      pan: 2.38
      clothing: 6.53
      housing: 10.07
      fuel: 6.84
      misc: 28.32
    # Sector weights, same base. Rural officially has no housing group.
    weights_rural:
      food: 54.18
      pan: 3.26
      clothing: 7.36
      fuel: 7.94
      misc: 27.26
    weights_urban:
      food: 36.29
      pan: 1.36
      clothing: 5.57
      housing: 21.67
      fuel: 5.58
      misc: 29.53
    derived:
      headline: weighted index of all six groups, then y/y   # never stored independently
      core: weighted index of [pan, clothing, housing, misc], then y/y
    window: { start: "2016-01" }
    # ---- base 2024=100 (rebased series) ----
    # The 2012-base stream stopped at Dec 2025; from Jan 2025 the API serves a
    # rebased series on 2024=100 with a COICOP-2018-style hierarchy (13
    # divisions replace the six groups; division 0 is CPI General). Separate
    # bundles, never spliced with the 2012 base (base-year rule).
    # Param scheme differs from the 2012 base: division_code replaces
    # subgroup_code, and state_code 1 (not 99) is All India. A division_code
    # query returns the aggregate row plus its child group/class rows — the
    # fetcher keeps only rows with group == null.
    # WEIGHTS: the API serves no weight field for this base (checked the
    # filter payload, the record rows and getCpiBaseYear). Until it does, the
    # headline is the PUBLISHED all-groups index (division 0) and no computed
    # cross-check is possible — disclosed in meta.note and the dossier.
    # series=Back is the NSO's own back-cast of the General index on the 2024
    # base, 2013–2024, headline only — baked as its own bundle, never merged.
    #
    # DEPTH COVERAGE (audited live 2026-08-08; volumes measured from
    # meta_data.totalRecords). One getCPIData stream carries EVERY level of
    # the COICOP-2018-style hierarchy — the level param is ignored;
    # division/group/class/item/month/state/sector/year params filter
    # server-side. All India × Combined = exactly 668 rows per month:
    # 1 General + 12 divisions + 43 groups + 92 classes + 162 sub-classes +
    # 358 items, every month from Jan 2025. Per level:
    #   divisions (13)      BAKED  cpi-2024.json (+ sectors, back-cast)
    #   groups (43)         BAKED  cpi-2024-groups.json (combined)
    #   classes (92)        RAW    data/raw/cpi-2024-grid.json only —
    #   sub-classes (162)   RAW    intermediate aggregates between the baked
    #                              group and item levels; no honest plate
    #   items (358)         BAKED  cpi-2024-items.json (combined; y/y where a
    #                              same-base year-ago level exists, plus each
    #                              item's code, division and latest level)
    #   states/UTs (36)     BAKED  cpi-2024-states.json (combined General) and
    #                              cpi-2024-states-sectors.json (rural/urban)
    # Rural/urban below the division level are NOT ingested (3× the volume
    # for no dossier slot); the division-level sectors bundle stands.
    # IMPUTATION: item rows carry a Y/N flag (Y = index imputed, not priced
    # that month). Every All-India Combined item row served so far is N —
    # disclosed in cpi-2024-items.json meta.imputationNote and checked in
    # validate.mjs.
    fetch2024:
      endpoint: cpi/getCPIData
      base: "2024=100"
      params:
        base_year: 2024
        level: Group
        series: Current
        state_code: 1       # All India (this base; 99 in the 2012 base)
    window2024: { start: "2026-01" }   # first month with a same-base year-ago level
    # ---- base 2010=100: ARCHIVED, NOT BAKED ----
    # Probed live 2026-08-08: getCpiFilterByLevelAndBaseYear?base_year=2010
    # serves a 48-month fragment, Jan 2011 – Dec 2014, on the pre-2012 scheme
    # (7 groups / 28 subgroups; state_code 99 = All India; an item list of
    # 318 exists in the filter but the dossier takes no position on it).
    # Decision: the fragment's whole span predates the dossier window (2016)
    # and is superseded by the 2012 base; baking would add a third ruler to
    # the seam plate for 48 months of retired readings. The All-India
    # Combined table (28 subgroups × 48 months) is archived to
    # data/raw/cpi-2010-indices.json as the audit trail. 2011 rows carry
    # inflation=null at source (no 2010 monthly levels) — preserved.
    archive2010: true

  gdp:
    # regression floor (docs/RELEASE-CHECKLIST.md §2): the minimum period this
    # dossier's live bundles must cover — bump it when a release moves the data
    stale_after: "2026-01"
    family: mospi
    geo: IND
    product: nas
    frequency: quarterly   # fiscal quarters: Q1 = Apr–Jun
    base: "2011-12"
    release_calendar: "end of Feb / May / Aug / Nov"
    revision_policy: "Revised continuously; finalised over ~3 years. Vintages are kept."
    source_agency: MoSPI, National Statistical Office
    release_url: https://www.mospi.gov.in
    fetch:
      endpoint: nas/getNASData
      params:
        base_year: "2011-12"
        series: Current
        frequency_code: 2   # Quarterly
        account_code: 1     # National
      # NAS indicator codes; constant-price (real) levels are fetched and
      # y/y growth is computed from levels — never taken from the API's
      # rounded whole-number growth-rate indicator.
      # ALL 22 NAS indicators are ingested to raw. Growth-rate indicators
      # (21, 22) are rounded to whole numbers — kept only to cross-check the
      # growth we compute from constant-price levels.
      indicators:
        "5": gdp            # Gross Domestic Product
        "1": gva            # Gross Value Added
        "10": pfce          # Private Final Consumption Expenditure
        "9": gfcf           # Gross Fixed Capital Formation
        "11": gfce          # Government Final Consumption Expenditure
        "12": stocks        # Change in Stock — raw only; swings sign, y/y meaningless
        "13": valuables     # Valuables — raw only; same reason
        "14": exports       # Export of Goods and Services
        "15": imports       # Import of Goods and Services
        "2": net_taxes      # Net Taxes on Products
        "3": taxes          # Taxes on Products
        "4": subsidies      # Subsidies on Products
        "6": cfc            # Consumption of Fixed Capital
        "7": ndp            # Net Domestic Product
        "8": gcf_industry   # Gross Capital Formation by Industry of Use
        "16": primary_income_row  # Primary Income Receivable Net From RoW
        "17": gni           # Gross National Income
        "18": transfers_row # Other Current Transfers Net From RoW
        "19": gndi          # Gross National Disposable Income
        "20": gross_saving  # Gross Saving
        "21": gva_growth_published  # cross-check only (rounded)
        "22": gdp_growth_published  # cross-check only (rounded)
      # ic1/ic21 carry an industry dimension QUARTERLY. The Total row is
      # pinned explicitly (15 = Total GVA, 17 = Total GVA growth rate) —
      # an unfiltered fetch returns every industry and only row-order luck
      # makes last-write-wins land on the total.
      industry_totals: { "1": 15, "21": 17 }
      # the release's 8-sector table: real GVA by industry, quarterly.
      # Published rounded growth (ic21 per industry) is kept as cross-check.
      industries:
        "1": agriculture      # Agriculture, Livestock, Forestry and Fishing
        "2": mining           # Mining and Quarrying
        "3": manufacturing    # Manufacturing
        "4": utilities        # Electricity, Gas, Water Supply & Other Utility Services
        "5": construction     # Construction
        "6": trade_transport  # Trade, Hotels, Transport, Communication & Broadcasting
        "9": finance_realty   # Financial, Real Estate & Professional Services
        "12": public_admin    # Public Administration, Defence & Other Services
      # The NEW BASE. Quarterly prints on base 2011-12 END at Q2 FY26 (the
      # 28 Nov 2025 release); from the Feb 2026 release the quarterly series
      # continues on base 2022-23 only. Baked as its own bundle
      # (gdp-2022.json), never spliced — same rule as cpi-2024 / iip-2022.
      # y/y needs a same-base year-ago level, so it starts Q1 FY24.
      fetch2022:
        base_year: "2022-23"
        # this base codes ic21's Total row as industry 15 (the old base
        # uses 17) — pinned per base
        industry_totals: { "1": 15, "21": 15 }
        # FULL SET (2026-10): every national indicator the 2022-23 base serves,
        # built by the same buildBase() as 2011-12 into gdp-2022*.json:
        # headline, expenditure, industries, nominal and the annual accounts.
        # Industry codes 1-15 are the same on both bases (checked live
        # 2026-10-09 via MCP get_metadata). Taxes, subsidies, CFC, primary
        # income, transfers and saving are annual and run to 2024-25 only.
        indicators:
          "5": gdp
          "1": gva
          "10": pfce
          "9": gfcf
          "11": gfce
          "12": stocks
          "13": valuables
          "14": exports
          "15": imports
          "2": net_taxes
          "3": taxes
          "4": subsidies
          "6": cfc
          "7": ndp
          "8": gcf_industry
          "16": primary_income_row
          "17": gni
          "18": transfers_row
          "19": gndi
          "20": gross_saving
          "21": gva_growth_published  # cross-check only (rounded)
          "22": gdp_growth_published  # cross-check only (rounded)
      # THE BACK SERIES (2026-10): the NSO's own back-cast, series=Back on base
      # 2011-12, annual 1950-51 to 2011-12 (checked live 2026-10-09). No
      # taxes, subsidies or growth indicators are served on it; valuables
      # start 1998-99. Baked as gdp-back.json, an agency bridge in `seams`,
      # never joined to the current series.
      back:
        base_year: "2011-12"
        base: "2011-12"
        industry_totals: { "1": 15 }
        indicators:
          "5": gdp
          "1": gva
          "10": pfce
          "9": gfcf
          "11": gfce
          "14": exports
          "15": imports
          "7": ndp
          "17": gni
          "20": gross_saving
        # the Back series codes industries without the combined groups 6, 9, 12
        industries:
          "1": agriculture
          "2": mining
          "3": manufacturing
          "4": utilities
          "5": construction
          "7": trade_hotels
          "8": transport
          "10": finance
          "11": realty
          "13": public_admin
          "14": other_services
      # NOT SERVED nationally: per-capita GDP/GNI/NNI. The API's per-capita
      # indicators (25, 28, 31) live in the Regional account, state-wise only
      # — there is no All-India row (checked the state filter list). The
      # dossier discloses this rather than deriving one from a population
      # guess.
    window: { start: "2016-Q1" }   # Q1 FY17 = Apr–Jun 2016
    window2022: { start: "2023-Q1" }  # first quarter with a same-base year-ago level

  wpi:
    # regression floor (docs/RELEASE-CHECKLIST.md §2): the minimum period this
    # dossier's live bundles must cover — bump it when a release moves the data
    stale_after: "2026-04"
    family: mospi
    geo: IND
    product: wpi
    frequency: monthly
    base: "2011-12=100"
    release_calendar: "~14th of each month (provisional); final ~8 weeks later"
    revision_policy: "Provisional prints are revised to final ~8 weeks after release. Vintages are kept."
    source_agency: "Office of the Economic Adviser, DPIIT (via MoSPI eSankhyiki)"
    release_url: https://eaindustry.nic.in
    fetch:
      endpoint: wpi/getWpiRecords
      params:
        base_year: "2011-12"
        limit: 500
      # aggregate rows are identified by group/subgroup/item == null
      major_groups:
        "1000000000": published_headline   # Wholesale price index — cross-check only
        "1100000000": primary              # Primary articles
        "1200000000": fuel                 # Fuel & power
        "1300000000": manufactured         # Manufactured products
        "2000000000": food_index           # Food index (spans primary + manufactured food; published directly)
      # ITEM LEVEL (v1.2) — coverage below the majors is COMPLETE:
      # major-group -> group (29) -> sub-group (134) -> item (697). Audited
      # against wpi/getWpiData filter metadata (2026-08): 697 items (117
      # primary / 16 fuel / 564 manufactured), labels unique across the
      # basket, so slugified labels are safe keys. The item rows ride in the
      # SAME paged major-group×year stream the aggregate fetch already pulls
      # (~350 pages at limit 500, ~10.4k rows/year, of which 697×12 are
      # items) — keeping them costs zero extra requests. The headline and
      # food-index major groups serve only their own 12 aggregate rows/year.
      # Four sub-sub-group aggregates (Cereals, Pulses, Vegetables, Fruits)
      # sit between sub-group and item — archived to raw only.
      # SIZE DECISION: full y/y history for all 697 items bakes to ~1 MB
      # (measured), well under the 8-10 MB cross-section-only fallback
      # threshold — so wpi-items.json carries every item's complete y/y
      # history; full level histories live in data/raw/wpi-items.json.
      # Item WEIGHTS are not served by the API: no weighted recomposition is
      # asserted at item level; validate.mjs instead checks that each
      # sub-group's latest y/y lies inside the min–max hull of its items'
      # y/y (a weighted mean must), plus item y/y recomputation from levels.
      items: full   # all 697 -> data/series/wpi-items.json + data/raw/wpi-items.json
    # THE NEW BASE (2026-10). The 2011-12 base ENDS at Apr 2026; the OEA's
    # current series is base 2022-23, Apr 2023 on. Baked as its own bundles
    # (wpi-2022*.json), never spliced — same rule as cpi-2024 / iip-2022.
    # Checked live 2026-10-09 (MCP get_metadata + getWpiRecords): 5 major
    # groups (Food index recoded 1400000000), 29 groups, 142 sub-groups,
    # 953 items; crude petroleum & natural gas moved into Fuel & power;
    # limit > 100 returns HTTP 400 on this base. No weights are served, so
    # the headline is the published index. Both bases overlap Apr 2023 –
    # Apr 2026 (37 months of levels, 25 of y/y): pages draw both rulers
    # through the overlap rather than joining them.
    fetch2022:
      base_year: "2022-23"
      base: "2022-23=100"
      first_year: 2023
      limit: 100
      # API label (case-insensitive) -> bundle key
      major_groups:
        "Wholesale Price Index": published_headline
        "Primary Articles": primary
        "Fuel & Power": fuel
        "Manufactured Products": manufactured
        "Food Index": food_index
      window: { start: "2024-04" }   # first month with a same-base year-ago level
    # WPI weights, base 2011-12 — sum must equal 100.00
    weights:
      primary: 22.62
      fuel: 13.15
      manufactured: 64.23
    derived:
      headline: weighted index of [primary, fuel, manufactured], then y/y   # cross-checked vs published
    window: { start: "2016-01" }

  cpialrl:
    # regression floor (docs/RELEASE-CHECKLIST.md §2): the minimum period this
    # dossier's live bundles must cover — bump it when a release moves the data
    stale_after: "2026-05"
    family: mospi
    geo: IND
    product: cpialrl
    frequency: monthly
    base: "2019=100"        # current base; old base "1986-87=100" fetched as a
                            # separate bundle — never joined (base-year rule)
    release_calendar: "last working day of the following month"
    revision_policy: "Final on release; never revised."
    source_agency: "Labour Bureau, Ministry of Labour & Employment (via MoSPI eSankhyiki)"
    release_url: https://labourbureau.gov.in
    fetch:
      endpoint: cpialrl/getCpialrlRecords
      # the base_year param is ignored by the API: one records stream carries
      # both bases, distinguished by each row's own base_year field. Old-base
      # rows use agriculture-year labels ("2024-2025" = Jul 2024–Jun 2025);
      # new-base rows use calendar years. New base starts June 2025.
      params:
        indicator_code: 1     # General Index; indicator 2 (Group Index) is
                              # fetched as a second stream in the fetcher —
                              # old base carries group rows state-wise only,
                              # so All-India group bundles exist on base 2019
        state_code: 99        # All India
        limit: 500
      fields: { index_al: al, index_rl: rl }
    derived:
      al: y/y of index_al (old base only — new base has <13 months of levels)
      rl: y/y of index_rl (old base only)

  plfs:
    # regression floor (docs/RELEASE-CHECKLIST.md §2): the minimum period this
    # dossier's live bundles must cover — bump it when a release moves the data
    stale_after: "2026-06"
    # multi-survey compendium: bundles legitimately mix frequencies
    frequency_exempt: true
    family: mospi
    geo: IND
    product: plfs
    frequency: monthly        # primary bundle; a quarterly bundle is also emitted
    base: "survey 2017-18 onward"   # no index base; design breaks are the analogue
    release_calendar: "monthly bulletin ~mid following month; quarterly bulletin thereafter"
    revision_policy: "Final on release. Monthly bulletin (rural+urban, CWS) began Apr 2025; earlier history is the quarterly bulletin (urban, CWS) — separate series, never joined."
    source_agency: "MoSPI, National Statistical Office"
    release_url: https://www.mospi.gov.in
    fetch:
      endpoint: plfs/getData
      indicators:
        "1": lfpr
        "2": wpr
        "3": ur
      dims:                   # 15+, person, All India
        age_code: 1
        gender_code: 3
        state_code: 99
      monthly:
        frequency_code: 3
        sector_code: 3        # rural + urban — from Apr 2025
      quarterly:
        frequency_code: 2
        sector_code: 2        # urban — the longstanding quarterly bulletin
      # NOTE: monthly and quarterly rows carry weekly_status null (CWS by
      # definition in both bulletins); passing weekly_status_code filters
      # everything out — it is deliberately not set.
      # Annual rows carry religion/social_category/education/contract
      # breakdowns alongside "all" rows — the fetcher keeps only "all".
      # A second annual stream without state_code carries every state/UT;
      # curated as plfs-states.json (UR by state, CWS + PS+SS).
      #
      # ANNUAL-REPORT EXTRAS (fetched by buildPlfsExtras, raw in
      # data/raw/plfs-extras.json; agriculture years, never spliced with the
      # bulletins). The product serves eight indicators in total:
      #   4 — percentage distribution of workers (by broad status in
      #       employment, broad industry, NIC section, NCO division,
      #       enterprise size/type, contract) -> plfs-status.json.
      #       Server rejects age/gender/sector params for this indicator;
      #       fetched unfiltered, filtered client-side. Single population
      #       per cell, matching the published 15+ statements.
      #   5 — % of regular wage employees by employment condition (no written
      #       contract / no paid leave / no social security): listed by
      #       getIndicatorList but getData answers HTTP 500 on every
      #       combination tried — NOT fetchable, skipped.
      #   6 — avg wage/salary earnings of regular employees (₹/month)
      #   7 — avg casual labour wage, non-public works (₹/day)
      #   8 — avg gross earnings from self-employment (₹/30 days)
      #       6-8 -> plfs-earnings.json, quarterly grain inside each
      #       agriculture year. The 2017-18 rural+urban cells of 6 and 8 are
      #       quarantined (implied urban weight breaks the structure of every
      #       later year); rural/urban sector cells match the published
      #       report and stay in raw. Calendar-year rows (new design, from
      #       2022) are archived raw only.
      #   3 with education_code 1-9 / age_code 2 -> plfs-education.json
      #       (UR by education level + the 15-29 youth cut, PS+SS).

  rbi:
    family: mospi
    geo: IND
    product: rbi
    frequency: monthly
    base: "as published (US$ Millions; ₹ per US$)"
    release_calendar: "trade ~mid-month; reserves weekly/monthly; reference rates daily"
    revision_policy: "Trade figures are revised (provisional -> final). Vintages are kept."
    source_agency: "Reserve Bank of India (via MoSPI eSankhyiki)"
    release_url: https://rbi.org.in
    fetch:
      endpoint: rbi/getRbiRecords
      # FULL INGEST: every sub-indicator of the RBI product is archived to
      # data/raw/rbi/<code>-<slug>.json. Records are keyed by
      # sub_indicator_code; other dimension params (trade, currency, month)
      # are unreliable — pages are pulled unfiltered and filtered client-side.
      # Trade rows use fiscal-year labels ("2025-26"); reserves and exchange
      # rates use calendar years.
      # The curated monthly bundles below are built from the ingested rows:
      sub_indicators:
        trade: "12"     # India's Foreign Trade – US Dollars (monthly)
        forex: "47"     # Foreign Exchange Reserve Monthly
        usdinr: "36"    # Monthly Average Exchange Rates (EURO, GBP, JPY, USD)
        # further curated bundles built from the full ingest (codes fixed by
        # the API): oil/non-oil trade "42", overall BoP quarterly "4",
        # BoP ratios "22", external debt end-March "25", NRI deposits "40",
        # 4-currency rates "36", forward premia "34", RBI US$ sale/purchase
        # "28", invisibles US$ annual "9", quarterly external debt "27";
