  # ---- end external ----
  # credit (lb/credit): two products whose ruler changed. Sectoral deployment of bank credit
  # changed classification in January 2019 (new codes and sectors; the old format runs on to
  # December 2020 for comparison). The spatial statements changed coverage in March 2023
  # (regional rural banks leave the quarterly statement) and are published in three report
  # generations; the annual statement keeps RRBs. Never joined.
  credit-sibc:
    - base: "SIBC 2007 format"
      from: "2007-04"
      to: "2020-12"
      bundles: [credit-sectors-2007, credit-industry-2007]
    - base: "SIBC 2019 format"
      from: "2019-01"
      to: null
      bundles: [credit-sectors, credit-industry, credit-growth, credit-sectors-ex-merger]
  credit-place:
    - base: "Spatial statements, including regional rural banks"
      from: "2004-03"
      to: "2022-12"
      bundles: [credit-states-2004, credit-states-cd-2004, credit-offices-2004, credit-places-2004, credit-places-states-2004, credit-states-2017, credit-states-cd-2017, credit-offices-2017, credit-places-2017, credit-places-states-2017]
