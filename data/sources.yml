      annual_indicators:
        "1": establishments    # Estimated number of establishments
        "26": workers          # Estimated number of workers (gender × working time)
        "30": emoluments       # Annual emoluments per hired worker + hired-worker counts
        "32": gva_per_worker   # Annual GVA per worker (market establishments)
        "34": gva_per_establishment
      # The informal-firm portrait: per-1000 distributions and rates,
