# Coverage ledger: state profiles (docs/CONTRACT-coverage.md; brief docs/briefs/state-profiles.md).
# Catalogue: scripts/lib/products/profiles.mjs --catalogue. First matching rule decides.
# The profiles bake nothing of their own; every shown item reads another family's bundle.
# Written 2026-10-10 by the profiles session.
family: profiles
guides: []
catalogue: data/coverage/profiles.catalogue.json
rules:
  # MoSPI rounds the brief names as gaps: held until the MoSPI audit refresh finishes
  - match: ["mospi:nss:75", "mospi:nss:76", "mospi:nss:77", "mospi:nss:78", "mospi:nss:79", "mospi:nss:80"]
    status: blocked
    reason: "Waiting for the MoSPI audit (lb/audit-refresh), 2026-10-10: the coordinator holds every new MoSPI download until it finishes; state cuts of these rounds are scheduled after it."
  - match: "mospi:nss:73"
    status: blocked
    reason: "NSS 73 (enterprises, 2015-16): every data call returned HTTP 400 when the inventory probed it, and new MoSPI calls wait for the audit (2026-10-10)."
  - match: "mospi:ec:*"
    status: blocked
    reason: "Waiting for the MoSPI audit (lb/audit-refresh), 2026-10-10: the Economic Census needs one call per state, held until the audit finishes."
