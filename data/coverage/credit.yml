# Coverage ledger: money, bank credit and bank health (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/credit.mjs --catalogue (the DBIE money, banking, BSR-1,
# spatial, NBFC, Statistical Tables and Trend and Progress menus, the Handbook's and Bulletin's
# money and banking tables, the WSS money and bank tables, and the parsed sectoral-credit, CAS
# money and NBFC datasets, itemised by series).
# How each report was decided (2026-10-09): reports read by credit.mjs are shown or baked; every
# other report with rows is baked by credit-deep.mjs, one bundle per table; a report whose rows
# are the same figures as a baked report (100% of a hash sample of its date-value pairs found in
# the other, any unit) is baked through its twin; tables too large for a chart bundle are held
# for the deep-archive tier (coordinator's rule, 2026-10-09), each naming the baked bundles its
# coarser cuts live in; reports with no rows in the mirror are blocked or, for notes, excluded.
# Nothing here is pending.
family: credit
guides:
  - credit
catalogue: data/coverage/credit.catalogue.json
rules:
