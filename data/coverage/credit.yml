      - sibc:sectors:new:*
      - sibc:sectors:section42:*
    status: shown
    bundle: credit-sectors
    plate: "§05 Who borrows: home loans are the largest single kind of bank credit"
  - match: sibc:sectors:old:*
    status: shown
    bundle: credit-sectors-2007
    plate: "§05 Who borrows: since 2007 banks have turned from lending to industry to lending to people"
  - match: sibc:industry:new:*
