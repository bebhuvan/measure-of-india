    status: excluded
    reason: The API repeats Andhra Pradesh debt cells under every state, so none can
      be read as that state; the guide uses the official report tables instead.
  - match: farm-households-nss77-*:withheld:label-conflict:*
    status: excluded
    reason: The API labels these MSP awareness categories differently from the
      official report, so the cells cannot be read reliably.
  - match: farm-households-nss77-*:withheld:over-base:*
    status: excluded
    reason: The published rate exceeds its own per-thousand base, a source
      inconsistency confirmed in the report.
  - match: farm-households-nss77-*:withheld:parenthesised:*
    status: excluded
    reason: The source prints this cell in parentheses, which the report does not
      explain, so it is not read as a figure.
