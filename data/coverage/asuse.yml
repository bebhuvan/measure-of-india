# Coverage ledger: Annual Survey of Unincorporated Sector Enterprises, MoSPI
# (docs/CONTRACT-coverage.md). Catalogue: node scripts/lib/products/asuse.mjs --catalogue.
# Every annual table is baked since wave 2 (2026-10-10): asuse-tNN for the financial-year
# rounds and asuse-2025-tNN for the calendar-year 2025 round, a separate ruler. The curated
# bundles drawn on the page come first; the 2025 tables join each drawn item's bundles.
family: asuse
guides: [factories]
catalogue: data/coverage/asuse.catalogue.json
rules:
  - match: ["asuse:annual:1:*:all", "asuse:annual:1:*:establishment-type:*", "asuse:annual:26:all", "asuse:annual:26:establishment-type:*", "asuse:annual:30:all", "asuse:annual:30:establishment-type:*", "asuse:annual:32:all", "asuse:annual:32:establishment-type:*", "asuse:annual:34:all", "asuse:annual:34:establishment-type:*"]
    status: shown
    bundle: [asuse-annual, asuse-2025-t01, asuse-2025-t26, asuse-2025-t30, asuse-2025-t32, asuse-2025-t34]
    plate: "The other economy, counted at last"
  - match: ["asuse:annual:1:5-*:sector:*", "asuse:annual:1:5-*:activity-category:26-manufacturing-activities", "asuse:annual:1:5-*:activity-category:33-trading-activities", "asuse:annual:1:5-*:activity-category:49-other-services"]
    status: shown
    bundle: [asuse-sectors, asuse-2025-t01]
    plate: "The other economy, counted at last (by activity, rural and urban)"
  - match: ["asuse:annual:2:*:state-ut:*", "asuse:annual:27:state-ut:*", "asuse:annual:33:state-ut:*"]
    status: shown
    bundle: [asuse-states, asuse-2025-t02, asuse-2025-t27, asuse-2025-t33]
    plate: "The other economy, counted at last (by state)"
  - match: ["asuse:annual:3:all", "asuse:annual:3:sector:*", "asuse:annual:3:ownership-type:*", "asuse:annual:10:all", "asuse:annual:10:sector:*", "asuse:annual:10:location-of-establishment:*", "asuse:annual:12:all", "asuse:annual:12:sector:*", "asuse:annual:12:nature-of-operation:*", "asuse:annual:14:all", "asuse:annual:14:sector:*", "asuse:annual:14:no-of-months-operated:*", "asuse:annual:16:all", "asuse:annual:16:sector:*", "asuse:annual:16:no-of-working-hours:*", "asuse:annual:19:all", "asuse:annual:19:sector:*", "asuse:annual:19:npi-status:*"]
    status: shown
    bundle: [asuse-structure, asuse-2025-t03, asuse-2025-t10, asuse-2025-t12, asuse-2025-t14, asuse-2025-t19]
    plate: "The informal firm, described"
  - match: ["asuse:annual:5:all", "asuse:annual:5:sector:*", "asuse:annual:5:general-education-level:*", "asuse:annual:6:all", "asuse:annual:6:sector:*", "asuse:annual:6:social-group-of-owner-major-partner:*"]
    status: shown
    bundle: [asuse-owners, asuse-2025-t05, asuse-2025-t06]
    plate: "The informal firm, described (who owns it)"
  - match: ["asuse:annual:9:all", "asuse:annual:9:sector:*", "asuse:annual:9:account-holder:*", "asuse:annual:20:all", "asuse:annual:20:sector:*", "asuse:annual:20:sub-indicator:*", "asuse:annual:20:establishment-type:*", "asuse:annual:22:all", "asuse:annual:22:sector:*", "asuse:annual:22:sub-indicator:*", "asuse:annual:22:acts-agency-of-registration:*", "asuse:annual:25:all"]
    status: shown
    bundle: [asuse-modernity, asuse-2025-t09, asuse-2025-t20, asuse-2025-t22]
    plate: "The informal firm, described (how modern it is)"
  - match: ["asuse:quarterly:*:all", "asuse:quarterly:*:sector:*", "asuse:quarterly:*:broad-activity-category:*"]
    status: shown
    bundle: asuse-quarterly
    plate: "The other economy, counted at last (the quarterly bulletin)"


  # Every annual table, complete (wave 2, 2026-10-10): each indicator crossed with one cut, in
