# Coverage ledger: Household Consumption Expenditure Survey, MoSPI (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/hces.mjs --catalogue. The source has no combined
# (rural + urban) figure: every bundle carries rural and urban side by side.
# Wave 2 (households, 2026-10-10): every indicator at every cut, both imputation bases, baked;
# nothing pending. Six 2022-23 rural rupee-by-category state cells are misprinted at source
# and left out by rule (named in hces-categories-inr-states' note); the cut itself is baked.
family: hces
guides: [consumption]
catalogue: data/coverage/hces.catalogue.json
rules:
  - match: ["hces:1:*:all", "hces:1:*:sector:*"]
    status: shown
    bundle: hces-mpce
    plate: "The current reading"
  - match: "hces:1:1-without-imputation:state:*"
    status: shown
    bundle: hces-states
    plate: "The map, then the measure of spread"
  - match: ["hces:2:all", "hces:2:sector:*", "hces:2:mpce-fractile-classes:*"]
    status: shown
    bundle: hces-fractiles
    plate: "The ladder"
  - match: ["hces:4:1-without-imputation:all", "hces:4:1-without-imputation:sector:*", "hces:4:1-without-imputation:item-category:*"]
    status: shown
    bundle: hces-categories
    plate: "Engel's law, observed"
  # the food share by state is drawn; every other category by state is baked in the same bundle
  - match: "hces:4:1-without-imputation:state:*"
    status: shown
    bundle: hces-categories-states
    plate: "The map, then the measure of spread (food share by state)"
  - match: ["hces:5:all", "hces:5:sector:*", "hces:5:cereal:*"]
    status: shown
    bundle: hces-quantities
    plate: "What the plate holds"
  - match: ["hces:6:1-without-imputation:all", "hces:6:1-without-imputation:sector:*", "hces:6:1-without-imputation:cereal:*"]
    status: shown
    bundle: hces-item-values
    plate: "What the plate holds"
  - match: ["hces:7:1-without-imputation:all", "hces:7:1-without-imputation:sector:*", "hces:7:1-without-imputation:employment-of-households:*"]
    status: shown
    bundle: hces-household-type
    plate: "Who spends what"
  - match: ["hces:8:1-without-imputation:all", "hces:8:1-without-imputation:sector:*", "hces:8:1-without-imputation:social-group:*"]
    status: shown
    bundle: hces-social
    plate: "Who spends what"
  - match: ["hces:9:*:all", "hces:9:*:sector:*"]
    status: shown
    bundle: hces-gini
    plate: "The map, then the measure of spread"

  # wave 2 (households, 2026-10-10)
  - match: "hces:1:2-with-imputation:state:*"
    status: shown
    bundle: hces-states-imputed
    plate: "Counting free grain and goods raises rural spending by up to 7%"
  - match: "hces:2:state:*"
    status: baked
    bundle: hces-fractiles-states
  - match: "hces:3:1-without-imputation:state:*"
    status: shown
    bundle: hces-categories-inr-states
    plate: "What a person spends, state by state"
  - match: "hces:3:2-with-imputation:state:*"
    status: baked
    bundle: hces-categories-inr-states-imputed
  - match: ["hces:3:*:all", "hces:3:*:sector:*", "hces:3:*:item-category:*"]
    status: baked
    bundle: hces-categories-inr
  - match: ["hces:4:2-with-imputation:all", "hces:4:2-with-imputation:sector:*", "hces:4:2-with-imputation:item-category:*"]
    status: baked
    bundle: hces-categories-imputed
  - match: "hces:4:2-with-imputation:state:*"
    status: baked
    bundle: hces-categories-states-imputed
  - match: "hces:5:state:*"
    status: baked
    bundle: hces-quantities-states
  - match: ["hces:6:2-with-imputation:all", "hces:6:2-with-imputation:sector:*", "hces:6:2-with-imputation:cereal:*"]
    status: baked
    bundle: hces-item-values-states
  - match: "hces:6:*:state:*"
    status: baked
    bundle: hces-item-values-states
  - match: ["hces:7:2-with-imputation:all", "hces:7:2-with-imputation:sector:*", "hces:7:2-with-imputation:employment-of-households:*"]
    status: baked
    bundle: hces-household-type-states
  - match: "hces:7:*:state:*"
    status: baked
    bundle: hces-household-type-states
  - match: ["hces:8:2-with-imputation:all", "hces:8:2-with-imputation:sector:*", "hces:8:2-with-imputation:social-group:*"]
    status: baked
    bundle: hces-social-states
  - match: "hces:8:*:state:*"
    status: baked
    bundle: hces-social-states
  - match: "hces:9:1-without-imputation:state:*"
    status: shown
    bundle: hces-gini-states
    plate: "Spending is more unequal in towns than in villages in 31 of 36 states"
  - match: "hces:9:2-with-imputation:state:*"
    status: baked
    bundle: hces-gini-states
