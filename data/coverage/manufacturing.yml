# Coverage ledger: Manufacturing in the World Bank's WDI (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/worldbank-wdi.mjs --catalogue. The indicators not drawn
# here are baked in the worldbank family's WDI topic bundles. Refreshed by `npm run data`
# (data/sources.yml dossiers.manufacturing, added 2026-10-09).
family: manufacturing
guides: [manufacturing]
catalogue: data/coverage/manufacturing.catalogue.json
rules:
  - match: ["wdi:ind:nv.ind.manf.zs", "wdi:ind:nv.ind.totl.zs", "wdi:ind:nv.ind.manf.kd", "wdi:ind:nv.ind.manf.kd.zg"]
    status: shown
    bundle: wdi-manufacturing
    plate: "Plate 1: the share that never took off; Plate 2: the level that multiplied forty-four-fold; Plate 3: sixty-five years of factory weather"
  - match: ["wdi:ind:nv.mnf.mtrn.zs.un", "wdi:ind:nv.mnf.chem.zs.un", "wdi:ind:nv.mnf.fbto.zs.un", "wdi:ind:nv.mnf.txtl.zs.un", "wdi:ind:nv.mnf.othr.zs.un"]
    status: shown
    bundle: wdi-manufacturing-composition
    plate: "Plate 4: from textiles to machinery"
  - match: "wdi:ind:nv.mnf.tech.zs.un"
    status: shown
    bundle: wdi-manufacturing-tech
    plate: "Plate 6: the slow climb up the technology ladder"
  - match: "wdi:ind:tx.val.manf.zs.un"
    status: shown
    bundle: wdi-manufacturing-exports
    plate: "Plate 5: what the export ledger says"

  # Decided 2026-10-09 by the worldbank family session: the rest of the catalogue is baked in
  # the WDI topic bundles (every WDI indicator for India), downloadable and in the guides'
  # every-cut tables; this guide's plates already draw the share, level and growth.
  - match: ["wdi:ind:nv.ind.manf.cd", "wdi:ind:nv.ind.manf.cn", "wdi:ind:nv.ind.manf.kn", "wdi:ind:nv.ind.totl.cd", "wdi:ind:nv.ind.totl.cn", "wdi:ind:nv.ind.totl.kd", "wdi:ind:nv.ind.totl.kd.zg", "wdi:ind:nv.ind.totl.kn", "wdi:ind:nv.ind.empl.kd"]
    status: baked
    bundle: worldbank-national-accounts
    series: [nv_ind_manf_cd, nv_ind_manf_cn, nv_ind_manf_kn, nv_ind_totl_cd, nv_ind_totl_cn, nv_ind_totl_kd, nv_ind_totl_kd_zg, nv_ind_totl_kn, nv_ind_empl_kd]
  - match: "wdi:ind:tm.val.manf.zs.un"
    status: baked
    bundle: worldbank-trade
    series: [tm_val_manf_zs_un]
