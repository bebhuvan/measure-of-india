# Coverage ledger: All India Survey on Higher Education (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/aishe.mjs --catalogue. Rounds 2017-18 to 2021-22
# sit inside every item. Wave 2 (households, 2026-10-10): every indicator by state and by
# every cut, baked; nothing pending. The 2021-22 "All Teacher defect" excluded in v1.0 was a
# corrupted download (unstable paging), not the source: the rows are now baked.
family: aishe
guides: [aishe]
catalogue: data/coverage/aishe.catalogue.json
rules:
  - match: ["aishe:1:all", "aishe:2:all", "aishe:3:all", "aishe:6:all", "aishe:7:all", "aishe:8:all", "aishe:9:all"]
    status: shown
    bundle: aishe-headline
    plate: "Plate 1: five rounds of growth; Plate 8: the resource ratio"
  - match: ["aishe:3:education-level:*", "aishe:4:all", "aishe:4:social-category:*"]
    status: shown
    bundle: aishe-composition
    plate: "What they study, who they are; Plate 5: what they study, in motion"
  - match: ["aishe:3:gender:*", "aishe:6:gender:*", "aishe:6:social-category:*", "aishe:7:social-category:*"]
    status: shown
    bundle: aishe-access
    plate: "Plate 2: the access gap; Plate 3: parity, in raw rates"
  - match: "aishe:5:social-group:*"
    status: shown
    bundle: aishe-minority
    plate: "Plate 7: who else reaches college"
  - match: "aishe:9:faculty-type:*"
    status: shown
    bundle: aishe-teachers
    plate: "Plate 6: who teaches"
  - match: ["aishe:3:state:*", "aishe:6:state:*", "aishe:7:state:*"]
    status: shown
    bundle: aishe-states
    plate: "Plate 4: where college reaches, where students are"

  # wave 2 (households, 2026-10-10)
  - match: "aishe:2:state:*"
    status: shown
    bundle: aishe-states-institutions
    plate: "Uttar Pradesh alone has nearly a fifth of India's colleges"
  - match: "aishe:1:state:*"
    status: baked
    bundle: aishe-states-institutions
  - match: ["aishe:4:gender:*", "aishe:4:state:*"]
    status: baked
    bundle: aishe-states-social
  - match: ["aishe:5:all", "aishe:5:gender:*", "aishe:5:state:*"]
    status: baked
    bundle: [aishe-minority, aishe-states-minority]
  - match: "aishe:8:state:*"
    status: shown
    bundle: aishe-ptr
    plate: "A college teacher in Bihar has more than four times as many students as one in Tamil Nadu"
  - match: ["aishe:8:institution-type:*", "aishe:8:learning-mode:*"]
    status: baked
    bundle: aishe-ptr
  - match: ["aishe:9:gender:*", "aishe:9:state:*"]
    status: shown
    bundle: aishe-states-teachers
    plate: "Women are now nearly half of college students almost everywhere, but a quarter of the teachers in Bihar"
