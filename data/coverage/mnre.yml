# Coverage ledger: renewable installed capacity, MNRE (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/mnre.mjs --catalogue. Wave 2 (households, 2026-10-10):
# wind, hydro and bio by state, and the bio-power categories, baked and drawn; nothing pending.
# State x category (solar's four, hydro's two, bio's four) is baked beyond what the catalogue
# lists, since the source serves it.
family: mnre
guides: [mnre]
catalogue: data/coverage/mnre.catalogue.json
rules:
  - match: ["mnre:1:all", "mnre:1:category:5-*", "mnre:2:all", "mnre:3:all", "mnre:3:category:*", "mnre:4:all", "mnre:4:category:15-*", "mnre:5:all"]
    status: shown
    bundle: mnre-sources
    plate: "Plate 1: the buildout; Plate 2: the four sources"
  - match: ["mnre:1:category:1-*", "mnre:1:category:2-*", "mnre:1:category:3-*", "mnre:1:category:4-*"]
    status: shown
    bundle: mnre-solar-categories
    plate: "Plate 3: ground vs rooftop"
  - match: "mnre:5:state:*"
    status: shown
    bundle: mnre-states
    plate: "Plate 4: the geography of the buildout"
  - match: "mnre:1:state:*"
    status: shown
    bundle: mnre-states-solar
    plate: "Plate 4: the geography of the buildout (solar)"

  # wave 2 (households, 2026-10-10)
  - match: "mnre:2:state:*"
    status: shown
    bundle: mnre-states-wind
    plate: "Plate 5: each source has its own map"
  - match: "mnre:3:state:*"
    status: shown
    bundle: mnre-states-hydro
    plate: "Plate 5: each source has its own map"
  - match: "mnre:4:state:*"
    status: shown
    bundle: mnre-states-bio
    plate: "Plate 5: each source has its own map"
  - match: "mnre:4:category:*"
    status: shown
    bundle: mnre-bio-categories
    plate: "Plate 6: what bio power burns"
