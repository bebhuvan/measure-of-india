# Coverage ledger: ILOSTAT for India (docs/CONTRACT-coverage.md). First matching rule wins.
# Catalogue: node scripts/lib/products/ilostat.mjs --catalogue (one item per instrument,
# frequency, dataflow and classification versions; ids ilo:<instrument>:<freq>:d<cuts>:<flow>:...).
# Bundles: one per instrument, frequency and indicator family (scripts/lib/products/ilostat.mjs).
family: ilo
guides: [ilo]
catalogue: data/coverage/ilo.catalogue.json
rules:
  # ---- drawn on the guide's plates (see each plate's figure id) ----
  # (shown rules are inserted here)

  # ---- copies of other agencies' numbers: set aside ----
  - match: "ilo:*:*:*:cpi_*"
    status: excluded
    reason: "ILOSTAT's copy of India's consumer price index; MoSPI is its source of record and the consumer prices guide carries it from there, so a copy here would only be a cross-check."
  - match: "ilo:*:*:*:ccf_*"
    status: excluded
    reason: "Exchange rates and PPP conversion factors that ILOSTAT copies from the IMF and the World Bank; they are conversion tools, not labour statistics, and their sources of record publish them directly."
  - match: "ilo:*_cur_*"
    status: excluded
    reason: "Rupee earnings that the ILO has converted into US dollars and PPP dollars at its own exchange rates; the rupee series they are computed from are baked here."

  # ---- quarterly PLFS rates by sex and age, and by sex and area: baked (bundle ilo-plfs-q) ----
  # (their rule comes first so the quarterly exclusion below does not swallow them)
  - match: ["ilo:plfs:q:*:eap_dwap_sex_age_rt", "ilo:plfs:q:*:eap_dwap_sex_age_rt:*", "ilo:plfs:q:*:eap_dwap_sex_geo_rt", "ilo:plfs:q:*:eap_dwap_sex_geo_rt:*", "ilo:plfs:q:*:ear_ehra_sex_nb", "ilo:plfs:q:*:ear_ehra_sex_nb:*", "ilo:plfs:q:*:ear_emta_sex_nb", "ilo:plfs:q:*:ear_emta_sex_nb:*", "ilo:plfs:q:*:eip_dwap_sex_age_rt", "ilo:plfs:q:*:eip_dwap_sex_age_rt:*", "ilo:plfs:q:*:eip_neet_sex_nb", "ilo:plfs:q:*:eip_neet_sex_nb:*", "ilo:plfs:q:*:eip_neet_sex_rt", "ilo:plfs:q:*:eip_neet_sex_rt:*", "ilo:plfs:q:*:emp_dwap_sex_age_rt", "ilo:plfs:q:*:emp_dwap_sex_age_rt:*", "ilo:plfs:q:*:emp_dwap_sex_geo_rt", "ilo:plfs:q:*:emp_dwap_sex_geo_rt:*", "ilo:plfs:q:*:emp_nifl_sex_nb", "ilo:plfs:q:*:emp_nifl_sex_nb:*", "ilo:plfs:q:*:emp_nifl_sex_rt", "ilo:plfs:q:*:emp_nifl_sex_rt:*", "ilo:plfs:q:*:emp_pifl_sex_nb", "ilo:plfs:q:*:emp_pifl_sex_nb:*", "ilo:plfs:q:*:emp_pifl_sex_rt", "ilo:plfs:q:*:emp_pifl_sex_rt:*", "ilo:plfs:q:*:how_temp_sex_nb", "ilo:plfs:q:*:how_temp_sex_nb:*", "ilo:plfs:q:*:how_xees_sex_nb", "ilo:plfs:q:*:how_xees_sex_nb:*", "ilo:plfs:q:*:une_deap_sex_age_rt", "ilo:plfs:q:*:une_deap_sex_age_rt:*", "ilo:plfs:q:*:une_deap_sex_geo_rt", "ilo:plfs:q:*:une_deap_sex_geo_rt:*"]
    status: baked
    bundle: ilo-plfs-q

  # ---- survey cubes held back (an owner decision, docs/status/ilo.md) ----
  - match: ["ilo:plfs:a:d3:*", "ilo:nss:a:d3:*"]
    status: excluded
    reason: "Three-way cubes (sex by two further classifications) that the ILO computed from PLFS and NSS unit data, about 951,000 Indian cells of which roughly one in six carries the ILO's own unreliable flag; they stay at ILOSTAT, linked from the guide, while every table by sex and one classification is baked."
  - match: ["ilo:plfs:q:d2:*", "ilo:plfs:q:d3:*"]
    status: excluded
    reason: "Quarterly PLFS tables finer than sex, or sex by age or area, that the ILO computed from one quarter's share of the survey sample, about 1.35 million Indian cells of which one in seven carries the ILO's unreliable flag; the same tables are baked on calendar years, and the quarters stay at ILOSTAT."

