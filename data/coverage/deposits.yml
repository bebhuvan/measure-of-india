# Coverage ledger: bank deposits, RBI BSR-2 (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/bsr2.mjs --catalogue. Reports the adapter reads row by
# row (737, 847, 864-866) are itemised; every other BSR-2 report is one item. Wave 2
# (households, 2026-10-10): every report the Data Bank's DBIE mirror holds is decoded and baked
# (bsr2-tables.mjs: column meanings proved by identities on every row); district-sized tables go
# to the deep archive; the publication volumes and one quarterly table the mirror does not hold
# are blocked. Nothing pending.
family: deposits
guides: [deposits]
catalogue: data/coverage/deposits.catalogue.json
rules:
  - match: ["bsr2:737:71:*", "bsr2:737:72:*", "bsr2:737:73:*"]
    status: shown
    bundle: deposits-owners
    plate: "The current reading; Savings accounts and fixed deposits"
  - match: ["bsr2:737:37:*", "bsr2:737:53:*"]
    status: shown
    bundle: deposits-owners-2005
    plate: "Savings accounts and fixed deposits (the old classification, to 2018)"
  - match: ["bsr2:847:4-household-sector:*", "bsr2:847:4.1.1-of-which-female:*", "bsr2:847:all-india:*"]
    status: shown
    bundle: deposits-population
    plate: "Where, and whose"
  - match: ["bsr2:865:*:individuals:amount", "bsr2:865:*:total:amount", "bsr2:865:total:individuals:accounts", "bsr2:865:total:total:accounts"]
    status: shown
    bundle: deposits-term-rates
    plate: "At what interest rate"
  - match: ["bsr2:864:*:individuals:amount", "bsr2:864:*:total:amount", "bsr2:864:grand-total:individuals:accounts", "bsr2:864:grand-total:total:accounts"]
    status: shown
    bundle: deposits-term-maturity
    plate: "For how long, and in what size"
  # the size bands were redrawn in 2026: the latest year's fine bands are drawn, the coarse
  # bands that run through every year are baked
  - match: ["bsr2:866:*:individuals:amount", "bsr2:866:*:total:amount"]
    status: shown
    bundle: [deposits-term-size-2026, deposits-term-size]
    plate: "For how long, and in what size"

  # wave 2 (households, 2026-10-10)
  - match: ["bsr2:737:54:*", "bsr2:737:55:*", "bsr2:737:56:*", "bsr2:737:57:*", "bsr2:737:58:*", "bsr2:737:59:*", "bsr2:737:60:*", "bsr2:737:61:*", "bsr2:737:62:*", "bsr2:737:63:*", "bsr2:737:64:*", "bsr2:737:65:*", "bsr2:737:66:*", "bsr2:737:67:*", "bsr2:737:68:*", "bsr2:737:69:*", "bsr2:737:70:*", "bsr2:737:74:*", "bsr2:737:75:*", "bsr2:737:76:*", "bsr2:737:77:*", "bsr2:737:78:*", "bsr2:737:79:*", "bsr2:737:80:*", "bsr2:737:81:*", "bsr2:737:82:*", "bsr2:737:83:*", "bsr2:737:84:*", "bsr2:737:85:*"]
    status: shown
    bundle: deposits-sectors
    plate: "Who else keeps money in banks"
  - match: ["bsr2:737:1:*", "bsr2:737:2:*", "bsr2:737:3:*", "bsr2:737:4:*", "bsr2:737:5:*", "bsr2:737:6:*", "bsr2:737:7:*", "bsr2:737:8:*", "bsr2:737:9:*", "bsr2:737:10:*", "bsr2:737:11:*", "bsr2:737:12:*", "bsr2:737:13:*", "bsr2:737:14:*", "bsr2:737:15:*", "bsr2:737:16:*", "bsr2:737:17:*", "bsr2:737:18:*", "bsr2:737:19:*", "bsr2:737:20:*", "bsr2:737:21:*", "bsr2:737:22:*", "bsr2:737:23:*", "bsr2:737:24:*", "bsr2:737:25:*", "bsr2:737:26:*", "bsr2:737:27:*", "bsr2:737:28:*", "bsr2:737:29:*", "bsr2:737:30:*", "bsr2:737:31:*", "bsr2:737:32:*", "bsr2:737:33:*", "bsr2:737:34:*", "bsr2:737:35:*", "bsr2:737:36:*", "bsr2:737:38:*", "bsr2:737:39:*", "bsr2:737:40:*", "bsr2:737:41:*", "bsr2:737:42:*", "bsr2:737:43:*", "bsr2:737:44:*", "bsr2:737:45:*", "bsr2:737:46:*", "bsr2:737:47:*", "bsr2:737:48:*", "bsr2:737:49:*", "bsr2:737:50:*", "bsr2:737:51:*", "bsr2:737:52:*"]
    status: baked
    bundle: deposits-sectors-2005
  - match: "bsr2:847:*"
    status: baked
    bundle: deposits-population
  - match: "bsr2:864:*"
    status: baked
    bundle: deposits-term-maturity
  - match: "bsr2:865:*"
    status: baked
    bundle: deposits-term-rates
  - match: "bsr2:866:*"
    status: baked
    bundle: [deposits-term-size, deposits-term-size-2026]
  # annual tables, read whole
  - match: "bsr2:1200"
    status: shown
    bundle: deposits-sectors
    plate: "Who else keeps money in banks"
  - match: "bsr2:850"
    status: shown
    bundle: deposits-bankgroups-sectors
    plate: "Which banks, and who works in them"
  - match: "bsr2:853"
    status: shown
    bundle: deposits-states-type
    plate: "Where the money sits (states)"
  - match: "bsr2:856"
    status: shown
    bundle: deposits-states-owners
    plate: "How old the savers are (women by state)"
  - match: "bsr2:857"
    status: shown
    bundle: deposits-districts
    plate: "Where the money sits (districts)"
  - match: "bsr2:861"
    status: shown
    bundle: deposits-maturity-owners
    plate: "Booked for how long"
  - match: "bsr2:870"
    status: shown
    bundle: deposits-employees-bankgroups
    plate: "Which banks, and who works in them (staff)"
  - match: "bsr2:1260"
    status: shown
    bundle: deposits-age
    plate: "How old the savers are"
  - match: "bsr2:848"
    status: baked
    bundle: deposits-states-sectors
  - match: "bsr2:849"
    status: baked
    bundle: deposits-metros-sectors
  - match: "bsr2:851"
    status: baked
    bundle: deposits-population-type
  - match: "bsr2:852"
    status: baked
    bundle: deposits-bankgroups-type
  - match: "bsr2:854"
    status: baked
    bundle: deposits-population-owners
  - match: "bsr2:855"
    status: baked
    bundle: deposits-bankgroups-owners
  - match: "bsr2:858"
    status: baked
    bundle: deposits-states-population-type
  - match: "bsr2:859"
    status: baked
    bundle: deposits-states-bankgroups-type
  - match: "bsr2:860"
    status: baked
    bundle: deposits-bankgroups-population-type
  - match: "bsr2:862"
    status: baked
    bundle: deposits-maturity-population
  - match: "bsr2:863"
    status: baked
    bundle: deposits-maturity-bankgroups
  - match: "bsr2:867"
    status: baked
    bundle: deposits-maturity-population-owners
  - match: "bsr2:868"
    status: baked
    bundle: deposits-maturity-states
  - match: "bsr2:869"
    status: baked
    bundle: deposits-employees-states
  # table 2.12, district x gender: all-deposit accounts and amount baked; the split by type of account is in the deep archive
  - match: "bsr2:1554"
    status: baked
    bundle: deposits-districts-gender
  - match: "bsr2:1199"
    status: excluded
    archive: true
    rolls_up_to: [deposits-states-2010]
    reason: "Published by RBI at district x population group x bank group for 2009-10 to 2017-18 (53,236 rows, old bank groups); held for the deep-archive tier, and its state, population-group and bank-group totals are baked as sums of the district rows."
  # the quarterly BSR-2 (from March 2023; excludes regional rural banks): its own instrument
  - match: "bsr2:1302"
    status: shown
    bundle: deposits-q-sectors
    plate: "The quarterly return"
  - match: "bsr2:1304"
    status: baked
    bundle: deposits-q-states-sectors
  - match: "bsr2:1305"
    status: baked
    bundle: deposits-q-metros-sectors
