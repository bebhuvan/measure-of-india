    status: baked
    bundle: deposits-q-bankgroups-population-type
  - match: "bsr2:1317"
    status: baked
    bundle: deposits-q-maturity-owners
  - match: "bsr2:1318"
    status: baked
    bundle: deposits-q-maturity-population
  - match: "bsr2:1319"
    status: baked
    bundle: deposits-q-maturity-bankgroups
  - match: "bsr2:1320"
    status: baked
    bundle: deposits-q-term-maturity
  - match: "bsr2:1321"
    status: baked
    bundle: deposits-q-term-rates
  - match: "bsr2:1322"
    status: baked
    bundle: deposits-q-term-size
  - match: "bsr2:1323"
    status: baked
    bundle: deposits-q-maturity-population-owners
  - match: "bsr2:1324"
    status: baked
    bundle: deposits-q-maturity-states
  - match: "bsr2:1325"
    status: baked
    bundle: deposits-q-employees-states
  - match: "bsr2:1326"
    status: baked
    bundle: deposits-q-employees-bankgroups
  - match: "bsr2:1346"
    status: baked
    bundle: deposits-q-age
  - match: "bsr2:1313"
    status: excluded
    archive: true
    rolls_up_to: [deposits-q-states-type]
    reason: "Published by RBI quarterly at district x population group (26,570 rows); held for the deep-archive tier, and the state totals are baked."
  - match: "bsr2:1556"
    status: excluded
    archive: true
    rolls_up_to: [deposits-q-states-owners]
    reason: "Published by RBI quarterly at district x gender x type of deposit (21,764 rows); held for the deep-archive tier, and the state totals of individuals and women are baked."
  - match: ["bsr2:1261", "bsr2:1327"]
    status: excluded
    reason: "RBI's notes on the tables are text, not statistics; the definitions they give are summarised in the guide's method notes."
  - match: "bsr2:1303"
    status: blocked
    reason: "Quarterly table 1.2 (ownership by population group) has no rows in the Data Bank's DBIE mirror on 2026-10-10; the annual table 1.2 (report 847) is baked. Asked of the Data Bank via the coordinator."
  - match: ["bsr2:126*", "bsr2:127*", "bsr2:128*", "bsr2:1290", "bsr2:1291", "bsr2:133*", "bsr2:134*", "bsr2:1329"]
    status: blocked
    reason: "The BSR publication volumes (Vol 1 to 47) have no rows in the Data Bank's DBIE mirror on 2026-10-10 (DBIE serves them as PDF documents); the tables they print are read one by one from their own reports above."
