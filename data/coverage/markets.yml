# Coverage ledger: savings, markets and companies (lb/markets). Catalogue generated by
# scripts/lib/products/markets-catalogue.mjs from the Data Bank's DBIE inventory and rows and the
# RBI Innovation Hub's catalogue. First matching rule wins.
family: markets
guides: [markets]
catalogue: data/coverage/markets.catalogue.json
rules:
  # ---------------- household financial saving ----------------
  - match: "dbie:1225:*"
    status: shown
    bundle: [markets-hh-flows, markets-hh-flows-annual]
    plate: "§04 Where household savings go"
  - match: "dbie:1226:*"
    status: shown
    bundle: markets-hh-stocks
    plate: "§06 What households own and owe"
  - match: "dbie:246:*"
    status: shown
    bundle: markets-hh-annual
    plate: "§05 Fifty years of household saving"
  - match: "dbie:508:report"
    status: excluded
    reason: "The same table of household financial assets and liabilities as DBIE report 246, printed under the National Income menu; report 246 is read."
  # ---------------- mutual funds ----------------
  - match: "dbie:126:*"
    status: shown
    bundle: markets-mf-aum
    plate: "§07 Mutual funds' assets"
  - match: "dbie:1360:*"
    status: shown
    bundle: markets-mf-sponsor
    plate: "§07 Net inflows by sponsor"
  - match: "dbie:1361:*"
    status: shown
    bundle: markets-mf-houses
    plate: "§07 Net inflows by fund house"
  - match: "dbie:1359:*"
    status: baked
    bundle: markets-mf-bank-fi
  - match: ["dbie:382:report", "dbie:283:report", "dbie:289:report", "dbie:527:report"]
    status: excluded
    reason: "The same mutual fund tables as DBIE reports 126, 1361, 1359 and 1360 under another menu (Financial Institutions or the Handbook); those are read."
  - match: ["dbie:695:report", "dbie:696:report"]
    status: excluded
    reason: "Mutual funds' and asset managers' foreign assets and liabilities are part of India's international investment position and are read by the external account guide."
  # ---------------- gold and silver ----------------
  - match: "dbie:17:*"
    status: shown
    bundle: markets-gold
    plate: "§08 Gold and silver"
  - match: "dbie:108:*"
    status: baked
    bundle: markets-gold-annual
  - match: ["dbie:197:*", "dbie:519:report", "dbie:674:report"]
    status: excluded
    reason: "The same gold and silver price tables as DBIE reports 17 (monthly) and 108 (annual) under the Handbook and Prices menus; those are read."
  # ---------------- new capital issues ----------------
  - match: ["dbie:1355:sk61:*", "dbie:1355:sk62:*", "dbie:1355:sk63:*", "dbie:1355:sk64:*"]
    status: excluded
    reason: "Lines the RBI prints as zero in every month from April 2011 to December 2022, including months with issues: a placeholder in the table's layout, not data."
  - match: ["dbie:1355:sk5:*", "dbie:1355:sk6:*", "dbie:1355:sk53:*", "dbie:1355:sk54:*", "dbie:1355:sk55:*", "dbie:1355:sk56:*", "dbie:1355:sk57:*", "dbie:1355:sk58:*", "dbie:1355:sk59:*", "dbie:1355:sk60:*"]
    status: shown
    bundle: markets-issues
    plate: "§09 New capital issues (the latest month)"
  - match: "dbie:1355:*"
    status: baked
    bundle: markets-issues-detail
  - match: "dbie:277:*"
    status: shown
    bundle: [markets-issues-annual, markets-issues-annual-cy]
    plate: "§09 New capital issues, fiscal years"
  - match: ["dbie:52:report", "dbie:261:report", "dbie:899:report"]
    status: excluded
    reason: "The same new capital issues tables as DBIE reports 1355 (monthly) and 277 (annual) in the Bulletin and Handbook menus; those are read."
  - match: "dbie:1356:*"
    status: baked
    bundle: markets-euro-issues
  # ---------------- commercial paper and certificates of deposit (the rates family reads them) ----------------
  - match: "dbie:5:report"
    status: shown
    bundle: rates-cp
    plate: "§09 Commercial paper and certificates of deposit (the rates guide's bundle, read only)"
  - match: "dbie:4:report"
    status: shown
    bundle: rates-cd
    plate: "§09 Commercial paper and certificates of deposit (the rates guide's bundle, read only)"
  - match: ["dbie:31:report", "dbie:32:report", "dbie:93:report", "dbie:94:report", "dbie:566:report", "dbie:1395:report"]
    status: excluded
    reason: "The same commercial paper and certificates of deposit tables as DBIE reports 5 and 4 (fortnightly, read by the interest rates family) under other menus."
  # ---------------- the stock market ----------------
  - match: ["dbie:1350:*", "dbie:1351:*"]
    status: shown
    bundle: markets-mcap
    plate: "§10 Market capitalisation"
  - match: ["dbie:990:*", "dbie:1352:*"]
    status: shown
    bundle: [markets-turnover, markets-turnover-annual]
    plate: "§10 Cash-market turnover against index options"
  - match: "dbie:1357:*"
    status: shown
    bundle: markets-derivatives
    plate: "§10 Cash-market turnover against index options"
  - match: ["dbie:658:*", "dbie:680:*"]
    status: baked
    bundle: markets-exchanges-daily
  - match: ["dbie:693:report", "dbie:728:report", "dbie:726:report", "dbie:802:report", "dbie:898:report", "dbie:1353:report", "dbie:477:report", "dbie:478:report", "dbie:1358:report"]
    status: excluded
    reason: "Stock index levels and ratios built on them (Sensex, Nifty, BSE 100, foreign indices) are the exchanges' and index providers' licensed products, reproduced by the RBI; the licence is not ours to republish."
  - match: "dbie:1354:report"
    status: excluded
    reason: "Net investment by foreign portfolio investors belongs to the external account and is read there (external-fpi)."
  # ---------------- expectation surveys ----------------
  - match: ["dbie:271:report", "dbie:272:report", "dbie:1478:report"]
    status: blocked
    reason: "DBIE serves the household inflation expectations and consumer confidence surveys only behind an input prompt: the Data Bank's client skipped them (skipped_prompt, 2026-10-08) and the RBI Innovation Hub's catalogue holds no copy (checked 2026-10-10)."
  - match: "dbie:273:report"
    status: excluded
    reason: "Unit-level survey records (2010 to 2014) that carry respondents' names, addresses and telephone numbers: personal data, not for republication; the RBI's published aggregates are not served by either source."
  - match: "dbie:1473:report"
    status: blocked
    reason: "Individual forecasters' responses sit behind DBIE's input prompt (skipped_prompt in the Data Bank, 2026-10-08) and are not in the RBI Innovation Hub's catalogue (checked 2026-10-10)."
  - match: ["dbie:1475:report", "dbie:1476:report"]
    status: excluded
    reason: "Prompt-gated in the Data Bank; the same reports are read from the RBI Innovation Hub's service (the hub:spf items)."
  - match: ["dbie:1474:report", "dbie:1477:report", "hub:spf:1477"]
    status: excluded
    reason: "Metadata documents describing the survey, not data; the Hub's export of 1477 is empty."
  - match: "hub:spf:1476"
    status: blocked
    reason: "The service's export of the SPF time-series report holds the headers and disclaimer but no rows (checked 2026-10-10); the same forecasts are read round by round from report 1475."
  - match: ["hub:spf:1475:round-slot:64", "hub:spf:1475:round-slot:71", "hub:spf:1475:round-slot:75", "hub:spf:1475:round-slot:78", "hub:spf:1475:round-slot:84", "hub:spf:1475:round-slot:86", "hub:spf:1475:round-slot:94", "hub:spf:1475:round-slot:100"]
    status: blocked
    reason: "The service's export repeats round 101's tables in this round's slot (its own round number says 101; checked 2026-10-10), so the round is missing and left empty."
  - match: "hub:spf:1475:round-slot:*"
    status: shown
    bundle: [markets-spf, markets-spf-2019]
    plate: "§13 What forecasters expect"
  - match: "hub:spf:1475:main-tables"
    status: excluded
    reason: "The main tables print the medians of the annexes, which are read; the adapter checks the real GDP medians agree."
  - match: ["hub:spf:1475:annex-i:gdp-at-constant*"]
    status: shown
    bundle: [markets-spf, markets-spf-2019]
    plate: "§13 What forecasters expect"
  - match: "hub:spf:1475:annex-i:*"
    status: baked
    bundle: [markets-spf, markets-spf-2019]
  - match: "hub:spf:1475:annex-ii:*"
    status: baked
    bundle: [markets-spf-quarterly, markets-spf-quarterly-2019]
  - match: "hub:spf:1475:annex-iii:*"
    status: baked
    bundle: [markets-spf-inflation, markets-spf-inflation-2019]
  # ---------------- SDMX datasets the Data Bank also holds ----------------
  - match: ["hub:sdmx:bal-sht-*", "hub:sdmx:ci-*", "hub:sdmx:ear-exp-*", "hub:sdmx:fin-ratios-*", "hub:sdmx:grwt-rt-*", "hub:sdmx:gwt-rt-*", "hub:sdmx:ind-cntry-fdi-rn", "hub:sdmx:pnl-*", "hub:sdmx:src-fnd-*", "hub:sdmx:use-fbd-*", "hub:sdmx:uses-fnd-*"]
    status: excluded
    reason: "The same company-study statements as DBIE reports 731 to 754 and 1146 to 1208, served again as SDMX; the Data Bank's validated copies of the reports are read (the Data Bank is the record wherever it holds a report)."
  - match: ["hub:sdmx:avg-nfty-rn", "hub:sdmx:bse-ind-d-rn", "hub:sdmx:nse-ind-d-rn", "hub:sdmx:bk-val-rat-bse-rn", "hub:sdmx:earn-rat-bse-rn"]
    status: excluded
    reason: "Stock index levels and the Sensex's valuation ratios are the exchanges' licensed index products; the licence is not ours to republish."
  - match: ["hub:sdmx:mrkt-info-bse-d-rn", "hub:sdmx:mrkt-info-nse-d-rn", "hub:sdmx:trn-ovr-bse-rn", "hub:sdmx:turno-nse-rn"]
    status: excluded
    reason: "The same daily and monthly market capitalisation and turnover as DBIE reports 658, 680, 990 and 1352, read from the Data Bank."
  # ---------------- company studies and listed companies (rules generated from the adapters' tables) ----------------
  - match: "cfd:1075:*"
    status: baked
    bundle: markets-co-listed-halfyear
  - match: "cfd:1173:latest:*"   # Public limited companies, growth rates
    status: shown
    plate: "§12 Sales of public, private and foreign-owned companies"
