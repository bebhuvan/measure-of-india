# Coverage ledger: public finance, what the Centre and the states earn, spend, borrow and owe
# (docs/CONTRACT-coverage.md). The catalogue (data/coverage/public-finance.catalogue.json) is
# generated by `node scripts/lib/products/public-finance.mjs --catalogue`: every report in DBIE's
# four government-finance menus, every report elsewhere in DBIE with the same name, the Bulletin
# and debt tables the guide reads, and DBIE's CAS government-finance series. Rules are read top
# to bottom; the first match decides. Where the RBI prints one table under several menus, the copy
# this guide reads is marked and the others are excluded as the same table.
family: public-finance
guides: [public-finance]
catalogue: data/coverage/public-finance.catalogue.json
rules:
  # ================= the Centre, annual (Handbook) =================
  - match: ["dbie:713:dp0:gross-fiscal-deficit", "dbie:713:dp0:revenue-deficit", "dbie:713:dp0:gross-primary-deficit"]
    status: shown
    bundle: [public-finance-centre-deficits, public-finance-ratios-backcast]
    plate: "§04 Fifty-six years of the Centre's deficit"
  - match: ["dbie:713:*"]
    status: baked
    bundle: public-finance-centre-deficits
  # the table's own items; DBIE's query also returns 1970-71 to 1973-74 values of other tables' items
  - match: ["dbie:655:dp0:10:*", "dbie:655:dp0:11:*", "dbie:655:dp0:12:*", "dbie:655:dp0:13:*", "dbie:655:dp0:14:*", "dbie:655:dp0:150:*", "dbie:655:dp0:8:*", "dbie:655:dp0:15:*"]
    status: shown
    bundle: public-finance-centre-receipts
    plate: "§05 Where the Centre's tax money comes from"
  - match: ["dbie:655:dp0:9:*", "dbie:655:dp0:16:*", "dbie:655:dp0:17:*", "dbie:655:dp0:18:*", "dbie:655:dp0:19:*"]
    status: baked
    bundle: public-finance-centre-receipts
  - match: ["dbie:655:*"]
    status: excluded
    reason: "DBIE returns four early years (1970-71 to 1973-74) of other tables' items alongside this one; those items are read in full from their own tables (713, 353, 351 and 350)."
  - match: ["dbie:353:*"]
    status: shown
    bundle: public-finance-centre-expenditure
    plate: "§06 Every hundred rupees the Centre spends"
  - match: ["dbie:351:*"]
    status: baked
    bundle: public-finance-centre-capital-receipts
  - match: ["dbie:352:*"]
    status: baked
    bundle: public-finance-centre-development
  - match: ["dbie:656:*"]
    status: shown
    bundle: public-finance-centre-financing
    plate: "§04 How the deficit is paid for"
  - match: ["dbie:1399:dp0:total-liabilities-9-10"]
    status: shown
    bundle: [public-finance-centre-liabilities, public-finance-ratios-backcast, public-finance-ratios-2022]
    plate: "§07 What India's governments owe"
  - match: ["dbie:1399:*"]
    status: baked
    bundle: public-finance-centre-liabilities
  - match: ["dbie:355:dp0:gross-fiscal-deficit"]
    status: shown
    bundle: [public-finance-centre-gdp-b1999, public-finance-centre-gdp-b2004, public-finance-centre-gdp-b2011]
    plate: "§09 The same deficit against three GDP series"
  - match: ["dbie:355:dp0:gross-direct-tax", "dbie:355:dp0:gross-indirect-tax", "dbie:355:dp0:total-gross-tax"]
    status: shown
    bundle: [public-finance-centre-gdp-b1999, public-finance-centre-gdp-b2004, public-finance-centre-gdp-b2011]
    plate: "§05 Taxes as a share of the economy"
  - match: ["dbie:355:dp0:capital-expenditure", "dbie:355:dp0:interest-payments"]
    status: shown
    bundle: [public-finance-centre-gdp-b1999, public-finance-centre-gdp-b2004, public-finance-centre-gdp-b2011]
    plate: "§06 Interest against investment"
  - match: ["dbie:355:*"]
    status: baked
    bundle: [public-finance-centre-gdp-b1999, public-finance-centre-gdp-b2004, public-finance-centre-gdp-b2011]
  # the same per-cent-of-GDP table through DBIE's CAS service: checked equal to report 355, value for value
  - match: ["cas:ficg-gdp-rn:*"]
    status: baked
    bundle: [public-finance-centre-gdp-b1999, public-finance-centre-gdp-b2004, public-finance-centre-gdp-b2011]
  - match: ["dbie:350:*"]
    status: baked
    bundle: public-finance-centre-capital-formation
  - match: ["dbie:748:*"]
    status: baked
    bundle: public-finance-plan-outlay
  - match: ["dbie:608:*"]
    status: baked
    bundle: public-finance-plan-financing
  # ================= the Centre, monthly =================
  - match: ["dbie:49:*"]
    status: shown
    bundle: [public-finance-centre-monthly, public-finance-centre-budget-path, public-finance-centre-monthly-incl-borrowing]
    plate: "§04 This year so far, against the budget"
  - match: ["dbie:349:*", "cas:cg-defm-rn:*"]
    status: baked
    bundle: public-finance-centre-gfd-monthly
  # ================= the states =================
  - match: ["dbie:451:dp0:gross-fiscal-deficit", "dbie:451:dp0:revenue-deficit"]
    status: shown
    bundle: [public-finance-allstates-deficits, public-finance-ratios-backcast]
    plate: "§04 Fifty-six years of the Centre's deficit"
  - match: ["dbie:451:*"]
    status: baked
    bundle: public-finance-allstates-deficits
  - match: ["dbie:709:dp0:*"]
    status: shown
    bundle: public-finance-allstates-receipts
    plate: "§08 Where the states' money comes from"
  - match: ["dbie:709:dp1", "dbie:709:dp2"]
    status: excluded
    reason: "Two helper providers of the same table: one holds only the table's latest date, the other unlabelled amounts with no item name, which cannot be told apart; the labelled table is read in full."
  - match: ["dbie:677:dp0:interest-payments", "dbie:677:dp0:pension-and-misc.-general-services", "dbie:677:dp0:social-services", "dbie:677:dp0:economic-services", "dbie:677:dp0:capital-outlay", "dbie:677:dp0:total-expenditure-2-3"]
    status: shown
    bundle: public-finance-allstates-expenditure
    plate: "§08 Where the states' money goes"
  - match: ["dbie:677:*"]
    status: baked
    bundle: public-finance-allstates-expenditure
  - match: ["dbie:453:*"]
    status: baked
    bundle: public-finance-allstates-capital-receipts
  - match: ["dbie:692:*"]
    status: baked
    bundle: public-finance-allstates-financing
  - match: ["dbie:452:dp0:total-liabilities-of-the-states"]
    status: shown
    bundle: [public-finance-allstates-liabilities, public-finance-ratios-backcast, public-finance-ratios-2022]
    plate: "§07 What India's governments owe"
  - match: ["dbie:452:*"]
    status: baked
    bundle: public-finance-allstates-liabilities
  - match: ["dbie:454:dp1:gross-fiscal-deficit"]
    status: shown
    bundle: [public-finance-allstates-gdp-b1999, public-finance-allstates-gdp-b2004, public-finance-allstates-gdp-b2011]
    plate: "§04 Fifty-six years of the Centre's deficit"
  - match: ["dbie:454:*", "cas:fisg-gdp-rn:*"]
    status: baked
    bundle: [public-finance-allstates-gdp-b1999, public-finance-allstates-gdp-b2004, public-finance-allstates-gdp-b2011]
  - match: ["dbie:63:*"]
    status: shown
    bundle: public-finance-states-wma
    plate: "§08 States that ran short of cash"
  - match: ["dbie:37:*"]
    status: baked
    bundle: public-finance-states-investments
  # ================= the Centre and the states together =================
  - match: ["dbie:347:dp0:gross-fiscal-deficit"]
    status: shown
    bundle: [public-finance-combined-gdp-b1999, public-finance-combined-gdp-b2004, public-finance-combined-gdp-b2011]
    plate: "§04 Fifty-six years of the Centre's deficit"
  - match: ["dbie:347:*"]
    status: baked
    bundle: [public-finance-combined-gdp-b1999, public-finance-combined-gdp-b2004, public-finance-combined-gdp-b2011]
  - match: ["dbie:346:*"]
    status: baked
    bundle: [public-finance-combined-deficits, public-finance-ratios-backcast]
  - match: ["dbie:339:dp0:combined-total-liabilities-of-centre-states-3-6"]
    status: shown
    bundle: [public-finance-combined-liabilities, public-finance-ratios-backcast, public-finance-ratios-2022]
    plate: "§07 What India's governments owe"
  - match: ["dbie:339:*"]
    status: baked
    bundle: public-finance-combined-liabilities
  - match: ["dbie:342:dp0:combined-total-liabilities-of-centre-states", "dbie:342:dp0:total-liabilities-of-the-centre-2-3", "dbie:342:dp0:total-liabilities-of-the-states"]
    status: shown
    bundle: [public-finance-combined-debt-gdp-b1999, public-finance-combined-debt-gdp-b2004, public-finance-combined-debt-gdp-b2011]
    plate: "§07 What India's governments owe"
  - match: ["dbie:342:*"]
    status: baked
    bundle: [public-finance-combined-debt-gdp-b1999, public-finance-combined-debt-gdp-b2004, public-finance-combined-debt-gdp-b2011]
  - match: ["dbie:340:*"]
    status: baked
    bundle: public-finance-combined-development
  - match: ["dbie:673:*"]
    status: shown
    bundle: public-finance-combined-taxes
    plate: "§05 Who collects India's taxes"
  - match: ["dbie:721:dp0:central-and-states-*"]
    status: baked
    bundle: public-finance-combined-accounts
  - match: ["dbie:721:dp0:central-*", "dbie:721:dp0:cg.*"]
    status: excluded
    reason: "This combined table repeats the Centre's own figures one stage older (the 2024-25 revised estimate where the Centre's tables already carry the year's accounts); the Centre's own tables are read instead."
  - match: ["dbie:721:dp1"]
    status: excluded
    reason: "A layout helper of the table: row labels and display order with no figures."
  - match: ["dbie:36:dp0:*-as-per-cent-of-gdp"]
    status: baked
    bundle: [public-finance-combined-bulletin-gdp-b2011]
  - match: ["dbie:36:*"]
    status: baked
    bundle: public-finance-combined-bulletin
  # ================= debt: who holds it, how short, how long =================
  - match: ["dbie:1369:dp0:*"]
    status: shown
    bundle: public-finance-ownership-gsec
    plate: "§07 Who lends to the government"
  - match: ["dbie:1369:dp1:*"]
    status: baked
    bundle: public-finance-ownership-sdl
  - match: ["dbie:1369:dp2:*"]
    status: baked
    bundle: public-finance-ownership-tbills
  - match: ["dbie:1371:dp2:0:*"]
    status: baked
    bundle: public-finance-ownership-annual-gsec-old
  - match: ["dbie:1371:dp2:1:*"]
    status: baked
    bundle: public-finance-ownership-annual-gsec
  - match: ["dbie:1371:dp1:0:*"]
    status: baked
    bundle: public-finance-ownership-annual-sdl-old
  - match: ["dbie:1371:dp1:1:*"]
    status: baked
    bundle: public-finance-ownership-annual-sdl
  - match: ["dbie:1371:dp0:0:*"]
    status: baked
    bundle: public-finance-ownership-annual-tbills-old
  - match: ["dbie:1371:dp0:1:*"]
    status: baked
    bundle: public-finance-ownership-annual-tbills
  - match: ["dbie:2:dp1:*:reserve-bank-of-india"]
    status: excluded
    reason: "The table lists a row for the RBI's own holding of Treasury bills but prints no figure in it for any week."
  - match: ["dbie:2:dp1:*"]
    status: shown
    bundle: public-finance-tbills
    plate: "§07 Borrowing for weeks, not years"
  - match: ["dbie:2:dp0"]
    status: excluded
    reason: "The same weekly table as this report's other provider, which is read; that one also carries the RBI's row."
  - match: ["dbie:29"]
    status: baked
    bundle: public-finance-tbills
  - match: ["dbie:1362:*"]
    status: shown
    bundle: public-finance-maturity
    plate: "§07 When the Centre's debt falls due"
  # ================= small savings =================
  - match: ["dbie:581:dp1:*"]
    status: shown
    bundle: public-finance-small-savings
    plate: "§07 The post office as the government's banker"
  - match: ["dbie:581:dp6:*"]
    status: baked
    bundle: public-finance-small-savings-annual
  - match: ["dbie:581:dp7"]
    status: excluded
    reason: "A one-cell helper that names the table's latest year; it carries no figures."
  - match: ["dbie:600"]
    status: baked
    bundle: public-finance-small-savings-handbook
  - match: ["dbie:356:dp4:*"]
    status: shown
    bundle: public-finance-small-savings-rates
    plate: "§07 The post office as the government's banker"
  - match: ["dbie:356:dp3:*"]
    status: excluded
    reason: "Scheme attributes printed as text (years to maturity, whether a deposit earns the section 80C tax deduction) and one year's outstanding amounts, which are the same figures as report 581, read month by month."
  # ================= the same tables under other menus =================
  - match: ["dbie:75", "dbie:76", "dbie:77", "dbie:78", "dbie:79", "dbie:80", "dbie:81", "dbie:82", "dbie:83", "dbie:84", "dbie:85", "dbie:86", "dbie:87",
      "dbie:153", "dbie:154", "dbie:163", "dbie:180", "dbie:181", "dbie:182", "dbie:196", "dbie:210", "dbie:211", "dbie:212", "dbie:213", "dbie:230", "dbie:269", "dbie:553", "dbie:746"]
    status: excluded
    reason: "The Handbook of Statistics' copy of a government-finance table this guide reads under DBIE's government-finance menu (the same rows; its printed notes are read to date each year's stage)."
  - match: ["dbie:310", "dbie:313", "dbie:315", "dbie:318", "dbie:320", "dbie:567", "dbie:572", "dbie:602", "dbie:681", "dbie:35", "dbie:62"]
    status: excluded
    reason: "The Public Debt Statistics, Bulletin or government securities copy of a table this guide reads under another menu (Treasury bills outstanding, maturity, liabilities, small savings, ownership)."
  # ================= read by the Interest rates guide (rates-*) =================
  - match: ["dbie:104", "dbie:341", "cas:mrkt-bor-csg-rn:*"]
    status: shown
    bundle: rates-borrowing
    plate: "§04 How the deficit is paid for"
  - match: ["dbie:559", "dbie:576", "dbie:830", "dbie:1218"]
    status: excluded
    reason: "The Centre's market borrowing auction by auction, read by the Interest rates guide into rates-gsec-auctions; this guide charts the yearly totals it adds up to (rates-borrowing)."
  - match: ["dbie:1213", "dbie:1219", "parsed:rbi_sdl_auctions"]
    status: excluded
    reason: "Each state's market borrowing auction by auction, read by the Interest rates guide into rates-sdl-states and rates-state-borrowing; this guide reads the states' yearly totals from the RBI's state-finance tables."
  - match: ["dbie:3", "dbie:314", "dbie:317", "dbie:727", "dbie:319"]
    status: excluded
    reason: "Weekly and monthly market borrowing of the Centre and each state, read by the Interest rates guide into rates-borrowing-weekly and rates-state-borrowing-monthly."
  - match: ["dbie:30", "dbie:110", "dbie:111", "dbie:113", "dbie:307", "dbie:308", "dbie:309", "dbie:311", "dbie:663", "dbie:1365", "dbie:1366"]
    status: excluded
    reason: "Treasury bill auction results (amounts and yields), read by the Interest rates guide into rates-tbill-91, rates-tbill-182, rates-tbill-364 and rates-tbill-cmb; this guide reads the bills outstanding."
  - match: ["dbie:105", "dbie:312", "dbie:316", "dbie:1370"]
    status: excluded
    reason: "The interest rates on central and state government securities, read by the Interest rates guide into rates-gsec-annual."
  # ================= read by the External account guide (external-*) =================
  - match: ["dbie:561", "dbie:563", "dbie:569", "dbie:570", "dbie:571", "dbie:603", "dbie:660"]
    status: excluded
    reason: "India's external debt, public and private, read by the External account guide into external-debt-annual, external-debt-annual-inr and external-debt-inr; the Centre's own external liabilities are in this guide's liabilities table."
