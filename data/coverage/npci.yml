# Coverage ledger: UPI and NPCI's networks (docs/CONTRACT-coverage.md).
# The catalogue (data/coverage/npci.catalogue.json) is generated by
# `node scripts/lib/products/npci.mjs --catalogue` from the Data Bank's capture of NPCI's own tables:
# one item per product tab row and column, UPI ecosystem table group, row and column, and daily tab
# measure, plus named items for NPCI tables the capture does not hold. Rules are read top to bottom;
# the first match decides.
family: npci
guides: [upi]
catalogue: data/coverage/npci.catalogue.json
rules:
  # ---------------- UPI ----------------
  - match: "npci:product:upi:*"
    status: shown
    bundle: npci-upi
    plate: "§04 From a few thousand payments to a few thousand crore; growth on a year earlier, and beside IMPS, FASTag and NACH; the average UPI payment; §09 NPCI against the RBI"
  - match: "npci:ecosystem:p2p_p2m:*"
    status: shown
    bundle: npci-upi-p2p-p2m
    plate: "§04 Most UPI payments go to shops; what a UPI payment is worth"
  - match: ["npci:ecosystem:upi_apps:*:total_volume_mn", "npci:ecosystem:upi_apps:*:b_2_c_transactions_volume_mn"]
    status: shown
    bundle: npci-upi-apps
    plate: "§05 Which app: shares of every app, the fifteen largest, business payouts"
  - match: "npci:ecosystem:upi_apps:*"
    status: baked
    bundle: npci-upi-apps
  - match: ["npci:ecosystem:mcc_top:*:5411:*", "npci:ecosystem:mcc_top:*:5814:*", "npci:ecosystem:mcc_top:*:5812:*", "npci:ecosystem:mcc_top:*:4814:*",
      "npci:ecosystem:mcc_top:*:5541:*", "npci:ecosystem:mcc_top:*:5912:*", "npci:ecosystem:mcc_top:*:5462:*", "npci:ecosystem:mcc_top:*:7322:*", "npci:ecosystem:mcc_top:*:total:*"]
    status: shown
    bundle: npci-upi-mcc
    plate: "§06 What people pay for: categories by number and money, average payment, eight kinds of shop"
  # every other listed category is ranked on the §06 plates in the month it is listed (top fifteen
  # or twenty drawn), and every one is in the plate CSVs, the every-cut table and the downloads
  - match: "npci:ecosystem:mcc_top:*"
    status: baked
    bundle: npci-upi-mcc
  - match: "npci:ecosystem:mcc_other_category:*:*:volume_in_mn"
    status: shown
    bundle: npci-upi-segments
    plate: "§06 Buses and trains, government fees, power bills, school fees, hospitals and farms"
  - match: "npci:ecosystem:mcc_other_category:*"
    status: baked
    bundle: npci-upi-segments
  - match: ["npci:ecosystem:statewise:*:state_total:volume_in_mn", "npci:ecosystem:statewise:*:state_total:value_in_cr", "npci:ecosystem:statewise:unclassified:*:volume_in_mn"]
    status: shown
    bundle: npci-upi-states
    plate: "§07 Where: payments with no state, the state map, every state by payments and average payment"
  # NPCI's printed shares: baked where they agree with NPCI's own volumes (all of March 2026 is
  # printed as fractions and some 2025-26 cells contradict the volumes; those cells are withheld as
  # gaps and the charts compute shares from the volumes)
  - match: ["npci:ecosystem:statewise:*:state_total:*", "npci:ecosystem:statewise:unclassified:*"]
    status: baked
    bundle: npci-upi-states
  - match: "npci:ecosystem:statewise:*:*:volume_in_mn"
    status: shown
    bundle: npci-upi-districts
    plate: "§07 The twenty-five districts with the most UPI payments (every district in the plate CSV)"
  - match: "npci:ecosystem:statewise:*"
    status: baked
    bundle: npci-upi-districts
  # ---------------- other networks ----------------
  - match: ["npci:product:bhim:*"]
    status: shown
    bundle: [npci-bhim, npci-bhim-2016]
    plate: "§08 NPCI's own app, BHIM (two counts, drawn apart)"
  - match: ["npci:product:imps:*:*:volume_in_mn", "npci:product:imps:*:*:value_in_cr"]
    status: shown
    bundle: npci-imps
    plate: "§08 IMPS transfers and the average transfer"
  - match: "npci:product:imps:*"
    status: baked
    bundle: npci-imps
  - match: ["npci:product:netc:*:*:volume_in_mn", "npci:product:netc:*:*:annual_pass_volume_in_mn", "npci:product:netc:*:*:tag_issuance_in_nos"]
    status: shown
    bundle: npci-netc
    plate: "§08 FASTag: tolls, annual-pass trips and tags issued"
  - match: "npci:product:netc:*"
    status: baked
    bundle: npci-netc
  - match: ["npci:product:aeps:*:*:approved_offus_transaction_in_mn", "npci:product:aeps:*:*:approved_onus_transaction_in_mn", "npci:product:aeps:*:*:approved_bhim_aadhaar_pay_transaction_in_mn",
      "npci:product:aeps:*:*:successful_ekyc_in_mn", "npci:product:aeps:*:*:approved_demo_auth_authenticated_in_mn"]
    status: shown
    bundle: npci-aeps
    plate: "§08 Thumbprint banking"
  - match: "npci:product:aeps:*"
    status: baked
    bundle: npci-aeps
  - match: ["npci:product:nach:nach-debit:total_debit:presentation_volume", "npci:product:nach:nach-debit:total_debit:returns_volume"]
    status: shown
    bundle: npci-nach-debit
    plate: "§08 EMI, SIP and bill debits and the share returned unpaid"
  - match: "npci:product:nach:nach-debit:*"
    status: baked
    bundle: npci-nach-debit
  - match: ["npci:product:nach:nach-credit:apbs__dbt:sucessful_transactions_volume", "npci:product:nach:nach-credit:apbs__dbt_lpg:sucessful_transactions_volume", "npci:product:nach:nach-credit:apbs__other_credits:sucessful_transactions_volume",
      "npci:product:nach:nach-credit:credit_306__dbt:sucessful_transactions_volume", "npci:product:nach:nach-credit:credit_306__dbt_lpg:sucessful_transactions_volume", "npci:product:nach:nach-credit:credit_306__other_credits:sucessful_transactions_volume"]
    status: shown
    bundle: npci-nach-credit
    plate: "§08 Subsidies by Aadhaar number, salaries and pensions by account"
  - match: "npci:product:nach:nach-credit:*"
    status: baked
    bundle: npci-nach-credit
  - match: ["npci:product:nach:mms:all:mandates_processed", "npci:product:nach:mms:all:rejected"]
    status: shown
    bundle: npci-nach-mandates
    plate: "§08 NACH mandates processed and rejected"
  - match: "npci:product:nach:mms:*"
    status: baked
    bundle: npci-nach-mandates
  - match: ["npci:product:cts:national-grid:*:presentment_cheque_volume_in_lakhs", "npci:product:cts:national-grid:*:return_cheques_as_of_total_presentment_cheque_volume"]
    status: shown
    bundle: npci-cts
    plate: "§08 Cheques presented, and how many bounce"
  - match: "npci:product:cts:national-grid:*"
    status: baked
    bundle: npci-cts
  - match: ["npci:product:cts:*:*:presentment_cheque_volume_in_lakhs", "npci:product:cts:*:*:return_cheques_as_of_total_presentment_cheque_volume"]
    status: shown
    bundle: npci-cts-grids
    plate: "§08 Cheques presented, and how many bounce (the three grids, drawn apart)"
  - match: "npci:product:cts:*"
    status: baked
    bundle: npci-cts-grids
  - match: "npci:product:e-rupi:*:*:voucher_created_volume"
    status: shown
    bundle: npci-erupi
    plate: "§08 e-RUPI vouchers created"
  - match: "npci:product:e-rupi:*"
    status: baked
    bundle: npci-erupi
  - match: ["npci:daily:upi-daily-statistics:volume", "npci:daily:nfs-daily-statistics:volume"]
    status: shown
    bundle: npci-daily
    plate: "§04 Every day since May 2021; §08 The shared ATM network, day by day"
  - match: "npci:daily:*"
    status: baked
    bundle: npci-daily
  # ---------------- set aside at source ----------------
  - match: "npci:served-not-baked:mcc-template-2016"
    status: excluded
    reason: "NPCI's merchant table for July to November 2016 is a template of zeros with a few tiny values; December 2016 is the first month with a total, and the bundle starts there."
  - match: "npci:served-not-baked:apps-2020-jun-nov"
    status: excluded
    reason: "For June to November 2020 NPCI's apps tab serves a different table (bank-wise inward volume and response status), not apps; the app series start in December 2020."
  - match: "npci:served-not-baked:nach-fiscal-ytd"
    status: excluded
    reason: "Fiscal-year-to-date sums of the monthly NACH table, which is baked month by month; a reader can add the months."
  # ---------------- not captured ----------------
  - match: "npci:uncaptured:*"
    status: blocked
    reason: "Not in the Data Bank's capture of 11 October 2026, and npci.org.in refused automated reading (bot challenge, also to a full browser) on 2026-10-20, so these tables could not be listed or read. No third-party mirror of NPCI's figures is used in their place."
