  # MoSPI regional accounts, base 2011-12
  - match: "nas:23:current:*"
    status: shown
    bundle: ["states-gsdp-current"]
    plate: "§04 How big each state's economy is"
  - match: "nas:23:constant:*"
    status: shown
    bundle: ["states-gsdp-constant", "states-growth-real"]
    plate: "§05 Who grows fastest"
  - match: "nas:24:*"
    status: baked
    bundle: ["states-nsdp-current", "states-nsdp-constant"]
  - match: "nas:25:*"
    status: shown
    bundle: ["states-pcnsdp-current", "states-pcnsdp-constant", "states-spread"]
    plate: "§02 Income per person, state by state"
  - match: ["nas:32:*:assam", "nas:32:*:haryana", "nas:32:*:nagaland", "nas:32:*:ladakh"]
    status: shown
    bundle: ["states-pcnsdp-current", "states-pcnsdp-constant"]
    plate: "§02 Income per person, state by state"
  - match: "nas:32:*"
    status: excluded
    reason: "Indicator 32 repeats indicator 25 in every cell where both are served (validate checks it); indicator 25 is baked and 32 is used only for the four states 25 omits."
  # MoSPI's one-decimal growth rates: the cross-check of the growth we compute from levels
  - match: ["nas:26:*", "nas:27:*", "nas:28:*"]
    status: baked
    bundle: ["states-growth-real", "states-growth-nominal"]
  - match: "nas:29:current:*"
    status: shown
    bundle: ["states-gsva-current", "states-structure", "states-industry-shares"]
    plate: "§06 What each state's economy runs on"
  - match: "nas:29:constant:*"
    status: baked
    bundle: ["states-gsva-constant"]
  - match: "nas:30:*"
    status: baked
    bundle: ["states-nsva-current", "states-nsva-constant"]
  - match: "nas:31:*"
    status: baked
    bundle: ["states-pcgsdp-current", "states-pcgsdp-constant"]
  - match: ["nas:33:*", "nas:34:*"]
    status: baked
    bundle: ["states-taxes-current", "states-taxes-constant"]
