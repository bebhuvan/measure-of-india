# Coverage ledger: state economies (docs/CONTRACT-coverage.md). First matching rule decides.
# Catalogue: scripts/lib/products/states.mjs --catalogue (MoSPI NAS regional indicators x price x
# state x industry; every RBI Handbook of States report). Written 2026-10-09 by the states session.
family: states
guides: [states]
catalogue: data/coverage/states.catalogue.json
rules:
  # server defects (validate reports them on every run)
  - match: ["nas:30:*:karnataka", "nas:30:*:karnataka:*"]
    status: excluded
    reason: "MoSPI serves Karnataka's NSVA as a copy of its GSVA at current prices (current equals constant on every row, checked 2026-10-09), so it is not NSVA and is left out."
  - match: ["nas:32:*:karnataka"]
    status: excluded
    reason: "MoSPI's indicator 32 for Karnataka repeats its per-capita GSDP (indicator 31); Karnataka's per-capita NSDP comes from indicator 25, which is correct and matches the RBI Handbook."
