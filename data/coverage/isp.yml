# Coverage ledger: Index of Services Production, MoSPI (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/isp.mjs --catalogue. All 19 monthly sub-sectors are
# baked. The annual series (one year so far) is the services guide's services-isp-annual.
family: isp
guides: [iip]
catalogue: data/coverage/isp.catalogue.json
rules:
  - match: "isp:monthly:*"
    status: shown
    bundle: isp
    plate: "§10 The services counterpart: ISP"

  # The annual (financial-year) index, one year so far (2025-26), is baked by the services guide
  # from the same MoSPI call; this guide lists that bundle in its downloads rather than baking
  # a second copy (decided 2026-10-10, docs/status/industry.md).
  - match: "isp:annual:*"
    status: baked
    bundle: services-isp-annual
