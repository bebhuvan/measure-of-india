# Coverage ledger: Index of Services Production, MoSPI (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/isp.mjs --catalogue. All 19 monthly sub-sectors are
# baked. Omission left for the coordinator: the annual series (one year so far).
family: isp
guides: [iip]
catalogue: data/coverage/isp.catalogue.json
rules:
  - match: "isp:monthly:*"
    status: shown
    bundle: isp
    plate: "§08 The services counterpart: ISP"

  # Known omissions, found 2026-10-09 when this ledger was first written (atlas-framework).
  # Not decided yet: each is scheduled; --strict (launch) fails while any remain.
  - match:
      - "isp:annual:*"
    status: pending
    scheduled: "wave 2: industry deeper"
