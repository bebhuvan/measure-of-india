  # Andaman and Nicobar Islands, for example). Generated from data/raw/cpi-2024-states-grid.json.
  - match: "cpi:2024:chandigarh:rural:*"
    status: excluded
    reason: "Chandigarh is a city union territory: the NSO compiles no rural index for it, so every rural node the listing offers is empty."
