# Coverage ledger: Consumer Price Index, MoSPI (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/cpi.mjs --catalogue. First matching rule wins.
# Wave 2 (lb/prices, 2026-10-10) decided every item the first ledger left pending: see the
# block at the end. Nothing is pending.
family: cpi
guides: [cpi]
catalogue: data/coverage/cpi.catalogue.json
rules:
  # ---- base 2024, All India
  - match: "cpi:2024:all-india:combined:general:*"
    status: shown
    bundle: [cpi-2024, cpi-2024-linked]
    series: [headline]
    plate: "§01 The current reading; §02 The new base: a continuous headline"
  - match: "cpi:2024:all-india:combined:division:*"
    status: shown
    bundle: cpi-2024
    plate: "§03 The new basket, opened up (the twelve divisions)"
  - match: ["cpi:2024:all-india:rural:general:*", "cpi:2024:all-india:urban:general:*"]
    status: shown
    bundle: cpi-2024-sectors
    series: [rural, urban]
    plate: "§03 Rural and urban on the new base"
  - match: "cpi:2024:all-india:combined:group:*"
    status: shown
    bundle: cpi-2024-groups
    plate: "§03 The 43-group grid"
  - match: "cpi:2024:all-india:combined:item:*"
    status: shown
    bundle: cpi-2024-items
    plate: "§03 The 358-item extremes ledger"
  # ---- base 2024, states (published General index)
  - match: "cpi:2024:*:combined:general:*"
    status: shown
    bundle: cpi-2024-states
    plate: "§11 The spread across states (new base)"
  - match: ["cpi:2024:*:rural:general:*", "cpi:2024:*:urban:general:*"]
    status: baked
    bundle: cpi-2024-states-sectors
  # ---- base 2024, the NSO back series
  - match: "cpi:2024-back:all-india:combined:general"
    status: shown
    bundle: [cpi-2024-back, cpi-2024-linked]
    plate: "§02 The new base: a continuous headline (NSO back-cast)"
  # ---- base 2012 (retired Dec 2025), All India. The headline is computed from the group
  # indices with the official weights; the published General index is its cross-check.
  - match: ["cpi:2012:all-india:combined:group:0-general", "cpi:2012:all-india:combined:group:1-food-and-beverages", "cpi:2012:all-india:combined:group:5-fuel-and-light"]
    status: shown
    bundle: cpi
    series: [headline, food, fuel]
    plate: "§06 Plate 1: the headline and its parts; §08 The parts, one plate each"
  - match: ["cpi:2012:all-india:rural:group:0-general", "cpi:2012:all-india:rural:group:1-food-and-beverages", "cpi:2012:all-india:rural:group:5-fuel-and-light"]
    status: shown
    bundle: cpi-rural
    series: [headline, food, fuel]
    plate: "§10 One index, two Indias: rural and urban"
  - match: ["cpi:2012:all-india:urban:group:0-general", "cpi:2012:all-india:urban:group:1-food-and-beverages", "cpi:2012:all-india:urban:group:5-fuel-and-light"]
    status: shown
    bundle: cpi-urban
    series: [headline, food, fuel]
    plate: "§10 One index, two Indias: rural and urban"
  - match: ["cpi:2012:all-india:combined:subgroup:*", "cpi:2012:all-india:combined:group:7-consumer-food-price"]
    status: shown
    bundle: cpi-subgroups
    plate: "§09 The sub-indices, a field guide"
  - match: "cpi:2012:*:combined:group:0-general"
    status: shown
    bundle: cpi-states
    plate: "§11 The spread across states (retired base)"
  - match: ["cpi:2012:*:rural:group:0-general", "cpi:2012:*:urban:group:0-general"]
    status: shown
    bundle: cpi-states-sectors
    plate: "§11 The widest rural-urban gaps"
  # ---- base 2010
  - match: "cpi:2010:*"
    status: excluded
    reason: "The 2010 base is a 48-month fragment, 2011 to 2014, on the pre-2012 group scheme, wholly overlapped and superseded by the 2012 base; it is archived raw (data/raw/cpi-2010-indices.json) and not baked."

  # ---- wave 2 (lb/prices, 2026-10-10): every item the framework left pending, decided ----
  # base 2024, All India, below the divisions and by sector
  - match: "cpi:2024:all-india:combined:class:*"
    status: baked
    bundle: cpi-2024-classes
  - match: "cpi:2024:all-india:combined:subclass:*"
    status: baked
    bundle: cpi-2024-subclasses
  - match: ["cpi:2024:all-india:rural:division:*", "cpi:2024:all-india:urban:division:*"]
    status: shown
    bundle: [cpi-2024-rural-divisions, cpi-2024-urban-divisions]
    plate: "§03 Village and town, division by division"
  - match: "cpi:2024:all-india:rural:group:*"
    status: baked
    bundle: cpi-2024-rural-groups
  - match: "cpi:2024:all-india:urban:group:*"
    status: baked
    bundle: cpi-2024-urban-groups
  - match: "cpi:2024:all-india:rural:class:*"
    status: baked
    bundle: cpi-2024-rural-classes
  - match: "cpi:2024:all-india:urban:class:*"
    status: baked
    bundle: cpi-2024-urban-classes
  - match: "cpi:2024:all-india:rural:subclass:*"
    status: baked
    bundle: cpi-2024-rural-subclasses
  - match: "cpi:2024:all-india:urban:subclass:*"
    status: baked
    bundle: cpi-2024-urban-subclasses
  - match: "cpi:2024:all-india:rural:item:*"
    status: baked
    bundle: cpi-2024-rural-items
  - match: "cpi:2024:all-india:urban:item:*"
    status: baked
    bundle: cpi-2024-urban-items
  # base 2024, states
  - match: "cpi:2024:*:combined:division:*"
    status: shown
    bundle: cpi-2024-states-divisions
    plate: "§11 Your state, division by division"
  - match: "cpi:2024:*:rural:division:*"
    status: baked
    bundle: cpi-2024-states-divisions-rural
  - match: "cpi:2024:*:urban:division:*"
    status: baked
    bundle: cpi-2024-states-divisions-urban
  - match: "cpi:2024:*:combined:group:*"
    status: baked
    bundle: cpi-2024-states-groups
  - match: "cpi:2024:*:rural:group:*"
    status: baked
    bundle: cpi-2024-states-groups-rural
  - match: "cpi:2024:*:urban:group:*"
    status: baked
    bundle: cpi-2024-states-groups-urban
  - match: ["cpi:2024:*:*:class:*", "cpi:2024:*:*:subclass:*", "cpi:2024:*:*:item:*"]
    status: excluded
    archive: true
    rolls_up_to: [cpi-2024-states-groups, cpi-2024-states-groups-rural, cpi-2024-states-groups-urban]
    reason: "Published by the NSO for every state and sector at class, sub-class and item level: about 600,000 index values a year, too many for a chart bundle. Held for the deep-archive tier (data/archive/staging/cpi/, long csv.gz with index, y/y, the NSO's own inflation and the imputation flag); state by group is baked."
  - match: ["cpi:2024-back:all-india:rural:general", "cpi:2024-back:all-india:urban:general"]
    status: baked
    bundle: cpi-2024-back-sectors
  # base 2012
  - match: ["cpi:2012:all-india:combined:group:2-pan-tobacco-and-intoxicants", "cpi:2012:all-india:combined:group:3-clothing-and-footwear", "cpi:2012:all-india:combined:group:4-housing", "cpi:2012:all-india:combined:group:6-miscellaneous"]
    status: shown
    bundle: cpi-groups
    plate: "§08 The rest of the old basket: housing, clothing, pan and the services block"
  - match: "cpi:2012:all-india:rural:*"
    status: baked
    bundle: cpi-rural-detail
  - match: "cpi:2012:all-india:urban:*"
    status: baked
    bundle: cpi-urban-detail
  - match: "cpi:2012:all-india:combined:item:*"
    status: shown
    bundle: cpi-items-2012
    plate: "§09 Thirteen years of the old basket, item by item"
  - match: "cpi:2012:*:combined:group:*"
    status: baked
    bundle: cpi-states-groups
  - match: "cpi:2012:*:rural:group:*"
    status: baked
    bundle: cpi-states-groups-rural
  - match: "cpi:2012:*:urban:group:*"
    status: baked
    bundle: cpi-states-groups-urban
  - match: "cpi:2012:*:combined:subgroup:*"
    status: baked
    bundle: cpi-states-subgroups
  - match: "cpi:2012:*:rural:subgroup:*"
    status: baked
    bundle: cpi-states-subgroups-rural
  - match: "cpi:2012:*:urban:subgroup:*"
    status: baked
    bundle: cpi-states-subgroups-urban
  - match: "cpi:2012-back:all-india:*"
    status: baked
    bundle: cpi-2012-early
  - match: "cpi:2012-back:*"
    status: baked
    bundle: cpi-2012-early-states
