# Coverage ledger: Consumer Price Index, MoSPI (docs/CONTRACT-coverage.md).
# Catalogue: node scripts/lib/products/cpi.mjs --catalogue. First matching rule wins.
# Wave 2 (lb/prices, 2026-10-10) decided every item the first ledger left pending: see the
# block at the end. Nothing is pending.
