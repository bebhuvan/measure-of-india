    bundle: [cpi-2024-rural-divisions, cpi-2024-urban-divisions]
    plate: "§03 Village and town, division by division"
  - match: "cpi:2024:all-india:rural:group:*"
    status: baked
    bundle: cpi-2024-rural-groups
  - match: "cpi:2024:all-india:urban:group:*"
    status: baked
    bundle: cpi-2024-urban-groups
  - match: "cpi:2024:all-india:rural:class:*"
    status: baked
    bundle: cpi-2024-rural-classes
  - match: "cpi:2024:all-india:urban:class:*"
    status: baked
    bundle: cpi-2024-urban-classes
  - match: "cpi:2024:all-india:rural:subclass:*"
