    bundle: cpi-2024-rural-subclasses
  - match: "cpi:2024:all-india:urban:subclass:*"
    status: baked
    bundle: cpi-2024-urban-subclasses
  - match: "cpi:2024:all-india:rural:item:*"
    status: baked
    bundle: cpi-2024-rural-items
  - match: "cpi:2024:all-india:urban:item:*"
    status: baked
    bundle: cpi-2024-urban-items
  # base 2024, states
  - match: "cpi:2024:*:combined:division:*"
    status: shown
    bundle: cpi-2024-states-divisions
    plate: "§11 Your state, division by division"
  - match: "cpi:2024:*:rural:division:*"
    status: baked
    bundle: cpi-2024-states-divisions-rural
  - match: "cpi:2024:*:urban:division:*"
    status: baked
    bundle: cpi-2024-states-divisions-urban
  - match: "cpi:2024:*:combined:group:*"
    status: baked
    bundle: cpi-2024-states-groups
  - match: "cpi:2024:*:rural:group:*"
    status: baked
    bundle: cpi-2024-states-groups-rural
  - match: "cpi:2024:*:urban:group:*"
    status: baked
    bundle: cpi-2024-states-groups-urban
  - match: ["cpi:2024:*:*:class:*", "cpi:2024:*:*:subclass:*", "cpi:2024:*:*:item:*"]
    status: excluded
    archive: true
    rolls_up_to: [cpi-2024-states-groups, cpi-2024-states-groups-rural, cpi-2024-states-groups-urban]
    reason: "Published by the NSO for every state and sector at class, sub-class and item level: about 600,000 index values a year, too many for a chart bundle. Held for the deep-archive tier (data/archive/staging/cpi/, long csv.gz with index, y/y, the NSO's own inflation and the imputation flag); state by group is baked."
  - match: ["cpi:2024-back:all-india:rural:general", "cpi:2024-back:all-india:urban:general"]
    status: baked
    bundle: cpi-2024-back-sectors
