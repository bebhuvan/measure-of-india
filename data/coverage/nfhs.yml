    status: excluded
    reason: MoSPI's API files another indicator's NFHS-4 value under this sub-indicator (for India it gives 3.3 per cent of women with a bank account, where the NFHS-5 national report prints 53; violence during pregnancy 57.6 where the DHS Program gives 3.9), and the shift repeats in every state, so its NFHS-4 figure is withheld (scripts/lib/products/nfhs.mjs QUARANTINE has the evidence line by line).
