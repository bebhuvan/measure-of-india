# Coverage ledger: interest rates and monetary policy (docs/CONTRACT-coverage.md).
# The catalogue (data/coverage/rates.catalogue.json) is generated by
# `node scripts/lib/products/rbirates.mjs --catalogue`: the Data Bank's parsed `rbi` datasets
# and every DBIE report the rates family owns, chosen by rule from the Data Bank's webi
# inventory. Rules are read top to bottom; the first match decides. Where the RBI publishes
# one table under several DBIE menus, the copy this guide reads is marked and the others are
# excluded as the same table.
family: rates
guides: [rates]
catalogue: data/coverage/rates.catalogue.json
rules:
  # ---------------- policy rates ----------------
  - match: ["parsed:policy:repo", "parsed:policy:bank_rate"]
    status: shown
    bundle: [rates-policy, rates-monthly]
    plate: "§04 Ninety years of the price of money"
  - match: ["parsed:policy:crr", "parsed:policy:slr"]
    status: shown
    bundle: [rates-policy, rates-monthly]
    plate: "§04 Banks once had to hold more than half of their deposits as cash and government bonds"
  - match: ["parsed:policy:sdf", "parsed:policy:msf", "parsed:policy:reverse_repo"]
    status: shown
    bundle: [rates-policy, rates-monthly, rates-wss]
    plate: "§04 The overnight rate lives inside a corridor the RBI sets"
  - match: ["dbie:151:*", "dbie:440:*", "dbie:531:*"]
    status: baked
    bundle: rates-policy
  # ---------------- the MPC ----------------
  - match: ["parsed:mpc:meeting:*"]
    status: shown
    bundle: [rates-mpc, rates-mpc-votes]
    plate: "§05 Every decision of the Monetary Policy Committee"
  - match: ["parsed:mpc:vote:*", "dbie:1491:*"]
    status: shown
    bundle: rates-mpc-votes
    plate: "§05 How each member voted"
  # ---------------- what banks charge and pay ----------------
  - match: ["parsed:lending:floating_loan_benchmark_share:*:total:share"]
    status: excluded
    reason: "The total row is 100 by construction; the four benchmark shares that make it up are baked and checked against it."
  - match: ["parsed:lending:floating_loan_benchmark_share:*"]
    status: shown
    bundle: rates-benchmarks
    plate: "§06 Floating-rate loans by benchmark"
  - match: ["parsed:lending:mclr_1y_bank_group:*"]
    status: shown
    bundle: rates-mclr
    plate: "§06 The 1-year MCLR bank by bank"
  - match: ["parsed:lending:mclr_1y_bankwise:*"]
    status: shown
    bundle: rates-mclr-banks
    plate: "§06 The 1-year MCLR bank by bank"
  - match: ["parsed:lending:walr_fresh_sector:*"]
    status: shown
    bundle: rates-walr-sectors
    plate: "§06 What a new loan costs depends on what it is for"
  - match: ["parsed:lending:walr_outstanding_sector:*"]
    status: baked
    bundle: rates-walr-sectors
  - match: ["parsed:lending:walr_*", "parsed:lending:wadtdr_*"]
    status: shown
    bundle: rates-lending
    plate: "§06 Loan and deposit rates follow the repo rate"
  - match: ["dbie:949:*"]
    status: shown
    bundle: rates-walr-occupation
    plate: "§06 Credit card debt against a home loan"
  - match: ["dbie:755:*"]
    status: baked
    bundle: rates-walr-1992
  - match: ["dbie:1205:*"]
    status: baked
    bundle: rates-walr-groups-2005
  - match: ["dbie:735:*"]
    status: excluded
    reason: "The same table as DBIE report 1205 (bank-group and occupation-wise lending and deposit rates), which is read."
  - match: ["dbie:10:dp6:inr_*", "dbie:10:dp6:*forward_premia*", "dbie:10:dp6:3_month_fbil*", "dbie:10:dp6:6_month_fbil*"]
    status: excluded
    reason: "Exchange rates and forward premia are the price of the rupee, not an interest rate; the external-account guide carries them from the RBI's exchange-rate tables."
  - match: ["dbie:10:dp6:*term_deposit*", "dbie:10:dp6:*savings_deposit*", "dbie:10:dp6:*call_money*", "dbie:10:dp6:policy_repo*", "dbie:10:dp6:marginal_standing*", "dbie:10:dp6:standing_deposit*", "dbie:10:dp6:reverse_repo*"]
    status: shown
    bundle: rates-wss
    plate: "§06 What banks advertise to savers, and §04 the corridor"
  - match: ["dbie:10:dp6:*"]
    status: baked
    bundle: rates-wss
  - match: ["dbie:10:dp0:*", "dbie:10:dp4:*", "dbie:10:dp5:*", "dbie:10:dp7:*"]
    status: excluded
    reason: "These parts of the weekly table are bank balance sheets (deposits, credit and the credit-deposit ratios), not interest rates; the money and credit guide reads them from the RBI's banking tables."
  # ---------------- real rates (no separate source: derived from CPI and the rates above) ----------------
  # ---------------- the money market ----------------
  - match: ["dbie:198:*"]
    status: shown
    bundle: [rates-call-daily, rates-call-daily-detail]
    plate: "§04 The overnight rate lives inside a corridor the RBI sets"
  - match: ["dbie:690:*", "dbie:50:*"]
    status: excluded
    reason: "The same daily call money table as DBIE report 198 (report 50 is its monthly Bulletin extract), which is read."
  - match: ["dbie:1397:*"]
    status: excluded
    reason: "Weekly averages the RBI computes from the daily call money rates and volumes, which are baked day by day from report 198."
  - match: ["dbie:1375:*"]
    status: shown
    bundle: rates-call-monthly
    plate: "§08 Call money since 1990"
  - match: ["dbie:265:*"]
    status: excluded
    reason: "The same monthly call money table as DBIE report 1375, which is read."
  - match: ["dbie:611:dp0:liquidity_adjustment_facility*", "dbie:611:dp4:*"]
    status: excluded
    reason: "The RBI's own operations print once per settlement date in this table; they are read from report 8, which prints one total per operation per day."
  - match: ["dbie:611:dp1:*"]
    status: excluded
    reason: "The table's list of its 48 line items without values, a picker for the report, not data."
  - match: ["dbie:611:dp2:*"]
    status: excluded
    reason: "Unlabelled helper values the RBI's report derives from its own codes; it names no series and prints no dates of its own."
  - match: ["dbie:611:dp0:*"]
    status: baked
    bundle: rates-money-market
  - match: ["dbie:659:*"]
    status: excluded
    reason: "The same daily money market table as DBIE report 611, which is read."
  - match: ["dbie:993:*standard_devi*"]
    status: excluded
    reason: "The spread of the banks' polled quotes around each MIBOR and MIBID fixing, not a rate anyone pays."
  - match: ["dbie:993:*"]
    status: baked
    bundle: rates-mibor
  - match: ["dbie:992:*"]
    status: excluded
    reason: "LIBOR is a London rate in foreign currencies that the RBI mirrored until it was discontinued in 2022; it is not an Indian interest rate."
  - match: ["dbie:8:*"]
    status: baked
    bundle: rates-liquidity
  - match: ["dbie:21:*", "dbie:702:*"]
    status: excluded
    reason: "The same liquidity operations table as DBIE report 8 (report 21 is its Bulletin copy), which is read."
  - match: ["dbie:1211:*"]
    status: baked
    bundle: rates-laf
  - match: ["dbie:1217:*"]
    status: excluded
    reason: "The same LAF auction table as DBIE report 1211, which is read."
  - match: ["dbie:1367:*"]
    status: baked
    bundle: rates-omo
  - match: ["dbie:214:*"]
    status: excluded
    reason: "The same open market operations table as DBIE report 1367, which is read."
  - match: ["dbie:267:*14_day*"]
    status: excluded
    reason: "The table keeps rows for the discontinued 14-day Treasury bill but prints no value in them."
  - match: ["dbie:267:*"]
    status: baked
    bundle: rates-market-repo
  - match: ["dbie:769:*"]
    status: excluded
    reason: "The same market repo table as DBIE report 267, which is read."
  - match: ["dbie:4:*"]
    status: baked
    bundle: rates-cd
  - match: ["dbie:31:*", "dbie:94:*", "dbie:566:*"]
    status: excluded
    reason: "The same certificates-of-deposit table as DBIE report 4 (fortnightly, from 1991), which is read."
  - match: ["dbie:5:*"]
    status: baked
    bundle: rates-cp
  - match: ["dbie:32:*", "dbie:93:*", "dbie:1395:*"]
    status: excluded
    reason: "The same commercial paper table as DBIE report 5 (fortnightly, from 1993), or its monthly extract, which is read."
  # ---------------- Treasury bills and government bonds ----------------
  - match: ["parsed:tbill:*partial_allotment_pct", "parsed:gsec:*partial_allotment_pct", "parsed:sdl:*partial_allotment_pct"]
    status: excluded
    reason: "The share of a bid at the cut-off that was allotted is an auction mechanic printed only in the press releases; it does not describe a rate or an amount raised."
  - match: ["parsed:tbill:tbill:91:cutoff_yield_pct"]
    status: shown
    bundle: rates-tbill-91
    plate: "§08 Short and long: the 91-day Treasury bill and the 10-year bond"
  - match: ["parsed:tbill:tbill:*"]
    status: baked
    bundle: [rates-tbill-91, rates-tbill-182, rates-tbill-364]
  - match: ["parsed:tbill:cmb:*"]
    status: baked
    bundle: rates-tbill-cmb
  - match: ["dbie:307:*"]
    status: shown
    bundle: rates-tbill-91
    plate: "§08 Short and long: the 91-day Treasury bill and the 10-year bond"
  - match: ["dbie:308:dp2:*"]
    status: baked
    bundle: rates-tbill-182
  - match: ["dbie:309:*"]
    status: baked
    bundle: rates-tbill-364
  - match: ["dbie:311:*cm*"]
    status: baked
    bundle: rates-tbill-cmb
  - match: ["dbie:311:*", "dbie:30:*", "dbie:308:dp3:*", "dbie:110:*", "dbie:111:*", "dbie:113:*", "dbie:663:*", "dbie:1365:*", "dbie:1366:*"]
    status: excluded
    reason: "The same Treasury bill auction results as DBIE reports 307, 308 and 309 (one per tenor, read in full), printed under another menu or layout."
  - match: ["dbie:808:*"]
    status: baked
    bundle: rates-tbill-14
  - match: ["dbie:809:*"]
    status: baked
    bundle: rates-tbill-sgl
  - match: ["dbie:234:*"]
    status: excluded
    reason: "The same Treasury bill yield table as DBIE report 809, which is read."
  - match: ["dbie:1368:*"]
    status: shown
    bundle: rates-gsec-curve
    plate: "§08 The yield curve: what the government pays to borrow for 1 to 30 years"
  - match: ["dbie:217:*"]
    status: excluded
    reason: "The same month-end yield table as DBIE report 1368, which is read."
  - match: ["dbie:105:*"]
    status: baked
    bundle: rates-gsec-annual
  - match: ["dbie:312:*", "dbie:316:*", "dbie:1370:*"]
    status: excluded
    reason: "The same table of interest rates on central and state government securities as DBIE report 105, which is read."
  - match: ["parsed:gsec:*cutoff_price", "parsed:gsec:*weighted_avg_price", "parsed:sdl:*cutoff_price", "parsed:sdl:*weighted_avg_price", "parsed:tbill:*cutoff_price", "parsed:tbill:*weighted_avg_price", "dbie:1213:*:cut_off_price"]
    status: excluded
    reason: "An auction price restates its yield as rupees per ₹100 of face value; the yields are baked, and for Treasury bills the prices are baked too from the RBI's tables."
  - match: ["parsed:gsec:*coupon_pct", "parsed:gsec:*underwriting*", "parsed:gsec:*new_issue"]
    status: excluded
    reason: "Coupons, underwriting commitments and the new-issue flag describe individual securities in the press releases; the guide aggregates auctions by day and year, where they cannot be added up."
  - match: ["parsed:gsec:*count", "parsed:sdl:*count"]
    status: excluded
    reason: "The number of bids is an auction mechanic; the amounts bid and accepted are baked."
  - match: ["parsed:gsec:*"]
    status: baked
    bundle: rates-gsec-auctions
  - match: ["dbie:559:*"]
    status: shown
    bundle: [rates-gsec-auctions, rates-gsec-auctions-fy]
    plate: "§09 When the market will not buy: bonds left with primary dealers"
  - match: ["dbie:576:*", "dbie:830:*", "dbie:1218:*"]
    status: excluded
    reason: "The same central government auction table as DBIE report 559, which is read."
  # ---------------- government borrowing ----------------
  - match: ["parsed:sdl:*"]
    status: shown
    bundle: rates-sdl-states
    plate: "§09 What each state pays to borrow"
  - match: ["dbie:1213:*"]
    status: shown
    bundle: rates-sdl-states
    plate: "§09 What each state pays to borrow"
  - match: ["dbie:1219:*"]
    status: excluded
    reason: "The same state auction table as DBIE report 1213, which is read."
  - match: ["dbie:104:*"]
    status: shown
    bundle: rates-borrowing
    plate: "§09 Market borrowing of the centre and the states"
  - match: ["dbie:341:*"]
    status: excluded
    reason: "The same market borrowing table as DBIE report 104, which is read."
  - match: ["dbie:3:*"]
    status: baked
    bundle: rates-borrowing-weekly
  - match: ["dbie:314:*", "dbie:317:*", "dbie:727:*"]
    status: excluded
    reason: "The same weekly market borrowing table as DBIE report 3, which is read."
  - match: ["dbie:38:*"]
    status: baked
    bundle: rates-state-borrowing-monthly
  - match: ["dbie:319:*"]
    status: excluded
    reason: "The same state-wise monthly borrowing table as DBIE report 38, which is read."
  - match: ["dbie:1737:*"]
    status: baked
    bundle: rates-state-borrowing
  # ---------------- the long view ----------------
  - match: ["dbie:282:dp1:*deposit_rates*"]
    status: shown
    bundle: rates-structure
    plate: "§10 What a one-to-three-year fixed deposit paid, 1970 to today"
  - match: ["dbie:282:dp1:*"]
    status: baked
    bundle: rates-structure
  - match: ["dbie:282:dp0:*", "dbie:441:*"]
    status: excluded
    reason: "The same Structure of Interest Rates table as DBIE report 282's current layout (data provider DP1), which is read; this is its older layout or its copy under the Key Rates menu."
