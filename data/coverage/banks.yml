  status: shown
  bundle: banks-groups-sectoral
  plate: §08 Which loans go bad, and where banks lend
- match:
  - rbih:1221:sectoral:*:bank
  status: baked
  bundle: banks-sectoral
- match:
  - rbih:1221:priority:*:group
  status: shown
  bundle: banks-groups-priority
  plate: §08 Which loans go bad, and where banks lend
- match:
