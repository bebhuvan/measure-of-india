  status: shown
  bundle:
  - banks-groups-capital
  - banks-health
  plate: §06 Profit, capital and margins
- match:
  - rbih:1221:capital:*:bank
  status: baked
  bundle: banks-capital
- match:
  - rbih:1221:profitability:*:group
  status: shown
  bundle: banks-groups-profitability
  plate: §06 Profit, capital and margins
- match:
