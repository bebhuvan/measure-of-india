  - banks-infra-2014
- match: rbih:617
  status: blocked
  reason: The Reserve Bank Innovation Hub's copy of report 617 holds only the report's prompt page and no rows (checked 2026-10-10), and DBIE refused the Data Bank's fetch (HTTP 400, WSR 00102, 2026-10-08);
    offices by bank group and population group are in the credit guide's credit-deep-offices-bank-groups and credit-deep-offices-banks.
- match:
  - rbih:799:business-per-employee:bank
  - rbih:799:profit-per-employee:bank
  status: excluded
  reason: The editions print business and profit per employee in ₹ million, ₹ crore and plain rupees under labels that do not always say which (2021-22 prints rupees under a crore label), so no year can
    be read without each bank's own report.
- match: dbie:812:subgroup-*
  status: excluded
  reason: Four sub-groups of the structure table carry no label in either copy of the report (the Data Bank's and the Innovation Hub's), so we cannot say what they count; the labelled totals (all, scheduled,
    non-scheduled) are baked.
- match:
  - dbie:1382
  - dbie:1424
  status: excluded
  reason: 'The Outlook''s foreword note: text, not data.'
