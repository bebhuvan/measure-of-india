# Coverage ledger: India's banks one by one, urban co-operative banks and financial institutions
# (docs/CONTRACT-coverage.md). Catalogue: node scripts/lib/products/banks.mjs --catalogue.
# How it was decided (2026-10-10): every report this guide reads (1221 and the Outlook through
# the Reserve Bank Innovation Hub; the Outlook's typed tables and the financial-institutions
# tables through the Data Bank) is baked whole, one bundle per report, and drawn where a plate
# needs it. The bank-wise, branch, Trend and Progress and NBFC reports the brief names are baked
# by the credit guide: they take credit's decision (its bundles, or its reason), and the two this
# guide draws (branches by population group, offices by bank group) and the NBFC credit dataset
# are marked shown. Nothing is pending.
family: banks
guides:
- banks
catalogue: data/coverage/banks.catalogue.json
rules:
- match: rbih:1221:zero:*
  status: excluded
  reason: The RBI prints this item as zero, or leaves it blank, for every bank and every quarter (mostly the overseas operations of banks that have no offices abroad); there is nothing to bake.
- match:
  - rbih:1221:asset-quality:*:group
  status: shown
  bundle:
  - banks-groups-asset-quality
  - banks-health
  plate: '§04 Bad loans: the cycle that peaked in March 2018'
- match:
  - rbih:1221:asset-quality:*:bank
  status: shown
  bundle: banks-asset-quality
  plate: §07 Bank by bank
- match:
  - rbih:1221:balance-sheet:*:group
  status: shown
  bundle:
  - banks-groups-balance-sheet
  - banks-shares
  plate: §05 Public and private banks have traded places
- match:
  - rbih:1221:balance-sheet:*:bank
  status: shown
  bundle:
  - banks-balance-sheet
  - banks-shares
  plate: §07 Bank by bank
- match:
