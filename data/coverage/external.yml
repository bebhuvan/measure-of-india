# Coverage ledger: the external account (lb/external, 2026-10). docs/CONTRACT-coverage.md.
# Catalogue: every external-sector report in the Data Bank's DBIE inventory, at every line item,
# generated by `node scripts/lib/products/external-dbie.mjs --catalogue`. First matching rule wins.
family: external
guides: [external]
catalogue: data/coverage/external.catalogue.json
rules:
  # ---------------- drawn on the page ----------------
  - match: ["dbie:56:1_current_account:net"]
    status: shown
    bundle: [external-bop, external-bop-vintages]
    plate: "§02 Is India living within its means? (quarterly current account); §11 How the numbers change"
  - match: ["dbie:56:1_1_merchandise:net", "dbie:56:1_2_1_services:net", "dbie:56:1_2_2_2_private:net", "dbie:56:1_2_3_income:net", "dbie:56:1_2_1_5_1_software_services:net"]
    status: shown
    bundle: external-bop
    plate: "§04 What pays for the goods"
  - match: ["dbie:56:1_2_2_2_private:credit"]
    status: shown
    bundle: external-bop-gross
    plate: "§05 Money sent home (remittances received)"
  - match: ["dbie:56:2_1_1_foreign_direct_investment:net", "dbie:56:2_1_2_portfolio_investment:net"]
    status: shown
    bundle: external-bop
    plate: "§06 Who brings money in (net direct and portfolio investment)"
  - match: ["dbie:427:cad_to_gdp"]
    status: shown
    bundle: external-bop-indicators
    plate: "§02 The current account as a share of GDP"
  - match: ["dbie:875:1_current_account:net", "dbie:875:1_1_merchandise:net", "dbie:875:1_2_invisibles:net"]
    status: shown
    bundle: [external-bop-annual-head, external-bop-annual]
    plate: "§04 Seventy-five years of the account"
  - match: ["dbie:1076:rec:1455", "dbie:1076:rec:1460", "dbie:1076:rec:1465", "dbie:1076:rec:1470"]
    status: shown
    bundle: [external-invisibles-people, external-invisibles]
    plate: "§05 Remittances by kind"
  - match: ["dbie:793:*"]
    status: shown
    bundle: [external-lrs]
    plate: "§05 Outward remittances under the LRS, by purpose"
  - match: ["dbie:34:new:a_i_a_gross_inflows*", "dbie:34:new:a_i_b_repatriation*", "dbie:34:new:a_ii_foreign_direct_investment_by_india"]
    status: shown
    bundle: external-fdi
    plate: "§06 Gross FDI, repatriation and Indian investment abroad"
  - match: ["dbie:136:fpi_net"]
    status: shown
    bundle: external-fpi
    plate: "§06 Net FPI investment, monthly"
  - match: ["dbie:574:tr:usd", "dbie:574:fca:usd", "dbie:574:gold:usd"]
    status: shown
    bundle: external-reserves-weekly
    plate: "§07 The reserves, weekly"
  - match: ["dbie:184:tr:usd"]
    status: shown
    bundle: external-reserves-monthly
    plate: "§07 Why reserves move (month-end change)"
  - match: ["dbie:730:sale_dollar:1_net_purchase_sale_of_foreign_currency", "dbie:730:sale_dollar:1_1_purchase", "dbie:730:sale_dollar:1_2_sale", "dbie:730:sale_dollar:4_outstanding_net_forward_sales_purchase"]
    status: shown
    bundle: external-intervention
    plate: "§07 Why reserves move; §09 The RBI's dollar desk"
  - match: ["dbie:719:usd"]
    status: shown
    bundle: external-rupee
    plate: "§08 Rupees per US dollar"
  - match: ["dbie:584:broad:2015-16:series:reer_trade", "dbie:584:broad:2015-16:series:neer_trade"]
    status: shown
    bundle: external-reer-2015
    plate: "§08 The rupee against 40 currencies"
  - match: ["dbie:563:e_1_gross*", "dbie:563:e_1_1_5_commercial_borrowing", "dbie:563:e_1_1_6_nri*", "dbie:563:e_1_2_short_term_debt*"]
    status: shown
    bundle: external-debt-annual
    plate: "§10 What India owes (external debt, end-March)"
  - match: ["dbie:982:bpm6:usd:153", "dbie:982:bpm6:usd:154", "dbie:982:bpm6:usd:354"]
    status: shown
    bundle: [external-iip-head, external-iip]
    plate: "§10 What India owns abroad and owes"

  # ---------------- baked: in a bundle, the every-cut table and the downloads ----------------
  - match: "dbie:56:*"
    status: baked
    bundle: [external-bop-lines, external-bop-gross]
  - match: "dbie:57:*"
    status: baked
    bundle: external-bop-inr-lines
  - match: "dbie:58:*"
    status: baked
    bundle: external-bop6-lines
  - match: "dbie:1502:*"
    status: baked
    bundle: external-bop6-inr-lines
  - match: "dbie:875:*"
    status: baked
    bundle: external-bop-annual
  - match: "dbie:878:*"
    status: baked
    bundle: external-bop-annual-inr
  - match: "dbie:884:*"
    status: baked
    bundle: external-bop-annual-overall
  - match: "dbie:883:*"
    status: baked
    bundle: external-bop-annual-overall-inr
  - match: "dbie:814:*"
    status: baked
    bundle: external-bop6-annual-lines
  - match: "dbie:305:*"
    status: baked
    bundle: external-bop6-annual-lines-inr
  - match: "dbie:427:*"
    status: baked
    bundle: external-bop-indicators
  - match: ["dbie:1076:rec:*", "dbie:1076:pay:*"]
    status: baked
    bundle: external-invisibles
  - match: "dbie:807:*"
    status: baked
    bundle: external-invisibles-annual
  - match: "dbie:424:*"
    status: baked
    bundle: external-invisibles-annual-inr
  - match: "dbie:982:bpm6:usd:*"
    status: baked
    bundle: external-iip
  - match: "dbie:982:bpm6:inr:*"
    status: baked
    bundle: external-iip-inr
  - match: "dbie:982:bpm5:usd:*"
    status: baked
    bundle: external-iip-bpm5
  - match: "dbie:982:bpm5:inr:*"
    status: baked
    bundle: external-iip-bpm5-inr
  - match: "dbie:533:*"
    status: baked
    bundle: external-iip-summary
  - match: "dbie:1503:*"
    status: baked
    bundle: external-iip-summary-inr
  - match: ["dbie:574:*:usd", "dbie:574:gold:*vol*"]
    status: baked
    bundle: external-reserves-weekly
  - match: "dbie:574:*"
    status: baked
    bundle: external-reserves-weekly-inr
  - match: ["dbie:184:*:usd"]
    status: baked
    bundle: external-reserves-monthly
  - match: "dbie:184:*"
    status: baked
    bundle: external-reserves-monthly-inr
  - match: "dbie:415:volume"
    status: excluded
    reason: "The end-March table's 'Volume' provider gives two unlabelled amounts a year for gold, so neither can be read as tonnes; gold in tonnes is baked weekly from report 574."
  - match: "dbie:415:*"
    status: baked
    bundle: external-reserves-annual
  - match: ["dbie:730:sale_inr:*"]
    status: excluded
    reason: "Report 730's 'Sale_inr' provider is a cell-for-cell copy of its 'Sale_dollar' provider (2,618 of 2,618 cells equal, 2026-10-09), not rupee values; the rupee lines are the dollar provider's lines 2 and 3, baked into external-intervention-inr."
  - match: ["dbie:730:sale_dollar:2_equivalent_at_contract_rate_crores", "dbie:730:sale_dollar:3_cumulative_over_end_march_rupees_crore"]
    status: baked
    bundle: external-intervention-inr
  - match: ["dbie:730:query_3:*"]
    status: baked
    bundle: external-forward-book
  - match: "dbie:730:*"
    status: baked
    bundle: external-intervention
  - match: "dbie:1347:*"
    status: baked
    bundle: external-fx-turnover
  - match: "dbie:694:*"
    status: baked
    bundle: external-fx-turnover-daily
  - match: "dbie:558:*"
    status: baked
    bundle: external-forward-premia
  - match: "dbie:698:reference_rate*"
    status: excluded
    reason: "The daily premia table's reference-rate column carries two currencies on the same day with no currency named (82.93 and 89.97 on 5 March 2024), so it cannot be read; the reference rate is baked from report 575."
  - match: "dbie:698:*"
    status: baked
    bundle: external-forward-premia-daily
  - match: "dbie:767:reference_rate*"
    status: excluded
    reason: "This table's reference-rate column repeats the RBI reference rate already baked, with the currency unnamed; the daily reference rate is baked from report 575."
  - match: "dbie:767:*"
    status: baked
    bundle: external-forward-premia-paise-daily
  - match: "dbie:719:*"
    status: baked
    bundle: external-rupee
  - match: "dbie:1374:*"
    status: baked
    bundle: external-rupee-sdr
  - match: "dbie:575:*"
    status: baked
    bundle: external-rupee-daily
  - match: "dbie:691:*"
    status: baked
    bundle: external-rupee-interbank-daily
  - match: "dbie:720:*"
    status: baked
    bundle: external-rupee-155
  - match: "dbie:583:*"
    status: baked
    bundle: external-rupee-highlow
  - match: "dbie:768:reference_rate_min:*"
    status: excluded
    reason: "This provider is the daily reference rate itself, the same figures as report 575, which is baked."
  - match: "dbie:768:*"
    status: baked
    bundle: external-rupee-month-extremes
  - match: "dbie:304:*"
    status: baked
    bundle: external-rupee-annual
  - match: "dbie:156:*"
    status: baked
    bundle: external-rupee-annual-calendar
  - match: "dbie:584:*:stray:*"
    status: excluded
    reason: "Two rows for February 2026 carry 6-currency codes under the broad basket's label and disagree with the 6-currency series for that month; they are a filing error, not a series."
  - match: ["dbie:584:broad:2015-16:series:*"]
    status: baked
    bundle: external-reer-2015
  - match: ["dbie:584:broad:2004-05:series:*"]
    status: baked
    bundle: external-reer-2004
  - match: ["dbie:584:broad:1993-94:series:*"]
    status: baked
    bundle: external-reer-1993
  - match: ["dbie:584:broad:1985:series:*"]
    status: baked
    bundle: external-reer-1985
  - match: ["dbie:584:six:2022-23:series:*"]
    status: baked
    bundle: external-reer6-2022
  - match: ["dbie:584:six:2018-19:series:*"]
    status: baked
    bundle: external-reer6-2018
  - match: ["dbie:584:six:2015-16:series:*"]
    status: baked
    bundle: external-reer6-2015
  - match: ["dbie:584:six:2004-05:series:*"]
    status: baked
    bundle: external-reer6-2004
  - match: ["dbie:584:six:2003-04:series:*"]
    status: baked
    bundle: external-reer6-2003
  - match: ["dbie:584:six:1993-94:series:*"]
    status: baked
    bundle: external-reer6-1993
  - match: "dbie:584:six:*"
    status: excluded
    reason: "Short-lived 6-currency bases (2005-06 to 2021-22, two to six years each) that RBI replaced in turn; every month they cover is on a longer base that is baked (2004-05, 2015-16, 2018-19, 2022-23)."
  - match: ["dbie:380:*_stray_6_currency_rows", "dbie:381:*_stray_6_currency_rows"]
    status: excluded
    reason: "Rows filed under the broad basket's label with 6-currency values that are not the annual averages (FY 2025-26 NEER reads 73.76 here against 76.73 in report 1403 and in the mean of the months); the 6-currency annual index is baked from reports 1402 and 1403."
  - match: ["dbie:380:2015_16_*", "dbie:381:2015_16_*"]
    status: baked
    bundle: [external-reer-2015-calendar, external-reer-2015-fiscal]
  - match: ["dbie:380:2004_05_*", "dbie:381:2004_05_*"]
    status: baked
    bundle: [external-reer-2004-calendar, external-reer-2004-fiscal]
  - match: ["dbie:380:1993_94_*", "dbie:381:1993_94_*"]
    status: baked
    bundle: [external-reer-1993-calendar, external-reer-1993-fiscal]
  - match: ["dbie:1402:*", "dbie:1403:*"]
    status: baked
    bundle: [external-reer6-2015-calendar, external-reer6-2015-fiscal]
  - match: "dbie:34:new:*"
    status: baked
    bundle: external-fdi
  - match: "dbie:34:old:*"
    status: baked
    bundle: external-fdi-1995
  - match: "dbie:290:usd_old:*"
    status: baked
    bundle: external-fdi-annual
  - match: "dbie:290:inr_old:*"
    status: baked
    bundle: external-fdi-annual-inr
  - match: "dbie:290:usd_new:*"
    status: baked
    bundle: external-fdi-annual-new
  - match: "dbie:290:inr_new:*"
    status: baked
    bundle: external-fdi-annual-new-inr
  - match: "dbie:1064:*"
    status: baked
    bundle: external-fdi-yearly
  - match: "dbie:55:monthly:*"
    status: baked
    bundle: [external-ecb, external-ecb-2025]
  - match: "dbie:55:annual:*"
    status: baked
    bundle: external-ecb-annual
  - match: "dbie:752:*"
    status: baked
    bundle: external-lrs-annual
  - match: "dbie:417:*"
    status: baked
    bundle: external-nri
  - match: ["dbie:420:*", "dbie:628:*"]
    status: baked
    bundle: external-nri-annual
  - match: ["dbie:419:*", "dbie:421:*"]
    status: baked
    bundle: external-nri-annual-inr
  - match: ["dbie:1550:*", "dbie:1551:*"]
    status: baked
    bundle: external-invoicing
  - match: "dbie:563:*"
    status: baked
    bundle: external-debt-annual
  - match: "dbie:570:*"
    status: baked
    bundle: external-debt-annual-inr
  - match: "dbie:660:inr:*"
    status: baked
    bundle: [external-debt-inr, external-debt-sector-inr]
  - match: "dbie:660:usd:*"
    status: blocked
    reason: "The US$ provider of report 660 has no amount column in the Data Bank mirror (seen 2026-10-08); the quarterly US$ debt is baked from DBIE's Data Query element EXT_DBT_RT_RN instead (external-debt), and end-March US$ debt from report 563."
  - match: "dbie:418:*"
    status: baked
    bundle: [external-assistance, external-assistance-inr]
  - match: "dbie:695:*"
    status: baked
    bundle: [external-mf, external-mf-inr]

  # ---------------- excluded, with the reason ----------------
  - match: ["dbie:*:copy"]
    status: excluded
    reason: "The same table as a report baked above, served by DBIE under another menu (Handbook, Bulletin, Weekly Statistical Supplement); the generator checks every cell against the baked report (the match share is in the catalogue item)."
  - match: ["dbie:141:*", "dbie:885:*", "dbie:142:*", "dbie:791:*", "dbie:143:*", "dbie:815:*", "dbie:819:*", "dbie:131:*", "dbie:132:*", "dbie:178:*"]
    status: excluded
    reason: "The same balance-of-payments table as one baked above (56, 57, 58, 875, 878, 807, 424 or 427), served under another DBIE menu; the generator checks every cell against it."
  - match: "dbie:1076:bpm6:*"
    status: baked
    bundle: [external-bop6-lines, external-bop6-vintages]
  - match: "dbie:59:*"
    status: excluded
    reason: "This Bulletin copy of the BPM6 rupee table labels both of the January to March 2026 values 'provisional', so the current value cannot be told from the superseded one; the Handbook copy (report 1502), which labels its versions, is baked."
  - match: "dbie:696:*"
    status: excluded
    reason: "DBIE serves this country-wise table only under table numbers (4, 5, 6, 8, 9) with no names for what each table measures, so its figures cannot be labelled honestly."
  - match: ["dbie:1384:*", "dbie:1385:*", "dbie:1386:*", "dbie:1387:*", "dbie:1388:*", "dbie:1389:*", "dbie:1390:*", "dbie:1391:*", "dbie:1392:*", "dbie:1393:*", "dbie:1394:*"]
    status: excluded
    reason: "DBIE serves these international banking statistics with columns named only 'Measure 1' to 'Measure 9', so which column is liabilities and which claims cannot be read from the source; RBI's quarterly banking statistics release is the readable form."
