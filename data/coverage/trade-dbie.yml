# Coverage ledger: merchandise trade, RBI DBIE side (docs/CONTRACT-coverage.md).
# Catalogue generated by scripts/lib/products/dbie-trade.mjs from the Data Bank's DBIE report
# catalogue. First matching rule decides. The TradeStat side is data/coverage/trade.yml.
family: trade-dbie
guides: [trade]
catalogue: data/coverage/trade-dbie.catalogue.json
rules:
  # --- the long headline: monthly since 1990, oil and non-oil since 1997 ---
  - match: ["dbie:433:dp0:*", "dbie:426:dp0:*"]
    status: shown
    bundle: trade-dbie-monthly
    plate: "The long view: exports and imports every month since April 1990; oil and the deficit"
  - match: ["dbie:648:dp0:*", "dbie:425:dp0:*"]
    status: shown
    bundle: trade-dbie-monthly-inr
    plate: "Rupees and dollars: the same trade on two rulers"
  - match: ["dbie:649:dp0:*"]
    status: shown
    bundle: trade-dbie-annual
    plate: "The long view: fifty-five years of exports and imports"
  - match: ["dbie:432:dp0:*"]
    status: shown
    bundle: trade-dbie-annual-inr
    plate: "Rupees and dollars: the same trade on two rulers"
  - match: ["dbie:433:dp1"]
    status: excluded
    reason: "The annual view of report 433 is the sum of its months, which are baked; the RBI's own annual table (report 649) is baked beside it."
  # --- prices and volumes ---
  - match: ["dbie:379:dp0:2012-2013:*"]
    status: shown
    bundle: trade-dbie-tot-2012
    plate: "Prices or volumes: what moved India's trade"
  - match: ["dbie:379:dp0:1978-1979:*"]
    status: baked
    bundle: trade-dbie-tot-1978
  - match: ["dbie:379:dp0:1999-2000:*"]
    status: baked
    bundle: trade-dbie-tot-1999
  - match: ["dbie:601:dp0:*", "dbie:552:dp0:*"]
    status: baked
    bundle: trade-dbie-uvi-2012
  - match: ["dbie:601:dp3:*", "dbie:552:dp3:*"]
    status: baked
    bundle: trade-dbie-uvi-1999
  - match: ["dbie:148:dp1:*"]
    status: shown
    bundle: trade-dbie-oil-volumes
    plate: "Prices or volumes: what moved India's trade"
  # --- partners and commodity groups, the RBI's groupings ---
  - match: ["dbie:676:dp1:*"]
    status: baked
    bundle: trade-dbie-direction
  - match: ["dbie:676:dp0:*"]
    status: baked
    bundle: trade-dbie-direction-1987
  - match: ["dbie:439:dp1:*", "dbie:431:dp1:*"]
    status: baked
    bundle: trade-dbie-commodities
  - match: ["dbie:439:dp0:*", "dbie:431:dp0:*"]
    status: baked
    bundle: trade-dbie-commodities-1987
  - match: ["dbie:429:dp1:*"]
    status: baked
    bundle: trade-dbie-commodity-partners
  - match: ["dbie:429:dp0:*"]
    status: baked
    bundle: trade-dbie-commodity-partners-1990
  # --- rupee twins of tables baked in dollars ---
  - match: ["dbie:428:*", "dbie:430:*", "dbie:607:*", "dbie:635:*"]
    status: excluded
    reason: "Rupee versions of the commodity, direction and partner tables baked in US dollars; the guide tells the rupee story with the headline in both currencies, where the two differ."
  # --- the same tables published again under the Handbook and Bulletin menus ---
  - match: ["dbie:208:*", "dbie:209:*", "dbie:226:*", "dbie:158:*", "dbie:149:*", "dbie:206:*", "dbie:207:*", "dbie:297:*", "dbie:285:*", "dbie:274:*", "dbie:256:*", "dbie:257:*", "dbie:525:*", "dbie:225:*", "dbie:605:*", "dbie:900:*", "dbie:157:*", "dbie:501:*"]
    status: excluded
    reason: "The same RBI table published a second time under the Handbook menu; checked value for value against the baked twin on 2026-10-09 (100 per cent identical)."
  - match: ["dbie:18:*"]
    status: excluded
    reason: "The RBI Bulletin's copy of the monthly tables baked from reports 433, 426, 648 and 425; the only lines it adds are oil and non-oil balances, which are baked as exports minus imports and match it."
