# Coverage ledger: CPI for Agricultural and Rural Labourers, Labour Bureau
# (docs/CONTRACT-coverage.md). Catalogue: node scripts/lib/products/cpialrl.mjs --catalogue.
# Wave 2 (lb/prices, 2026-10-10) decided every pending item: see the block at the end.
family: cpialrl
guides: [cpi]
catalogue: data/coverage/cpialrl.catalogue.json
rules:
  - match: ["cpialrl:1986-1987:al:all-india:general-index", "cpialrl:1986-1987:rl:all-india:general-index"]
    status: shown
    bundle: cpialrl-1986
    series: [al, rl]
    plate: "§12 The other CPI: agricultural labourers (two bases)"
  - match: ["cpialrl:2019:al:all-india:general-index", "cpialrl:2019:rl:all-india:general-index"]
    status: shown
    bundle: cpialrl-2019
    series: [al, rl]
    plate: "§12 The other CPI: agricultural labourers; AL and RL on the new base"
  # the Bureau names the food group "Food" on one base and "Food and Non Alcoholic Beverages"
  # on the other; the adapter folds both into one food series (cpialrl.mjs GROUP_KEY)
  - match: ["cpialrl:2019:al:all-india:food", "cpialrl:2019:al:all-india:food-and-non-alcoholic-beverages", "cpialrl:2019:al:all-india:fuel-and-light", "cpialrl:2019:al:all-india:clothing-and-footwear", "cpialrl:2019:al:all-india:miscellaneous", "cpialrl:2019:al:all-india:pan-tobacco-and-intoxicants"]
    status: shown
    bundle: cpialrl-groups-2019
    plate: "§12 The farm worker's basket, group by group"
  - match: ["cpialrl:1986-1987:al:andhra-pradesh:general-index", "cpialrl:1986-1987:al:assam:general-index", "cpialrl:1986-1987:al:bihar:general-index", "cpialrl:1986-1987:al:gujarat:general-index", "cpialrl:1986-1987:al:haryana:general-index", "cpialrl:1986-1987:al:himachal-pradesh:general-index", "cpialrl:1986-1987:al:jammu-*:general-index", "cpialrl:1986-1987:al:karnataka:general-index", "cpialrl:1986-1987:al:kerala:general-index", "cpialrl:1986-1987:al:madhya-pradesh:general-index", "cpialrl:1986-1987:al:maharashtra:general-index", "cpialrl:1986-1987:al:manipur:general-index", "cpialrl:1986-1987:al:meghalaya:general-index", "cpialrl:1986-1987:al:odisha:general-index", "cpialrl:1986-1987:al:punjab:general-index", "cpialrl:1986-1987:al:rajasthan:general-index", "cpialrl:1986-1987:al:tamil-nadu:general-index", "cpialrl:1986-1987:al:tripura:general-index", "cpialrl:1986-1987:al:uttar-pradesh:general-index", "cpialrl:1986-1987:al:west-bengal:general-index"]
    status: shown
    bundle: cpialrl-states-1986
    plate: "§12 Where the farm worker's rupee stretched: twenty states"
  - match: "cpialrl:2019:al:*:general-index"
    status: baked
    bundle: cpialrl-states-2019

  # ---- wave 2 (lb/prices, 2026-10-10): every pending item decided ----
  - match: ["cpialrl:2019:al:*:general-index", "cpialrl:2019:rl:*:general-index"]
    status: shown
    bundle: [cpialrl-states-2019, cpialrl-states-rl-2019]
    plate: "§12 The farm and rural labourer, state by state, on the new base"
  - match: "cpialrl:1986-1987:rl:*:general-index"
    status: baked
    bundle: cpialrl-states-rl-1986
  - match: ["cpialrl:2019:rl:all-india:*"]
    status: baked
    bundle: cpialrl-groups-rl-2019
  - match: ["cpialrl:2019:al:*:*", "cpialrl:2019:rl:*:*"]
    status: baked
    bundle: cpialrl-states-groups-2019
  - match: ["cpialrl:1986-1987:al:all-india:*", "cpialrl:1986-1987:rl:all-india:*"]
    status: excluded
    reason: "On the 1986-87 base the Bureau serves group indices state by state only; there are no All-India group rows (checked 2026-10-10), and summing states would need weights the Bureau does not publish."
  - match: ["cpialrl:1986-1987:al:*:*", "cpialrl:1986-1987:rl:*:*"]
    status: baked
    bundle: cpialrl-states-groups-1986
