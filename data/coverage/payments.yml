# Coverage ledger: how Indians pay (docs/CONTRACT-coverage.md).
# The catalogue (data/coverage/payments.catalogue.json) is generated by
# `node scripts/lib/products/payments.mjs --catalogue`: every DBIE report in the Data Bank's
# catalogue under the Payment Systems menus, the Bulletin and Handbook payment tables, the
# cheque and clearing-house tables and the e-rupee table, itemised line by line from their own
# rows; the RBI's printed growth rates (WSS); and the BIS CPMI series keys for India, the
# official cross-country source. Rules are read top to bottom; the first match decides.
family: payments
guides: [payments]
catalogue: data/coverage/payments.catalogue.json
rules:
  # ---------------- the monthly table, re-organised layout (November 2019 on) ----------------
  - match: ["payments:612:new:65-*", "payments:612:new:62-*", "payments:612:new:64-*", "payments:612:new:72-*", "payments:612:new:79-*", "payments:612:new:70-*", "payments:612:new:84-*", "payments:612:new:63-*", "payments:612:new:60-*", "payments:612:new:71-*", "payments:612:new:68-*", "payments:612:new:66-*", "payments:612:new:59-*", "payments:612:new:58-*", "payments:612:new:67-*"]
    status: shown
    bundle: [payments-monthly, payments-ticket]
    plate: "§04 UPI and everything else; §02 What one payment is worth; §06 Twelve payment systems"
  - match: ["payments:612:new:54-*", "payments:612:new:55-*", "payments:612:new:56-*", "payments:612:new:87-*", "payments:612:new:88-*", "payments:612:new:89-*"]
    status: shown
    bundle: payments-monthly
    plate: "§04 UPI carries most of the payments; RTGS carries most of the money"
  - match: ["payments:612:new:73-*", "payments:612:new:74-*", "payments:612:new:75-*", "payments:612:new:76-*", "payments:612:new:77-*", "payments:612:new:78-*"]
    status: shown
    bundle: payments-monthly
    plate: "§05 Credit cards overtook debit cards, as debit card payments shrank"
  - match: ["payments:612:new:98-*", "payments:612:new:99-*", "payments:612:new:100-*", "payments:612:new:101-*", "payments:612:new:105-*", "payments:612:new:106-*"]
    status: shown
    bundle: payments-monthly
    plate: "§05 Fewer trips to the ATM, but more cash in people's hands"
  - match: ["payments:612:new:91-*", "payments:612:new:92-*", "payments:612:new:93-*", "payments:612:new:94-*", "payments:612:new:95-*", "payments:612:new:96-*"]
    status: shown
    bundle: payments-monthly
    plate: "§06 Phones carry the payments; net banking still carries more of the money"
  - match: ["payments:612:new:infra:108-*", "payments:612:new:infra:109-*", "payments:612:new:infra:110-*"]
    status: shown
    bundle: payments-infra
    plate: "§05 Credit cards overtook debit cards, as debit card payments shrank"
  - match: ["payments:612:new:infra:114-*", "payments:612:new:infra:115-*", "payments:612:new:infra:116-*", "payments:612:new:infra:117-*", "payments:612:new:infra:118-*", "payments:612:new:infra:119-*", "payments:612:new:infra:146-*"]
    status: shown
    bundle: payments-infra
    plate: "§05 QR codes, card machines and ATMs"
  - match: "payments:612:new:infra:*"
    status: baked
    bundle: payments-infra
  # the rest of the re-organised table: CCIL's settlement systems, the PPI and card sub-lines, ECS
  # (wound down), paper's 'others', cash at PoS terminals
  - match: "payments:612:new:*"
    status: baked
    bundle: [payments-monthly, payments-ticket]
  - match: "payments:612:header:*"
    status: excluded
    reason: "A section title row ('B. ATMs') that DBIE fills with zeros for April 2022 to May 2023; the ATM lines under it carry the data."
  # ---------------- the monthly table, old layout (April 2004 to October 2019) ----------------
  - match: ["payments:612:old:20-*", "payments:612:old:25-*", "payments:612:old:28-*", "payments:612:old:27-*"]
    status: shown
    bundle: payments-monthly-2004
    plate: "§07 Fifteen years before UPI: NEFT and card payments at shops since 2004"
  - match: "payments:612:old:infra:*"
    status: baked
    bundle: payments-infra-2004
  - match: "payments:612:old:*"
    status: baked
    bundle: payments-monthly-2004
  # ---------------- the annual table (Handbook) ----------------
  - match: ["payments:907:new:132-*", "payments:907:new:144-*", "payments:907:new:145-*", "payments:907:new:142-*"]
    status: shown
    bundle: payments-annual
    plate: "§07 A decade of payments, year by year"
  - match: "payments:907:new:*"
    status: baked
    bundle: payments-annual
  - match: "payments:907:old:*"
    status: excluded
    reason: "The annual table's old layout (2012-13 to 2017-18) is stored by DBIE at one-hundredth (values) and one-tenth (volumes) of the monthly table's sums for the same years; the monthly table carries those years correctly (payments-monthly-2004)."
  - match: ["payments:907:cheques:7-*", "payments:907:cheques:8-*"]
    status: shown
    bundle: payments-cheques-1970
    plate: "§07 Cheques peaked and have been falling since"
  - match: "payments:907:cheques:*"
    status: baked
    bundle: payments-cheques-1970
  # ---------------- cheques by clearing centre, clearing houses (STRBI) ----------------
  - match: ["payments:678:1.1.1.13-mumbai:*", "payments:678:1.1.1.15-new-delhi:*", "payments:678:1.1.1.6-chennai:*", "payments:678:national-grid:*"]
    status: shown
    bundle: payments-cheques-centres
    plate: "§07 From city clearing houses to one national grid"
  - match: "payments:678:*"
    status: baked
    bundle: payments-cheques-centres
  - match: ["payments:936:total", "payments:936:total:micr"]
    status: shown
    bundle: payments-clearing-houses
    plate: "§07 From city clearing houses to one national grid"
  - match: "payments:936:*"
    status: baked
    bundle: payments-clearing-houses
  # ---------------- the e-rupee ----------------
  - match: ["payments:1404:12-*", "payments:1404:13-*", "payments:1404:14-*"]
    status: shown
    bundle: payments-erupee
    plate: "§08 The e-rupee is a rounding error beside cash"
  - match: "payments:1404:11-*"
    status: excluded
    reason: "The RBI's e-rupee table has a ₹2000 column, but no e-rupee was ever issued in it: every year is blank."
  - match: "payments:1404:*"
    status: baked
    bundle: payments-erupee
  # ---------------- the RBI's printed growth (WSS) ----------------
  - match: "payments:rbib43:*"
    status: baked
    bundle: payments-growth-wss
  # ---------------- the same tables under other DBIE ids ----------------
  - match: ["payments:report:61", "payments:report:778"]
    status: excluded
    reason: "The same RBI Bulletin Table 45 (same document, same rows) as report 612, served under another DBIE menu."
  - match: "payments:report:824"
    status: excluded
    reason: "The same Handbook payment system table as report 907, served under another DBIE menu."
  - match: "payments:report:662"
    status: excluded
    reason: "The same STRBI Table 22 on cheque clearances as report 678, served under another DBIE menu."
  - match: "payments:report:743"
    status: excluded
    reason: "The same STRBI Table 27 on clearing houses as report 936, served under another DBIE menu."
  # ---------------- the international comparison ----------------
  - match: "bis:cpmi:*"
    status: blocked
    reason: "The BIS CPMI payment statistics are the official cross-country source, but the Atlas reads BIS values only from the Data Bank, which does not mirror the WS_CPMI dataflows (checked 2026-10-10); requested from the coordinator."
