# Coverage ledger: merchandise trade, TradeStat side (docs/CONTRACT-coverage.md).
# Catalogue generated by scripts/lib/products/trade-catalogue.mjs from TradeStat's own pickers
# and archived tables. First matching rule decides. The RBI side is data/coverage/trade-dbie.yml.
family: trade
guides: [trade]
catalogue: data/coverage/trade.catalogue.json
rules:
  # ---------------- the headline ----------------
  - match: ["meidb:*:usd:monthly:total"]
    status: shown
    bundle: trade-total
    plate: "The long view: month by month since 2017 (and the title block)"
  - match: ["meidb:*:usd:ytd:total"]
    status: shown
    bundle: [trade-hs2-exports-ytd, trade-hs2-imports-ytd]
    plate: "Title block: exports so far this financial year"
  - match: ["meidb:*:inr:monthly:total"]
    status: baked
    bundle: trade-total-inr
  - match: ["meidb:*:usd:fy:total"]
    status: shown
    bundle: [trade-hs2-exports-fy, trade-hs2-imports-fy]
    plate: "What India sells, and what it buys: by chapter"
  - match: ["meidb:*:inr:fy:total", "meidb:*:inr:ytd:total"]
    status: baked
    bundle: [trade-hs2-exports-fy-inr, trade-hs2-imports-fy-inr, trade-hs2-exports-ytd-inr, trade-hs2-imports-ytd-inr]
  # ---------------- chapters (2 digits) ----------------
  - match: ["meidb:*:usd:fy:hs2:*"]
    status: shown
    bundle: [trade-hs2-exports-fy, trade-hs2-imports-fy]
    plate: "What India sells, and what it buys: by chapter"
  - match: ["meidb:*:usd:monthly:hs2:*"]
    status: baked
    bundle: [trade-hs2-exports, trade-hs2-imports]
  - match: ["meidb:*:usd:ytd:hs2:*"]
    status: baked
    bundle: [trade-hs2-exports-ytd, trade-hs2-imports-ytd]
  - match: ["meidb:*:inr:*:hs2:*"]
    status: baked
    bundle: [trade-hs2-exports-inr, trade-hs2-imports-inr, trade-hs2-exports-fy-inr, trade-hs2-imports-fy-inr, trade-hs2-exports-ytd-inr, trade-hs2-imports-ytd-inr]
  # ---------------- headings (4 digits) ----------------
  - match: ["meidb:export:usd:monthly:hs4:8517", "meidb:export:usd:monthly:hs4:2710", "meidb:export:usd:monthly:hs4:3004", "meidb:export:usd:monthly:hs4:1006",
            "meidb:import:usd:monthly:hs4:2709", "meidb:import:usd:monthly:hs4:7108", "meidb:import:usd:monthly:hs4:1511", "meidb:import:usd:monthly:hs4:2701"]
    status: shown
    bundle: [trade-hs4-exports, trade-hs4-imports]
    plate: "What it has to do with your house: eight goods"
  - match: ["meidb:*:usd:monthly:hs4:*"]
    status: baked
    bundle: [trade-hs4-exports, trade-hs4-imports]
  - match: ["meidb:*:usd:fy:hs4:*", "meidb:*:usd:ytd:hs4:*"]
    status: baked
    bundle: [trade-hs4-exports-fy, trade-hs4-imports-fy, trade-hs4-exports-ytd, trade-hs4-imports-ytd]
  - match: ["meidb:*:inr:*:hs4:*"]
    status: baked
    bundle: [trade-hs4-exports-inr, trade-hs4-imports-inr, trade-hs4-exports-fy-inr, trade-hs4-imports-fy-inr, trade-hs4-exports-ytd-inr, trade-hs4-imports-ytd-inr]
  # ---------------- subheadings and tariff lines (6 and 8 digits), one file per year ----------------
  - match: ["meidb:*:usd:monthly:hs6:*:*", "meidb:*:usd:monthly:hs8:*:*", "meidb:*:qty:monthly:hs8:*:*", "meidb:*:inr:monthly:hs6", "meidb:*:inr:monthly:hs8"]
    status: excluded
    archive: true
    rolls_up_to: [trade-hs4-exports, trade-hs4-imports]
    reason: "Held for the deep-archive tier: 5,600 subheadings and 11,000 tariff lines every month since January 2017, in US dollars, rupees and quantity, one file per year on one HS edition (about 2 million rows each way); the 4-digit headings they add up to are baked."
  - match: ["meidb:*:qty:monthly:hs2", "meidb:*:qty:monthly:hs4", "meidb:*:qty:monthly:hs6"]
    status: excluded
    reason: "At 2, 4 and 6 digits TradeStat prints quantities with no unit, adding kilograms, numbers and litres of different goods into one figure that cannot be read as an amount; quantities are baked at 8 digits, each in its own unit."
  - match: ["meidb:*:*:fy:hs6", "meidb:*:*:fy:hs8"]
    status: excluded
    reason: "Financial-year running totals of the 6- and 8-digit lines, which are the sums of the monthly lines baked in each year's file."
  - match: ["meidb:*:*:calendar-ytd:*"]
    status: excluded
    reason: "Calendar-year running totals of the same monthly figures, which are baked month by month."
  # ---------------- partners and regions ----------------
  - match: ["meidb:*:usd:fy:country:*"]
    status: shown
    bundle: [trade-partners-exports-fy, trade-partners-imports-fy, trade-partners-balance-fy]
    plate: "With whom: the largest deficits and surpluses"
  - match: ["meidb:*:usd:monthly:country:*", "meidb:*:usd:ytd:country:*"]
    status: baked
    bundle: [trade-partners-exports, trade-partners-imports, trade-partners-balance, trade-partners-exports-ytd, trade-partners-imports-ytd]
  - match: ["meidb:*:inr:*:country:*"]
    status: baked
    bundle: [trade-partners-exports-inr, trade-partners-imports-inr, trade-partners-exports-fy-inr, trade-partners-imports-fy-inr, trade-partners-exports-ytd-inr, trade-partners-imports-ytd-inr]
  - match: ["meidb:*:*:*:country-silent:*", "meidb:*:*:*:country-silent-hs*:*"]
    status: excluded
    reason: "Territories in TradeStat's country list that it has never printed with any trade in a monthly table since January 2017; there is nothing to bake."
  - match: ["meidb:*:usd:fy:region:*.*", "meidb:*:usd:monthly:region:*", "meidb:*:usd:ytd:region:*", "meidb:*:inr:*:region:*"]
    status: baked
    bundle: [trade-regions-exports, trade-regions-imports, trade-regions-exports-fy, trade-regions-imports-fy, trade-regions-exports-ytd, trade-regions-imports-ytd,
             trade-regions-exports-inr, trade-regions-imports-inr, trade-regions-exports-fy-inr, trade-regions-imports-fy-inr, trade-regions-exports-ytd-inr, trade-regions-imports-ytd-inr]
  - match: ["meidb:*:usd:fy:region:*"]
    status: shown
    bundle: [trade-regions-exports-fy, trade-regions-imports-fy]
    plate: "With whom: by region"
  - match: ["meidb:*:*:*:country-table", "meidb:*:*:*:region-table"]
    status: excluded
    reason: "The same partner figures as the region-wise table, which carries every country under its region and is baked (checked July 2026: identical values; the country table adds only territories printed at zero)."
  - match: ["meidb:*:*:*:predefined-groups"]
    status: excluded
    reason: "BIMSTEC, the Central Asian and CIS group and the Eurasian Economic Union are sums of their member countries, each of which is baked."
  - match: ["meidb:*:any:any:customised-groups"]
    status: excluded
    reason: "Groups of countries a reader assembles on the site; every member country is baked."
  # ---------------- commodity x partner ----------------
  - match: ["meidb:export:usd:fy:country-hs2:423", "meidb:import:usd:fy:country-hs2:77"]
    status: shown
    bundle: [trade-partner-hs2-exports, trade-partner-hs2-imports]
    plate: "What goes to America, and what comes from China"
  - match: ["meidb:*:usd:fy:country-hs2:*", "meidb:*:usd:fy:country-hs4:*"]
    status: baked
    bundle: [trade-partner-hs2-exports, trade-partner-hs2-imports, trade-partner-hs4-exports, trade-partner-hs4-imports]
  - match: ["meidb:*:usd:ytd:country-hs2:*", "meidb:*:usd:ytd:country-hs4:*"]
    status: baked
    bundle: [trade-partner-hs2-exports-ytd, trade-partner-hs2-imports-ytd, trade-partner-hs4-exports-ytd, trade-partner-hs4-imports-ytd]
  - match: ["meidb:*:usd:monthly:country-hs*", "meidb:*:usd:fy:country-hs6", "meidb:*:usd:fy:country-hs8", "meidb:*:usd:ytd:country-hs6", "meidb:*:usd:ytd:country-hs8", "meidb:*:inr:any:country-hs*", "meidb:*:qty:any:country-hs*"]
    status: excluded
    reason: "Partner detail is baked for whole years at chapter and heading level; the month-by-month, rupee, quantity and 6- and 8-digit partner tables are TradeStat's one-partner-per-request views of the same shipments (about 50,000 requests for the monthly history alone) and are left to TradeStat, an owner decision recorded in docs/status/trade.md."
  - match: ["meidb:*:any:any:commodity-all-countries", "meidb:*:any:any:region-all-commodities"]
    status: excluded
    reason: "The same commodity-by-partner tables read the other way (one product across every partner, or one region across every product), whose cells are the baked partner tables."
  - match: ["meidb:*:any:any:principal-commodity-hs", "meidb:*:any:any:country-principal-commodity-hs"]
    status: excluded
    reason: "The 8-digit lines behind each principal commodity: the same lines as the baked tariff-line files, regrouped."
  # ---------------- principal commodities (FTPA) ----------------
  - match: ["ftpa:*:usd:fy:group:*", "ftpa:*:usd:fy:total", "ftpa:*:usd:fy:item:g6"]
    status: shown
    bundle: [trade-principal-exports-fy, trade-principal-imports-fy]
    plate: "What India sells, and what it buys; how much of the deficit is oil and gold"
  - match: ["ftpa:*:usd:fy:item:*"]
    status: baked
    bundle: [trade-principal-exports-fy, trade-principal-imports-fy]
  - match: ["ftpa:*:usd:monthly:total"]
    status: shown
    bundle: [trade-principal-exports, trade-principal-imports]
    plate: "The current reading: the first estimate for the latest month"
  - match: ["ftpa:*:usd:monthly:*"]
    status: baked
    bundle: [trade-principal-exports, trade-principal-imports]
  - match: ["ftpa:*:inr:*"]
    status: baked
    bundle: [trade-principal-exports-inr, trade-principal-imports-inr, trade-principal-exports-fy-inr, trade-principal-imports-fy-inr]
  - match: ["ftpa:*:any:any:summary-report"]
    status: excluded
    reason: "The summary form prints only the 21 group totals, which the detailed form, baked, prints as well."
  - match: ["ftpa:view:export-matrix-new", "ftpa:view:import-matrix-new", "ftpa:view:export-top-n-commodities-new", "ftpa:view:export-top-n-countries"]
    status: excluded
    reason: "Rankings (the top five to twenty products or partners) cut from tables that are baked whole."
  - match: ["ftpa:view:export-region-wise", "ftpa:view:export-region-xcountry-wise"]
    status: excluded
    reason: "Exports only, by region and country since 2010; the partner history since 2009-10 is baked from the total-trade table, which carries imports as well."
  # ---------------- FTSPCC ----------------
  - match: ["ftspcc:*:qty:monthly:item:*"]
    status: baked
    bundle: [trade-principal-quantity-exports, trade-principal-quantity-imports]
  - match: ["ftspcc:*:usd:monthly:items", "ftspcc:*:inr:monthly:items"]
    status: excluded
    reason: "The same principal-commodity values as the FTPA tables, which are baked, printed month by month instead of as running totals."
  - match: ["ftspcc:*:inr-per-unit:monthly:items", "ftspcc:*:usd-per-unit:monthly:items"]
    status: excluded
    reason: "Unit values are a principal commodity's value divided by its quantity, both of which are baked."
  - match: ["ftspcc:ttrade:usd:fy:country:china-p-rp", "ftspcc:ttrade:usd:fy:country:u-s-a"]
    status: shown
    bundle: trade-partners-long
    plate: "With whom: China and the United States since 2009-10"
  - match: ["ftspcc:ttrade:usd:fy:country:*"]
    status: baked
    bundle: trade-partners-long
  - match: ["ftspcc:ttrade:inr:fy:country:*"]
    status: baked
    bundle: trade-partners-long-inr
  - match: ["ftspcc:ttrade:any:monthly:partial-year"]
    status: excluded
    reason: "For part of a year the total-trade table's partners do not add up to India's trade (the August 2026 table's exports sum to US$ 18,321 million against 215,488 for April to August), so only its March tables, which are whole years, are used."
  - match: ["ftspcc:export:any:monthly:country-wise"]
    status: excluded
    reason: "Exports only; the monthly partner tables from 2017 and the yearly partner history from 2009-10, both baked, carry imports too."
  - match: ["ftspcc:view:*"]
    status: excluded
    reason: "Principal commodities crossed with partners or regions: the same shipments as the commodity-by-partner tables baked at chapter and heading level, regrouped by export promotion council."
  # ---------------- the annual bank ----------------
  - match: ["eidb:*"]
    status: excluded
    reason: "The annual bank's commodity tables for 2023-24 count every shipment twice (chapters add up to exactly twice the printed total, checked 2026-10-09), so every annual figure is taken from the monthly bank's March tables instead."
