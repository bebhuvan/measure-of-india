  - bundle: external-fdi
    series: a_i_a_gross_inflows_gross_investment
    idh: "EXBPCDIFDI11M:IND"
    transform: level
    scale: 0.000001
    tolerance: 1
    note: "Gross FDI inflows into India, monthly, US$ million (DBIE report 34)."
  - bundle: external-fdi
    series: a_i_direct_investment_to_india
    idh: "EXBPNDIFDI11M:IND"
    transform: level
    scale: 0.000001
    tolerance: 1
    note: "Direct investment to India, net of repatriation, monthly, US$ million."
  - bundle: external-fdi
    series: b_i_b_fpis
    idh: "EXBPNDIFII11M:IND"
    transform: level
    scale: 0.000001
    tolerance: 1
    note: "Net portfolio investment by FPIs, monthly, US$ million (IDH EXBPNDIFPI11M matches no single line of report 34)."
  - bundle: external-fdi
    series: a_i_a_i_equity
    idh: "EXBPCDIDIE11M:IND"
    transform: level
    scale: 0.000001
    tolerance: 1
    note: "Gross FDI inflows, equity, monthly, US$ million."
