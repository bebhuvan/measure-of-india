  # IDH "Adj for mergers" (…AD19M) series are IDH's own adjustment: they match RBI's
  # "excluding merger" rows (credit-sectors-ex-merger) on 31 of 77 months, so they are not paired. IDH's fortnightly
  # BKASCBCTOT11F / BKLBDEPTOT11F growth (adjusted for mergers) sits on report 689's fortnight
