name: data-release rebuild

# Release topology (docs/RELEASE-CHECKLIST.md):
#   cron/dispatch → fetch → validate → prose → build → QC → release PR
#   PR merge (workflow: deploy) → build → QC → publish
# Nothing reaches production without passing every gate AND a human merge.
# The bot never pushes to the default branch.

on:
  schedule:
    - cron: "30 8 12 * *"        # CPI release day, ~14:00 IST
    - cron: "30 8 28 2,5,8,11 *" # NAS release days
    - cron: "30 8 * * 1"         # weekly safety net
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-release
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python for the XLSX source replays
        run: pip install -r requirements.txt

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Persist the throttle-survival cache across runs: a died-mid-product
      # ingest must not refetch the thousands of pages it already has.
      - name: Restore http cache
        uses: actions/cache@v4
        with:
          path: data/raw/http-cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Install source extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch and validate data
        run: node scripts/fetch.mjs && node scripts/validate.mjs

      # a new print of a guide's headline figure enters the release log the feeds read
      - name: Release log
        run: node scripts/releases.mjs

      # A print advance flags every .now paragraph bound to it. The release
      # PR is still opened so a human can re-read the flagged paragraphs on
      # it — ci.yml (which runs this gate hard) is what blocks the merge.
      - name: As-of governance (flag stale paragraphs for the PR)
        continue-on-error: true
        run: node pipeline/asof.mjs

      - name: Regenerate dated prose
        id: prose
        if: ${{ secrets.INDIA_ATLAS_LLM_KEY != '' }}
        continue-on-error: true # prose must never block a data release…
        env:
          INDIA_ATLAS_LLM_BASE: ${{ secrets.INDIA_ATLAS_LLM_BASE }}
          INDIA_ATLAS_LLM_KEY: ${{ secrets.INDIA_ATLAS_LLM_KEY }}
          INDIA_ATLAS_LLM_MODEL: ${{ secrets.INDIA_ATLAS_LLM_MODEL }}
        run: npm run prose
        # …but stale prose cannot ship either: if the data moved and this step
        # failed, the QC freshness gate below fails the run. The correct
        # recovery is to fix prose and re-run, never to deploy around it.

      # not `npm run build`, which would fetch and validate a second time
      - name: Build
        run: npm run og && npx astro build

      - name: QC (rendered numbers, charts, prose freshness)
        run: npm run qc   # qc.mjs + lint-charts.mjs — the full post-build gate

      - name: Performance, static (bytes per page, files per deploy, search)
        run: npm run perf:static

      - name: Search, feeds and app
        run: node scripts/seo-check.mjs

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "india-atlas-bot"
          git config user.email "bot@measure.thisindianlife.today"
          BRANCH="release/$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add data/series data/raw data/coverage data/releases.json pipeline/out
          if git diff --cached --quiet; then
            echo "no data change — no release PR needed"
            exit 0
          fi
          git commit -m "data: new vintage $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release $(date -u +%Y-%m-%d)" \
            --body "Automated release. Gates run in CI: fetch, validate, as-of (flags are non-blocking here; ci.yml enforces them — re-read flagged paragraphs per docs/RELEASE-CHECKLIST.md §1b), build, QC (rendered numbers + prose freshness). Reviewer: follow docs/RELEASE-CHECKLIST.md — the two prose diffs and the series diff summary. Merge to deploy."
          echo "PR_OPENED=1" >> "$GITHUB_OUTPUT"
