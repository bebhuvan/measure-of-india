name: deploy

# Publishes only what has already passed the release gates and a human merge.
# Builds from the committed data — this workflow never fetches, so what is
# deployed is exactly what was reviewed in the release PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python for the XLSX source replays
        run: pip install -r requirements.txt

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (no refetch — deploy exactly what was reviewed)
        run: npx astro build

      - name: QC
        run: npm run qc   # qc.mjs + lint-charts.mjs — the full post-build gate

      # Last line of defence (AGENTS.md rule 4): a stale hand-written "As of"
      # paragraph must stop the deploy, not just the PR that carried it.
      - name: As-of governance (hand-written paragraphs)
        run: node pipeline/asof.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=india-atlas
