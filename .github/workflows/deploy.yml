name: deploy

# Publishes only what has already passed the release gates and a human merge.
# Builds from the committed data — this workflow never fetches, so what is
# deployed is exactly what was reviewed in the release PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python for the XLSX source replays
        run: pip install -r requirements.txt

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (no refetch — deploy exactly what was reviewed)
        run: npx astro build
        # The build's heap peaks near 3.3 GB on Node's default 4 GB (2026-10-19, bounded bundle cache in
        # src/dossiers/everycut.js); 6 GB of a 16 GB runner leaves room for the data to grow.
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: QC
        run: npm run qc   # qc.mjs + lint-charts.mjs — the full post-build gate

      # Last line of defence (AGENTS.md rule 4): a stale hand-written "As of"
      # paragraph must stop the deploy, not just the PR that carried it.
      - name: As-of governance (hand-written paragraphs)
        run: node pipeline/asof.mjs

      # Bytes per page, search quality and the file count. The site is Workers static assets
      # (wrangler.jsonc): Workers Paid allows 100,000 files a version; perf/budgets.json caps the
      # deploy at 90,000 to leave room for a data wave.
      - name: Performance, static
        run: npm run perf:static

      # titles, canonicals, structured data, sitemap, feeds, llms.txt, manifest and service worker
      - name: Search, feeds and app
        run: node scripts/seo-check.mjs

      # IndexNow (Bing and others): the key file goes into dist before the deploy, the changed
      # pages are sent after it. Skipped when the INDEXNOW_KEY secret is not set.
      - name: IndexNow, prepare
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs prepare dist

      - name: Deploy to Cloudflare Workers (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy

      - name: IndexNow, submit
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs submit
